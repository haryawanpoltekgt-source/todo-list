<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Piket & Scan Barcode - Portal Asset & System</title>
  
  <!-- Memuat Library Html5-Qrcode untuk Scan Kamera Langsung -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    :root {
      --bg-app: #12161f;
      --card-bg: #1c2230;
      --text-main: #f1f3f5;
      --text-secondary: #9099a2;
      --border-color: #2a3447;
      --accent-green: #22c55e;
      --accent-blue: #3b82f6;
      --accent-purple: #8b5cf6;
      --accent-red: #ef4444;
      --accent-warn: #f59e0b;
    }

    * { 
      box-sizing: border-box; 
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-app);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 500px;
      height: 100%;
      max-height: 100vh;
      background: var(--bg-app);
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
      flex-shrink: 0;
    }

    .back-nav {
      color: var(--accent-blue);
      text-decoration: none;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
    }
    .back-nav:hover { text-decoration: underline; }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      flex: 1;
      margin: 16px 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 14px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      overflow-y: auto;
    }

    h2 {
      margin: 0;
      color: #ffffff;
      font-size: 18px;
    }

    .scanner-box {
      background: #161b26;
      border: 2px dashed var(--border-color);
      border-radius: 10px;
      min-height: 220px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: var(--text-secondary);
      font-size: 13px;
      position: relative;
      overflow: hidden;
    }

    #reader {
      width: 100% !important;
      border: none !important;
    }
    #reader video {
      border-radius: 8px;
      object-fit: cover;
    }

    .btn-scan {
      background: linear-gradient(135deg, var(--accent-green), #16a34a);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 13.5px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3);
    }
    .btn-scan:hover { opacity: 0.9; }

    .btn-stop {
      background: linear-gradient(135deg, var(--accent-red), #dc2626);
      color: white;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 12.5px;
      cursor: pointer;
      display: none;
    }

    #loadingOverlay {
      display: none;
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(18, 22, 31, 0.85);
      backdrop-filter: blur(5px);
      z-index: 2000;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      gap: 12px;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid var(--border-color);
      border-top: 4px solid var(--accent-blue);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    .footer-info {
      text-align: center;
      font-size: 11px;
      color: var(--text-secondary);
      flex-shrink: 0;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- Loading Overlay -->
  <div id="loadingOverlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(18,22,31,0.85); z-index:2000; justify-content:center; align-items:center; flex-direction:column; gap:12px;">
    <div class="spinner"></div>
    <div style="font-size: 13px; font-weight: 600; color: #fff;" id="loadingText">Menyimpan data piket...</div>
  </div>

  <div class="header">
    <a href="index.html" class="back-nav">← Menu Utama</a>
    <span id="userInfoLabel" style="font-size: 11px; color: var(--accent-green); font-weight: 600;">Memuat sesi...</span>
  </div>

  <div class="card">
    <h2>Piket & Daftar Hadir Area</h2>
    <p style="font-size: 12.5px; color: var(--text-secondary); margin: 0; line-height: 1.4;">
      Silakan lakukan pemindaian (scan) barcode pada area piket yang dikunjungi sebagai bentuk bukti kehadiran.
    </p>

    <div class="scanner-box" id="scannerContainer">
      <div id="reader"></div>
      <div id="placeholderText" style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
        <span style="font-size: 32px;">📷</span>
        <span>Arahkan kamera ke Barcode Area</span>
      </div>
    </div>

    <button class="btn-scan" id="btnStartScan" onclick="mulaiScanKamera()">Mulai Scan Barcode Area</button>
    <button class="btn-stop" id="btnStopScan" onclick="hentikanScanKamera()">Tutup Kamera</button>
  </div>

  <div class="footer-info">
    Portal Asset & System &copy; 2026
  </div>
</div>

<script src="config.js"></script>
<script>
  const API_URL = CONFIG.API_URL;
  let html5QrCode = null;

  window.onload = () => {
    const savedNama = localStorage.getItem("pbas_nama");
    const savedNip = localStorage.getItem("pbas_nip");
    const savedRole = localStorage.getItem("pbas_role");

    if (!savedNama) {
      alert("Sesi login tidak ditemukan. Silakan login terlebih dahulu melalui menu utama.");
      window.location.href = "index.html";
      return;
    }

    document.getElementById("userInfoLabel").textContent = `👤 ${savedNama} (${savedRole})`;
  };

  function showLoading(text) {
    document.getElementById("loadingText").textContent = text;
    document.getElementById("loadingOverlay").style.display = "flex";
  }

  function hideLoading() {
    document.getElementById("loadingOverlay").style.display = "none";
  }

  function mulaiScanKamera() {
    const placeholder = document.getElementById("placeholderText");
    placeholder.style.display = "none";

    document.getElementById("btnStartScan").style.display = "none";
    document.getElementById("btnStopScan").style.display = "block";

    html5QrCode = new Html5Qrcode("reader");
    const config = { fps: 10, qrbox: { width: 200, height: 200 } };

    html5QrCode.start(
      { facingMode: "environment" }, 
      config, 
      (decodedText, decodedResult) => {
        onScanSuccess(decodedText);
      },
      (errorMessage) => {}
    ).catch((err) => {
      alert("Gagal mengakses kamera. Pastikan Anda telah memberikan izin akses kamera.");
      hentikanScanKamera();
    });
  }

  async function onScanSuccess(decodedText) {
    hentikanScanKamera();

    const nipUser = localStorage.getItem("pbas_nip");
    const namaUser = localStorage.getItem("pbas_nama");

    if (!nipUser || !namaUser) {
      alert("Sesi pegawai tidak valid. Silakan login ulang.");
      return;
    }

    showLoading("Menyimpan data piket ke sistem...");

    try {
      const response = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: new URLSearchParams({
          action: "addPiket",
          nip: nipUser,
          nama: namaUser,
          area: decodedText
        })
      });

      const res = await response.json();

      if (res.status === "success") {
        alert(`Berhasil!\nAbsen piket di area [${decodedText}] atas nama ${namaUser} (NIP: ${nipUser}) telah tercatat di database.`);
      } else {
        alert("Gagal mencatat absensi piket ke server.");
      }
    } catch (err) {
      console.error(err);
      alert("Terjadi kesalahan jaringan saat menyimpan data piket.");
    } finally {
      hideLoading();
    }
  }

  function hentikanScanKamera() {
    if (html5QrCode) {
      html5QrCode.stop().then(() => {
        html5QrCode.clear();
      }).catch(err => {
        console.error("Gagal menghentikan kamera.", err);
      });
    }

    document.getElementById("btnStopScan").style.display = "none";
    document.getElementById("btnStartScan").style.display = "block";
    document.getElementById("placeholderText").style.display = "flex";
  }
</script>

</body>
</html>
