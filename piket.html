<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Piket & Scan Barcode - Portal Asset & System</title>
  
  <!-- Memuat Library Html5-Qrcode untuk Scan Kamera Langsung -->
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>

  <style>
    :root {
      --bg-app: #12161f;
      --card-bg: #1c2230;
      --text-main: #f1f3f5;
      --text-secondary: #9099a2;
      --border-color: #2a3447;
      --accent-green: #22c55e;
      --accent-blue: #3b82f6;
      --accent-purple: #8b5cf6;
      --accent-red: #ef4444;
      --accent-warn: #f59e0b;
    }

    * { 
      box-sizing: border-box; 
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-app);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 500px;
      height: 100%;
      max-height: 100vh;
      background: var(--bg-app);
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
      flex-shrink: 0;
    }

    .back-nav {
      color: var(--accent-blue);
      text-decoration: none;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
    }
    .back-nav:hover { text-decoration: underline; }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      flex: 1;
      margin: 16px 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 14px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      overflow-y: auto;
    }

    h2 {
      margin: 0;
      color: #ffffff;
      font-size: 18px;
    }

    .scanner-box {
      background: #161b26;
      border: 2px dashed var(--border-color);
      border-radius: 10px;
      min-height: 220px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: var(--text-secondary);
      font-size: 13px;
      position: relative;
      overflow: hidden;
    }

    #reader {
      width: 100% !important;
      border: none !important;
    }
    #reader video {
      border-radius: 8px;
      object-fit: cover;
    }

    .btn-scan {
      background: linear-gradient(135deg, var(--accent-green), #16a34a);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 13.5px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3);
    }
    .btn-scan:hover { opacity: 0.9; }

    .btn-stop {
      background: linear-gradient(135deg, var(--accent-red), #dc2626);
      color: white;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 12.5px;
      cursor: pointer;
      display: none;
    }

    #loadingOverlay {
      display: none;
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(18, 22, 31, 0.85);
      backdrop-filter: blur(5px);
      z-index: 2000;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      gap: 12px;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid var(--border-color);
      border-top: 4px solid var(--accent-blue);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    /* Custom Alert Overlay Styles */
    .custom-alert-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(4px);
      z-index: 3000;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .custom-alert-box {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      width: 100%;
      max-width: 360px;
      border-radius: 14px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      gap: 14px;
      animation: alertPop 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    @keyframes alertPop {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .alert-icon-wrapper {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      margin: 0 auto;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 22px;
    }
    .alert-icon-warning { background: rgba(245, 158, 11, 0.15); color: var(--accent-warn); border: 1px solid rgba(245, 158, 11, 0.3); }
    .alert-icon-success { background: rgba(34, 197, 94, 0.15); color: var(--accent-green); border: 1px solid rgba(34, 197, 94, 0.3); }
    .alert-icon-danger { background: rgba(239, 68, 68, 0.15); color: var(--accent-red); border: 1px solid rgba(239, 68, 68, 0.3); }
    .alert-icon-info { background: rgba(59, 130, 246, 0.15); color: var(--accent-blue); border: 1px solid rgba(59, 130, 246, 0.3); }
    
    .custom-alert-box h4 { margin: 0; font-size: 16px; color: #ffffff; font-weight: 700; }
    .custom-alert-box p { margin: 0; font-size: 13px; color: var(--text-secondary); line-height: 1.5; }
    
    .alert-actions {
      display: flex;
      gap: 8px;
      justify-content: center;
    }
    .btn-alert-ok {
      flex: 1;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
      color: white;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
    }

    .footer-info {
      text-align: center;
      font-size: 11px;
      color: var(--text-secondary);
      flex-shrink: 0;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- Loading Overlay -->
  <div id="loadingOverlay">
    <div class="spinner"></div>
    <div style="font-size: 13px; font-weight: 600; color: #fff;" id="loadingText">Menyimpan data piket...</div>
  </div>

  <!-- Custom Alert Overlay Component -->
  <div class="custom-alert-overlay" id="customAlertOverlay">
    <div class="custom-alert-box">
      <div class="alert-icon-wrapper" id="alertIcon">⚠️</div>
      <h4 id="alertTitle">Informasi Sistem</h4>
      <p id="alertMessage">Pesan pemberitahuan...</p>
      <div class="alert-actions" id="alertActions">
        <button class="btn-alert-ok" onclick="closeCustomAlert()">Mengerti</button>
      </div>
    </div>
  </div>

  <div class="header">
    <a href="index.html" class="back-nav">← Menu Utama</a>
    <span id="userInfoLabel" style="font-size: 11px; color: var(--accent-green); font-weight: 600;">Memuat sesi...</span>
  </div>

  <div class="card">
    <h2>Piket & Daftar Hadir Area</h2>
    <p style="font-size: 12.5px; color: var(--text-secondary); margin: 0; line-height: 1.4;">
      Silakan lakukan pemindaian (scan) barcode pada area piket yang dikunjungi sebagai bentuk bukti kehadiran.
    </p>

    <div class="scanner-box" id="scannerContainer">
      <div id="reader"></div>
      <div id="placeholderText" style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
        <span style="font-size: 32px;">📷</span>
        <span>Arahkan kamera ke Barcode Area</span>
      </div>
    </div>

    <button class="btn-scan" id="btnStartScan" onclick="mulaiScanKamera()">Mulai Scan Barcode Area</button>
    <button class="btn-stop" id="btnStopScan" onclick="hentikanScanKamera()">Tutup Kamera</button>
  </div>

  <div class="footer-info">
    Portal Asset & System &copy; 2026
  </div>
</div>

<script src="config.js"></script>
<script>
  const API_URL = CONFIG.API_URL;
  let html5QrCode = null;

  window.onload = () => {
    const savedNama = localStorage.getItem("pbas_nama");
    const savedNip = localStorage.getItem("pbas_nip");
    const savedRole = localStorage.getItem("pbas_role");

    if (!savedNama) {
      showCustomAlert("Sesi Tidak Ditemukan", "Sesi login tidak ditemukan. Silakan login terlebih dahulu.", "warning", () => {
        window.location.href = "index.html";
      });
      return;
    }

    document.getElementById("userInfoLabel").textContent = `👤 ${savedNama} (${savedRole})`;
  };

  function showLoading(text) {
    document.getElementById("loadingText").textContent = text;
    document.getElementById("loadingOverlay").style.display = "flex";
  }

  function hideLoading() {
    document.getElementById("loadingOverlay").style.display = "none";
  }

  function showCustomAlert(title, message, type = "warning", callback = null) {
    document.getElementById("alertTitle").textContent = title;
    document.getElementById("alertMessage").textContent = message;
    
    const iconEl = document.getElementById("alertIcon");
    iconEl.className = "alert-icon-wrapper";
    if (type === "warning") {
      iconEl.textContent = "⚠️";
      iconEl.classList.add("alert-icon-warning");
    } else if (type === "success") {
      iconEl.textContent = "✅";
      iconEl.classList.add("alert-icon-success");
    } else if (type === "danger") {
      iconEl.textContent = "🗑️";
      iconEl.classList.add("alert-icon-danger");
    } else {
      iconEl.textContent = "ℹ️";
      iconEl.classList.add("alert-icon-info");
    }

    window._alertCallback = callback;
    document.getElementById("customAlertOverlay").style.display = "flex";
  }

  function closeCustomAlert() {
    document.getElementById("customAlertOverlay").style.display = "none";
    if (window._alertCallback && typeof window._alertCallback === "function") {
      window._alertCallback();
      window._alertCallback = null;
    }
  }

  function mulaiScanKamera() {
    const placeholder = document.getElementById("placeholderText");
    placeholder.style.display = "none";

    document.getElementById("btnStartScan").style.display = "none";
    document.getElementById("btnStopScan").style.display = "block";

    html5QrCode = new Html5Qrcode("reader");
    const config = { fps: 10, qrbox: { width: 200, height: 200 } };

    html5QrCode.start(
      { facingMode: "environment" }, 
      config, 
      (decodedText, decodedResult) => {
        onScanSuccess(decodedText);
      },
      (errorMessage) => {}
    ).catch((err) => {
      showCustomAlert("Gagal Kamera", "Gagal mengakses kamera. Pastikan Anda telah memberikan izin akses kamera.", "danger");
      hentikanScanKamera();
    });
  }

  async function onScanSuccess(decodedText) {
    hentikanScanKamera();

    const nipUser = localStorage.getItem("pbas_nip");
    const namaUser = localStorage.getItem("pbas_nama");

    if (!nipUser || !namaUser) {
      showCustomAlert("Sesi Tidak Valid", "Sesi pegawai tidak valid. Silakan login ulang.", "warning");
      return;
    }

    showLoading("Menyimpan data piket ke sistem...");

    try {
      const response = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: new URLSearchParams({
          action: "addPiket",
          nip: nipUser,
          nama: namaUser,
          area: decodedText
        })
      });

      const res = await response.json();

      if (res.status === "success") {
        showCustomAlert("Absen Berhasil", `Absen piket di area [${decodedText}] atas nama ${namaUser} telah tercatat di database.`, "success");
      } else {
        showCustomAlert("Gagal Menyimpan", "Gagal mencatat absensi piket ke server.", "danger");
      }
    } catch (err) {
      console.error(err);
      showCustomAlert("Kesalahan Jaringan", "Terjadi kesalahan jaringan saat menyimpan data piket.", "danger");
    } finally {
      hideLoading();
    }
  }

  function hentikanScanKamera() {
    if (html5QrCode) {
      html5QrCode.stop().then(() => {
        html5QrCode.clear();
      }).catch(err => {
        console.error("Gagal menghentikan kamera.", err);
      });
    }

    document.getElementById("btnStopScan").style.display = "none";
    document.getElementById("btnStartScan").style.display = "block";
    document.getElementById("placeholderText").style.display = "flex";
  }
</script>

</body>
</html>
