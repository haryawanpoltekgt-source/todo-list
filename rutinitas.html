<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Rutinitas - Portal Asset & System</title>
  <style>
    :root {
      --bg-app: #12161f;
      --card-bg: #1c2230;
      --card-hover: #242c3d;
      --text-main: #f1f3f5;
      --text-secondary: #9099a2;
      --border-color: #2a3447;
      --accent-purple: #8b5cf6;
      --accent-blue: #3b82f6;
      --accent-green: #22c55e;
      --accent-red: #ef4444;
      --accent-cyan: #06b6d4;
      --accent-warn: #f59e0b;
    }

    * { 
      box-sizing: border-box; 
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    input, select {
      -webkit-user-select: text;
      -moz-user-select: text;
      -ms-user-select: text;
      user-select: text;
    }

    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-app);
      color: var(--text-main);
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .container {
      width: 100%;
      max-width: 700px;
      height: 100%;
      max-height: 100vh;
      background: var(--bg-app);
      padding: 16px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    #loadingOverlay {
      display: none;
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(18, 22, 31, 0.85);
      backdrop-filter: blur(5px);
      z-index: 2000;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      gap: 12px;
    }
    .spinner {
      width: 45px;
      height: 45px;
      border: 4px solid var(--border-color);
      border-top: 4px solid var(--accent-purple);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .loading-text { font-size: 13px; font-weight: 600; color: var(--text-main); }

    .custom-alert-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(4px);
      z-index: 3000;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .custom-alert-box {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      width: 100%;
      max-width: 360px;
      border-radius: 14px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      gap: 14px;
      animation: alertPop 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }
    @keyframes alertPop {
      0% { transform: scale(0.8); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
    .alert-icon-wrapper {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      margin: 0 auto;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 22px;
    }
    .alert-icon-warning { background: rgba(245, 158, 11, 0.15); color: var(--accent-warn); border: 1px solid rgba(245, 158, 11, 0.3); }
    .alert-icon-success { background: rgba(34, 197, 94, 0.15); color: var(--accent-green); border: 1px solid rgba(34, 197, 94, 0.3); }
    .alert-icon-danger { background: rgba(239, 68, 68, 0.15); color: var(--accent-red); border: 1px solid rgba(239, 68, 68, 0.3); }
    .alert-icon-info { background: rgba(59, 130, 246, 0.15); color: var(--accent-blue); border: 1px solid rgba(59, 130, 246, 0.3); }
    
    .custom-alert-box h4 { margin: 0; font-size: 16px; color: #ffffff; font-weight: 700; }
    .custom-alert-box p { margin: 0; font-size: 13px; color: var(--text-secondary); line-height: 1.5; }
    
    .alert-actions {
      display: flex;
      gap: 8px;
      justify-content: center;
    }
    .btn-alert-ok {
      flex: 1;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
      color: white;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
    }
    .btn-alert-cancel {
      flex: 1;
      background: #2a3447;
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 10px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
    }
    .btn-alert-danger-confirm {
      flex: 1;
      background: linear-gradient(135deg, #ef4444, #dc2626);
      color: white;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
    }

    .back-nav {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--accent-blue);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
      margin-bottom: 8px;
      text-decoration: none;
      flex-shrink: 0;
    }
    .back-nav:hover { text-decoration: underline; }

    .header-action-area {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 8px;
      flex-shrink: 0;
    }
    .header-top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }
    .header-buttons-group {
      display: flex;
      gap: 6px;
      align-items: center;
    }
    .brand-wrapper {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }
    h2 { 
      color: #ffffff; 
      margin: 0; 
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }
    .sub-title {
      font-size: 11px;
      color: var(--text-secondary);
    }

    .btn-action-base {
      border: none;
      padding: 8px 10px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }
    .btn-add-rutinitas {
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-blue));
      color: white;
      box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
    }
    .btn-add-rutinitas:hover { opacity: 0.9; }

    .btn-refresh {
      background-color: var(--card-bg);
      color: var(--text-secondary);
      border: 1px solid var(--border-color);
    }
    .btn-refresh:hover { background-color: var(--card-hover); color: var(--text-main); }

    .search-input {
      width: 100%;
      padding: 7px 10px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 12px;
      outline: none;
      background: var(--card-bg);
      color: var(--text-main);
    }
    .search-input:focus { border-color: var(--accent-purple); }

    .filter-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr auto;
      gap: 6px;
      align-items: flex-end;
      margin-bottom: 8px;
      flex-shrink: 0;
      background: var(--card-bg);
      padding: 8px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
    }
    .filter-grid label {
      font-size: 9.5px;
      font-weight: 700;
      color: var(--text-secondary);
      display: flex;
      flex-direction: column;
      gap: 3px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }
    .filter-grid select, .filter-grid input[type="date"] {
      width: 100%;
      padding: 5px 6px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 11px;
      outline: none;
      background: #161b26;
      color: var(--text-main);
      font-weight: 500;
    }
    .btn-reset-filter {
      background: #2a3447;
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 5px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      height: 27px;
    }
    .btn-reset-filter:hover { background: var(--card-hover); color: var(--accent-cyan); }

    .summary-area {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 7px 10px;
      margin-bottom: 8px;
      flex-shrink: 0;
    }
    .summary-title { font-size: 11px; font-weight: 700; color: var(--text-secondary); }
    .summary-badges { display: flex; gap: 5px; }
    .count-chip {
      font-size: 10.5px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 3px;
    }
    .count-rutin { background: rgba(6, 182, 212, 0.15); color: #22d3ee; border: 1px solid rgba(6, 182, 212, 0.3); }
    .count-jadwal { background: rgba(139, 92, 246, 0.15); color: #a78bfa; border: 1px solid rgba(139, 92, 246, 0.3); }

    .rutinitas-scroll-area {
      flex: 1;
      overflow-y: auto;
      padding-right: 2px;
      -webkit-overflow-scrolling: touch;
    }
    ul { list-style: none; padding: 0; margin: 0; }

    .rutinitas-item-card {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-left: 4px solid var(--accent-cyan);
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      transition: all 0.2s ease;
    }
    .rutinitas-item-card:hover {
      background: var(--card-hover);
      border-color: var(--accent-purple);
      transform: translateY(-2px);
    }
    .rutinitas-item-card.type-tanggal {
      border-left: 4px solid var(--accent-purple);
    }

    .item-left {
      display: flex;
      flex-direction: column;
      gap: 4px;
      overflow: hidden;
      flex: 1;
      padding-right: 10px;
    }
    .item-title {
      font-size: 13.5px;
      font-weight: 700;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .item-meta {
      font-size: 11px;
      color: var(--text-secondary);
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    .badge-pic {
      background: rgba(139, 92, 246, 0.15);
      color: #a78bfa;
      border: 1px solid rgba(139, 92, 246, 0.3);
      padding: 2px 8px;
      border-radius: 5px;
      font-size: 11px;
      font-weight: 600;
    }
    .badge-jadwal {
      background: rgba(6, 182, 212, 0.15);
      color: #22d3ee;
      border: 1px solid rgba(6, 182, 212, 0.3);
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
    }
    .type-tanggal .badge-jadwal {
      background: rgba(139, 92, 246, 0.15);
      color: #a78bfa;
      border: 1px solid rgba(139, 92, 246, 0.3);
    }

    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 12px;
    }
    .modal-content {
      background: var(--card-bg);
      color: var(--text-main);
      width: 100%;
      max-width: 440px;
      padding: 18px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 8px;
    }
    .modal-header h3 { margin: 0; color: #ffffff; font-size: 16px; }
    .btn-close-modal {
      background: transparent;
      border: none;
      font-size: 20px;
      cursor: pointer;
      color: var(--text-secondary);
    }
    .modal-body {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .modal-body label {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-secondary);
    }
    .modal-body input, .modal-body select {
      padding: 9px 12px;
      font-size: 12.5px;
      font-family: inherit;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      outline: none;
      background: #161b26;
      color: var(--text-main);
    }
    .modal-body input:focus, .modal-body select:focus {
      border-color: var(--accent-purple);
    }
    .modal-body input:disabled, .modal-body select:disabled {
      background-color: #1a202c;
      color: #94a3b8;
      cursor: not-allowed;
    }
    .radio-group {
      display: flex;
      gap: 12px;
      margin-top: 4px;
      font-size: 12px;
      color: var(--text-main);
    }
    .radio-group label {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }
    .modal-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--border-color);
      padding-top: 10px;
    }
    .btn-delete {
      background: transparent;
      color: #f87171;
      border: none;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
    }
    .btn-delete:hover { text-decoration: underline; }
    .btn-save {
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-blue));
      color: white;
      border: none;
      padding: 9px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 12.5px;
    }
    .btn-cancel {
      background: #2a3447;
      color: #f1f3f5;
      border: 1px solid var(--border-color);
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 12.5px;
    }
  </style>
</head>
<body>

<div class="container">

  <div id="loadingOverlay">
    <div class="spinner"></div>
    <div class="loading-text" id="loadingText">Memproses data...</div>
  </div>

  <div class="custom-alert-overlay" id="customAlertOverlay">
    <div class="custom-alert-box">
      <div class="alert-icon-wrapper" id="alertIcon">⚠️</div>
      <h4 id="alertTitle">Informasi Sistem</h4>
      <p id="alertMessage">Pesan pemberitahuan...</p>
      <div class="alert-actions" id="alertActions">
        <button class="btn-alert-ok" id="btnAlertOk" onclick="closeCustomAlert()">Mengerti</button>
      </div>
    </div>
  </div>

  <a href="index.html#workView" class="back-nav">← Kembali ke Web Kerja</a>

  <div class="header-action-area">
    <div class="header-top-row">
      <div class="brand-wrapper">
        <h2>Rutinitas Harian</h2>
        <span class="sub-title">Jadwal & checklist operasional rutin pegawai</span>
      </div>
      
      <div class="header-buttons-group">
        <button class="btn-action-base btn-refresh" onclick="loadRutinitas(true)" title="Muat Ulang & Perbarui Cache">🔄</button>
        <button class="btn-action-base btn-add-rutinitas" onclick="openAddModal()">
          <span>➕</span> Tambah
        </button>
      </div>
    </div>

    <input type="text" id="searchInput" class="search-input" placeholder="Cari kegiatan rutin..." oninput="renderRutinitas()">
  </div>

  <div class="filter-grid">
    <label>
      Filter PIC:
      <select id="filterPic" onchange="renderRutinitas()">
        <option value="ALL">Semua PIC</option>
      </select>
    </label>

    <label>
      Filter Hari:
      <select id="filterHari" onchange="renderRutinitas()">
        <option value="ALL">Semua Hari</option>
        <option value="Senin">Senin</option>
        <option value="Selasa">Selasa</option>
        <option value="Rabu">Rabu</option>
        <option value="Kamis">Kamis</option>
        <option value="Jumat">Jumat</option>
        <option value="Sabtu">Sabtu</option>
        <option value="Minggu">Minggu</option>
        <option value="Setiap Hari">Setiap Hari</option>
      </select>
    </label>

    <label>
      Filter Terjadwal:
      <input type="date" id="filterTanggal" onchange="renderRutinitas()">
    </label>

    <button class="btn-reset-filter" onclick="resetFilterTanggal()" title="Reset Tanggal">Reset</button>
  </div>

  <div class="summary-area">
    <span class="summary-title" id="summaryPicLabel">Total Rutinitas:</span>
    <div class="summary-badges">
      <span class="count-chip count-rutin">Hari: <b id="countHari">0</b></span>
      <span class="count-chip count-jadwal">Terjadwal: <b id="countTerjadwal">0</b></span>
    </div>
  </div>

  <div class="rutinitas-scroll-area">
    <ul id="rutinitasList">
      <div style="text-align:center; color:#9099a2; padding:30px;">Memuat data rutinitas...</div>
    </ul>
  </div>

</div>

<div class="modal-overlay" id="rutinitasModal">
  <div class="modal-content">
    <div class="modal-header">
      <h3 id="modalTitle">Tambah Rutinitas Baru</h3>
      <button class="btn-close-modal" onclick="closeModal()">&times;</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="modalActionType" value="add">
      <input type="hidden" id="modalRutinitasId">
      
      <label>
        Judul Kegiatan Rutin:
        <input type="text" id="inputJudul" placeholder="Contoh: Piket Area Smoking / Backup Server...">
      </label>

      <label>
        PIC Penanggung Jawab:
        <select id="selectPic">
          <option value="">-- Pilih PIC --</option>
        </select>
      </label>

      <label>
        Tipe Pengingat Jadwal:
        <div class="radio-group">
          <label><input type="radio" name="scheduleType" value="hari" checked onchange="toggleScheduleMode()"> Berdasarkan Hari</label>
          <label><input type="radio" name="scheduleType" value="tanggal" onchange="toggleScheduleMode()"> Tanggal & Jam Spesifik</label>
        </div>
      </label>

      <div id="modeHariGroup">
        <label>
          Ingatkan Setiap Hari:
          <select id="selectHari">
            <option value="Senin">Senin</option>
            <option value="Selasa">Selasa</option>
            <option value="Rabu">Rabu</option>
            <option value="Kamis">Kamis</option>
            <option value="Jumat">Jumat</option>
            <option value="Sabtu">Sabtu</option>
            <option value="Minggu">Minggu</option>
            <option value="Setiap Hari">Setiap Hari (Senin - Minggu)</option>
          </select>
        </label>
      </div>

      <div id="modeTanggalGroup" style="display: none;">
        <label>
          Ingatkan di Tanggal & Waktu:
          <input type="datetime-local" id="inputTanggalWaktu">
        </label>
      </div>

    </div>
    <div class="modal-footer">
      <button class="btn-delete" id="modalDeleteBtn" onclick="requestDeleteRutinitas()" style="display:none;">Hapus</button>
      <div style="display: flex; gap: 6px;">
        <button class="btn-cancel" onclick="closeModal()">Batal</button>
        <button class="btn-save" id="modalSaveBtn" onclick="simpanRutinitas()">Simpan Rutinitas</button>
      </div>
    </div>
  </div>
</div>

<script src="config.js"></script>

<script>
  const API_URL = CONFIG.API_URL;
  
  let allRutinitas = [];
  let userListCache = [];
  let currentUserNama = localStorage.getItem("pbas_nama") || "";
  let currentUserRole = localStorage.getItem("pbas_role") || "Member";

  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState === "visible") {
      loadRutinitas(true);
    }
  });

  function showLoading(text = "Memproses data...") {
    document.getElementById("loadingText").textContent = text;
    document.getElementById("loadingOverlay").style.display = "flex";
  }
  function hideLoading() {
    document.getElementById("loadingOverlay").style.display = "none";
  }

  function showCustomAlert(title, message, type = "warning") {
    document.getElementById("alertTitle").textContent = title;
    document.getElementById("alertMessage").textContent = message;
    
    const iconEl = document.getElementById("alertIcon");
    iconEl.className = "alert-icon-wrapper";
    if (type === "warning") {
      iconEl.textContent = "⚠️";
      iconEl.classList.add("alert-icon-warning");
    } else if (type === "success") {
      iconEl.textContent = "✅";
      iconEl.classList.add("alert-icon-success");
    } else if (type === "danger") {
      iconEl.textContent = "🗑️";
      iconEl.classList.add("alert-icon-danger");
    } else {
      iconEl.textContent = "ℹ️";
      iconEl.classList.add("alert-icon-info");
    }

    document.getElementById("alertActions").innerHTML = `
      <button class="btn-alert-ok" onclick="closeCustomAlert()">Mengerti</button>
    `;
    document.getElementById("customAlertOverlay").style.display = "flex";
  }

  function showCustomConfirm(title, message, onConfirmCallback) {
    document.getElementById("alertTitle").textContent = title;
    document.getElementById("alertMessage").textContent = message;
    
    const iconEl = document.getElementById("alertIcon");
    iconEl.className = "alert-icon-wrapper alert-icon-danger";
    iconEl.textContent = "⚠️";

    const actionsContainer = document.getElementById("alertActions");
    actionsContainer.innerHTML = `
      <button class="btn-alert-cancel" onclick="closeCustomAlert()">Batal</button>
      <button class="btn-alert-danger-confirm" id="btnConfirmDanger">Hapus</button>
    `;

    document.getElementById("btnConfirmDanger").onclick = () => {
      closeCustomAlert();
      onConfirmCallback();
    };

    document.getElementById("customAlertOverlay").style.display = "flex";
  }

  function closeCustomAlert() {
    document.getElementById("customAlertOverlay").style.display = "none";
  }

  async function loadUserList() {
    try {
      const response = await fetch(`${API_URL}?action=getUsers`);
      const res = await response.json();
      userListCache = Array.isArray(res) ? res : [];
      populatePicDropdown();
    } catch (e) {
      userListCache = [];
    }
  }

  function populatePicDropdown() {
    const select = document.getElementById("selectPic");
    select.innerHTML = '<option value="">-- Pilih PIC --</option>';
    userListCache.forEach(u => {
      const opt = document.createElement("option");
      opt.value = u.nama;
      opt.textContent = `${u.nama} (${u.nip})`;
      select.appendChild(opt);
    });

    const isSuperUser = currentUserRole.toLowerCase() === "superuser";
    if (!isSuperUser) {
      select.value = currentUserNama;
      select.disabled = true;
    }
  }

  function toggleScheduleMode() {
    const isHari = document.querySelector('input[name="scheduleType"]:checked').value === "hari";
    document.getElementById("modeHariGroup").style.display = isHari ? "block" : "none";
    document.getElementById("modeTanggalGroup").style.display = isHari ? "none" : "block";
  }

  function openAddModal() {
    document.getElementById("modalActionType").value = "add";
    document.getElementById("modalRutinitasId").value = "";
    document.getElementById("modalTitle").textContent = "Tambah Rutinitas Baru";
    document.getElementById("inputJudul").value = "";
    
    const selectPic = document.getElementById("selectPic");
    const isSuperUser = currentUserRole.toLowerCase() === "superuser";
    if (isSuperUser) {
      selectPic.disabled = false;
      selectPic.value = currentUserNama || "";
    } else {
      selectPic.value = currentUserNama || "";
      selectPic.disabled = true;
    }

    document.querySelector('input[value="hari"]').checked = true;
    document.getElementById("inputTanggalWaktu").value = "";
    document.getElementById("modalDeleteBtn").style.display = "none";
    
    document.getElementById("inputJudul").disabled = false;
    document.getElementById("selectHari").disabled = false;
    document.getElementById("inputTanggalWaktu").disabled = false;
    document.getElementById("modalSaveBtn").style.display = "inline-block";

    toggleScheduleMode();
    document.getElementById("rutinitasModal").style.display = "flex";
  }

  function openDetailModal(item) {
    document.getElementById("modalActionType").value = "edit";
    document.getElementById("modalRutinitasId").value = item.id || "";
    document.getElementById("modalTitle").textContent = `Detail Rutinitas (${item.id || ''})`;
    document.getElementById("inputJudul").value = item.judul || "";
    
    const selectPic = document.getElementById("selectPic");
    selectPic.value = item.pic || "";

    const hasValidTanggal = item.tanggal && item.tanggal.trim() !== "" && !item.tanggal.toLowerCase().includes("tidak bisa dipilih");

    if (hasValidTanggal) {
      document.querySelector('input[name="scheduleType"][value="tanggal"]').checked = true;
      toggleScheduleMode();
      
      // PERBAIKAN: Parsing string tanggal secara langsung agar tidak bergeser karena timezone UTC/Lokal
      let rawDateStr = item.tanggal.trim();
      let formattedDT = "";
      let dObj = new Date(rawDateStr);
      
      if (!isNaN(dObj.getTime())) {
        // Ekstrak komponen tahun, bulan, tanggal, jam, menit secara lokal dari objek date database
        let y = dObj.getFullYear();
        let m = String(dObj.getMonth() + 1).padStart(2, '0');
        let d = String(dObj.getDate()).padStart(2, '0');
        let h = String(dObj.getHours()).padStart(2, '0');
        let min = String(dObj.getMinutes()).padStart(2, '0');
        formattedDT = `${y}-${m}-${d}T${h}:${min}`;
      } else {
        // Fallback jika string manual
        formattedDT = rawDateStr.replace(' ', 'T').substring(0, 16);
      }
      
      document.getElementById("inputTanggalWaktu").value = formattedDT;
    } else {
      document.querySelector('input[name="scheduleType"][value="hari"]').checked = true;
      toggleScheduleMode();
      if (item.hari && !item.hari.toLowerCase().includes("tidak bisa dipilih")) {
        document.getElementById("selectHari").value = item.hari;
      }
    }

    const isSuperUser = currentUserRole.toLowerCase() === "superuser";
    const userClean = currentUserNama.trim().toLowerCase();
    const picClean = (item.pic || "").trim().toLowerCase();
    const isOwner = picClean === userClean || picClean.includes(userClean);
    const canEdit = isSuperUser || isOwner;

    const inputJudul = document.getElementById("inputJudul");
    const selectHari = document.getElementById("selectHari");
    const inputTanggalWaktu = document.getElementById("inputTanggalWaktu");
    const modalSaveBtn = document.getElementById("modalSaveBtn");
    const modalDeleteBtn = document.getElementById("modalDeleteBtn");

    if (!canEdit) {
      inputJudul.disabled = true;
      selectPic.disabled = true;
      selectHari.disabled = true;
      inputTanggalWaktu.disabled = true;
      modalSaveBtn.style.display = "none";
      modalDeleteBtn.style.display = "none";
    } else {
      inputJudul.disabled = false;
      selectPic.disabled = !isSuperUser;
      selectHari.disabled = false;
      inputTanggalWaktu.disabled = false;
      modalSaveBtn.style.display = "inline-block";
      modalDeleteBtn.style.display = "inline-block";
    }

    document.getElementById("rutinitasModal").style.display = "flex";
  }

  function closeModal() {
    document.getElementById("rutinitasModal").style.display = "none";
  }

  function resetFilterTanggal() {
    document.getElementById("filterTanggal").value = "";
    renderRutinitas();
  }

  async function loadRutinitas(forceRefresh = false) {
    const cachedRutinitas = localStorage.getItem("local_rutinitas_cache");

    if (cachedRutinitas && !forceRefresh) {
      try {
        allRutinitas = JSON.parse(cachedRutinitas);
        updatePicOptions();
        renderRutinitas();
      } catch (e) {
        console.error("Gagal parse cache lokal rutinitas");
      }
    } else {
      showLoading("Memuat data rutinitas terbaru...");
    }

    try {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 15000);

      const response = await fetch(`${API_URL}?action=getRutinitas`, { signal: controller.signal });
      clearTimeout(timeoutId);

      if (!response.ok) throw new Error("Network response was not ok");

      const result = await response.json();

      allRutinitas = Array.isArray(result) ? result : [];
      localStorage.setItem("local_rutinitas_cache", JSON.stringify(allRutinitas));

      updatePicOptions();
      renderRutinitas();
    } catch (err) {
      console.error(err);
      if (!cachedRutinitas || allRutinitas.length === 0) {
        document.getElementById("rutinitasList").innerHTML = `<li style="text-align:center; color:#f87171; padding:20px;">Gagal memuat data dari server.</li>`;
      }
    } finally {
      hideLoading();
    }
  }

  function updatePicOptions() {
    const filterPicSelect = document.getElementById("filterPic");
    const pics = [...new Set(allRutinitas.map(t => t.pic).filter(p => p && p !== "-"))];

    filterPicSelect.innerHTML = `<option value="ALL">Semua PIC</option>`;
    
    let matchedUserPic = "";
    const cleanUserNama = currentUserNama ? currentUserNama.toLowerCase().trim() : "";

    pics.forEach(pic => {
      const opt = document.createElement("option");
      opt.value = pic;
      opt.textContent = pic;
      filterPicSelect.appendChild(opt);

      if (cleanUserNama && pic.toLowerCase().trim().includes(cleanUserNama)) {
        matchedUserPic = pic;
      }
    });

    const isSuperUser = currentUserRole.toLowerCase() === "superuser";
    if (!isSuperUser && currentUserNama) {
      filterPicSelect.value = currentUserNama;
      filterPicSelect.disabled = true;
    } else if (matchedUserPic) {
      filterPicSelect.value = matchedUserPic;
    } else {
      filterPicSelect.value = "ALL";
    }
  }

  function renderRutinitas() {
    const listEl = document.getElementById("rutinitasList");
    const selectedPic = document.getElementById("filterPic").value;
    const selectedHari = document.getElementById("filterHari").value;
    const selectedTanggal = document.getElementById("filterTanggal").value;
    const keyword = document.getElementById("searchInput").value.toLowerCase().trim();

    listEl.innerHTML = "";

    let countHari = 0;
    let countJadwal = 0;

    const filtered = allRutinitas.filter(item => {
      const isSuperUser = currentUserRole.toLowerCase() === "superuser";
      if (!isSuperUser) {
        const userClean = currentUserNama.trim().toLowerCase();
        const picClean = (item.pic || "").trim().toLowerCase();
        if (!picClean.includes(userClean)) return false;
      }

      const matchSearch = !keyword || (item.judul && item.judul.toLowerCase().includes(keyword)) || (item.pic && item.pic.toLowerCase().includes(keyword));
      const matchPic = (selectedPic === "ALL") || (item.pic === selectedPic);
      
      const hasValidHari = item.hari && item.hari.trim() !== "" && !item.hari.toLowerCase().includes("tidak bisa dipilih");
      const matchHari = (selectedHari === "ALL") || (hasValidHari && item.hari.toLowerCase() === selectedHari.toLowerCase());

      let matchTanggal = true;
      if (selectedTanggal) {
        if (item.tanggal && !item.tanggal.toLowerCase().includes("tidak bisa dipilih")) {
          matchTanggal = item.tanggal.startsWith(selectedTanggal);
        } else {
          matchTanggal = false;
        }
      }

      return matchSearch && matchPic && matchHari && matchTanggal;
    });

    filtered.forEach(item => {
      const hasValidHari = item.hari && item.hari.trim() !== "" && !item.hari.toLowerCase().includes("tidak bisa dipilih");
      const hasValidTanggal = item.tanggal && item.tanggal.trim() !== "" && !item.tanggal.toLowerCase().includes("tidak bisa dipilih");

      if (hasValidHari) countHari++;
      else if (hasValidTanggal) countJadwal++;
    });

    document.getElementById("countHari").textContent = countHari;
    document.getElementById("countTerjadwal").textContent = countJadwal;

    if (filtered.length === 0) {
      listEl.innerHTML = `<div style="text-align:center; color:#9099a2; padding:30px;">Belum ada daftar kegiatan rutin yang sesuai.</div>`;
      return;
    }

    const daysNameInID = ["Minggu", "Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"];
    const todayIndex = new Date().getDay();
    const todayName = daysNameInID[todayIndex];
    
    const tomorrowIndex = (todayIndex + 1) % 7;
    const yesterdayIndex = (todayIndex + 6) % 7;
    const tomorrowName = daysNameInID[tomorrowIndex];
    const yesterdayName = daysNameInID[yesterdayIndex];

    function getDayRank(item) {
      const hasValidHari = item.hari && item.hari.trim() !== "" && !item.hari.toLowerCase().includes("tidak bisa dipilih");
      if (!hasValidHari) return 50;

      const h = item.hari.trim();
      if (h.toLowerCase() === "setiap hari") return 0;
      if (h.toLowerCase() === todayName.toLowerCase()) return 1;
      if (h.toLowerCase() === tomorrowName.toLowerCase()) return 2;
      if (h.toLowerCase() === yesterdayName.toLowerCase()) return 3;
      return 10;
    }

    filtered.sort((a, b) => {
      return getDayRank(a) - getDayRank(b);
    });

    let lastRank = -99;

    filtered.forEach((item, index) => {
      const currentRank = getDayRank(item);

      if (index > 0 && currentRank !== lastRank) {
        const divider = document.createElement("div");
        divider.style.cssText = "font-size: 10.5px; font-weight: 700; color: var(--accent-cyan); margin: 12px 0 6px 4px; text-transform: uppercase; letter-spacing: 0.5px;";
        
        let labelGroup = "Jadwal Lainnya / Kalender";
        if (currentRank === 1) labelGroup = `⚡ Hari Ini (${todayName})`;
        else if (currentRank === 2) labelGroup = `📅 Besok (${tomorrowName})`;
        else if (currentRank === 3) labelGroup = `⏪ Kemarin (${yesterdayName})`;
        else if (currentRank === 0) labelGroup = `🔄 Setiap Hari`;
        else if (currentRank === 50) labelGroup = `📆 Terjadwal (Kalender)`;

        divider.textContent = `── ${labelGroup} ──`;
        listEl.appendChild(divider);
      } else if (index === 0) {
        const divider = document.createElement("div");
        divider.style.cssText = "font-size: 10.5px; font-weight: 700; color: var(--accent-cyan); margin: 4px 0 6px 4px; text-transform: uppercase; letter-spacing: 0.5px;";
        
        let labelGroup = "Jadwal Utama";
        if (currentRank === 1) labelGroup = `⚡ Hari Ini (${todayName})`;
        else if (currentRank === 2) labelGroup = `📅 Besok (${tomorrowName})`;
        else if (currentRank === 3) labelGroup = `⏪ Kemarin (${yesterdayName})`;
        else if (currentRank === 0) labelGroup = `🔄 Setiap Hari`;
        else if (currentRank === 50) labelGroup = `📆 Terjadwal (Kalender)`;

        divider.textContent = `── ${labelGroup} ──`;
        listEl.appendChild(divider);
      }

      lastRank = currentRank;

      const li = document.createElement("li");
      const hasValidTanggal = item.tanggal && item.tanggal.trim() !== "" && !item.tanggal.toLowerCase().includes("tidak bisa dipilih");
      
      li.className = `rutinitas-item-card ${hasValidTanggal ? 'type-tanggal' : ''}`;
      li.onclick = () => openDetailModal(item);

      let jadwalText = "";
      const hasValidHari = item.hari && item.hari.trim() !== "" && !item.hari.toLowerCase().includes("tidak bisa dipilih");

      if (hasValidHari) {
        jadwalText = item.hari;
      } else if (hasValidTanggal) {
        jadwalText = formatTanggalKalender(item.tanggal);
      } else {
        jadwalText = "Jadwal Fleksibel";
      }

      const itemLeft = document.createElement("div");
      itemLeft.className = "item-left";

      const titleSpan = document.createElement("span");
      titleSpan.className = "item-title";
      titleSpan.textContent = item.judul || "(Tanpa Judul)";

      const metaDiv = document.createElement("div");
      metaDiv.className = "item-meta";

      const picSpan = document.createElement("span");
      picSpan.textContent = "PIC: ";
      const picBadge = document.createElement("b");
      picBadge.className = "badge-pic";
      picBadge.textContent = item.pic || "-";
      picSpan.appendChild(picBadge);

      const dot = document.createElement("span");
      dot.textContent = "•";

      const idSpan = document.createElement("span");
      idSpan.style.cssText = "color: #94a3b8; font-size:10px;";
      idSpan.textContent = `ID: ${item.id || ''}`;

      metaDiv.appendChild(picSpan);
      metaDiv.appendChild(dot);
      metaDiv.appendChild(idSpan);

      itemLeft.appendChild(titleSpan);
      itemLeft.appendChild(metaDiv);

      const rightDiv = document.createElement("div");
      const jadwalBadge = document.createElement("span");
      jadwalBadge.className = "badge-jadwal";
      jadwalBadge.textContent = jadwalText;
      rightDiv.appendChild(jadwalBadge);

      li.appendChild(itemLeft);
      li.appendChild(rightDiv);
      listEl.appendChild(li);
    });
  }

  function formatTanggalKalender(dtStr) {
    if (!dtStr) return "-";
    const d = new Date(dtStr);
    if (isNaN(d.getTime())) return dtStr;
    const day = String(d.getDate()).padStart(2, '0');
    const months = ["Jan", "Feb", "Mar", "Apr", "Mei", "Jun", "Jul", "Agt", "Sep", "Okt", "Nov", "Des"];
    const month = months[d.getMonth()];
    const hours = String(d.getHours()).padStart(2, '0');
    const mins = String(d.getMinutes()).padStart(2, '0');
    return `${day} ${month}, ${hours}:${mins}`;
  }

  async function simpanRutinitas() {
    const actionType = document.getElementById("modalActionType").value;
    const rutinitasId = document.getElementById("modalRutinitasId").value;
    const judul = document.getElementById("inputJudul").value.trim();
    const pic = document.getElementById("selectPic").value;
    const scheduleType = document.querySelector('input[name="scheduleType"]:checked').value;
    
    let hari = "";
    let tanggal = "";

    if (scheduleType === "hari") {
      hari = document.getElementById("selectHari").value;
    } else {
      tanggal = document.getElementById("inputTanggalWaktu").value;
    }

    if (!judul || !pic) {
      showCustomAlert("Peringatan", "Judul Kegiatan dan PIC wajib diisi!", "warning");
      return;
    }

    showLoading("Menyimpan rutinitas...");
    try {
      const endpointAction = (actionType === "edit") ? "updateRutinitas" : "addRutinitas";
      const payload = {
        action: endpointAction,
        judul: judul,
        pic: pic,
        hari: hari,
        tanggal: tanggal
      };

      if (actionType === "edit") {
        payload.id = rutinitasId;
      }

      await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: new URLSearchParams(payload)
      });
      closeModal();
      showCustomAlert("Berhasil", actionType === "edit" ? "Rutinitas berhasil diperbarui." : "Data rutinitas berhasil disimpan.", "success");
      loadRutinitas(true);
    } catch (err) {
      console.error(err);
      showCustomAlert("Kesalahan", "Gagal menyimpan rutinitas.", "danger");
    } finally {
      hideLoading();
    }
  }

  function requestDeleteRutinitas() {
    showCustomConfirm("Konfirmasi Hapus", "Apakah Anda yakin ingin menghapus rutinitas ini?", deleteRutinitasExecute);
  }

  async function deleteRutinitasExecute() {
    const rutinitasId = document.getElementById("modalRutinitasId").value;
    showLoading("Menghapus rutinitas...");
    try {
      await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: new URLSearchParams({
          action: "deleteRutinitas",
          id: rutinitasId
        })
      });
      closeModal();
      showCustomAlert("Berhasil", "Rutinitas berhasil dihapus.", "success");
      loadRutinitas(true);
    } catch (err) {
      console.error(err);
      closeModal();
      showCustomAlert("Kesalahan", "Gagal menghapus rutinitas dari database.", "danger");
      loadRutinitas(true);
    } finally {
      hideLoading();
    }
  }

  window.onload = () => {
    loadUserList();
    loadRutinitas();
  };
</script>

</body>
</html>
