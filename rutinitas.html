<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Rutinitas - Portal Asset & System</title>
  <style>
    :root {
      --bg-app: #12161f;
      --card-bg: #1c2230;
      --card-hover: #242c3d;
      --text-main: #f1f3f5;
      --text-secondary: #9099a2;
      --border-color: #2a3447;
      --accent-purple: #8b5cf6;
      --accent-blue: #3b82f6;
    }

    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-app);
      color: var(--text-main);
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .container {
      width: 100%;
      max-width: 700px;
      height: 100%;
      max-height: 100vh;
      background: var(--bg-app);
      padding: 16px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }
    .back-nav {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--accent-blue);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
      text-decoration: none;
      margin-bottom: 14px;
      align-self: flex-start;
    }
    .back-nav:hover { text-decoration: underline; }

    .content-area {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 24px;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      gap: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }
    .icon-dev {
      font-size: 48px;
      margin-bottom: 4px;
    }
    h2 { color: #ffffff; margin: 0; font-size: 20px; font-weight: 700; }
    p { color: var(--text-secondary); font-size: 13.5px; margin: 0; line-height: 1.5; max-width: 400px; }
  </style>
</head>
<body>

<div class="container">
  <a href="index.html" class="back-nav">← Kembali ke Menu Utama</a>

  <div class="content-area">
    <div class="icon-dev">⚡</div>
    <h2>Rutinitas Harian</h2>
    <p>Halaman ini sedang dalam tahap pengembangan dan akan segera hadir untuk mendukung pencatatan checklist tugas rutin operasional Anda.</p>
  </div>
</div>

</body>
</html>
