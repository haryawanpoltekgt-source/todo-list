<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Rutinitas - Portal Asset & System</title>
  <style>
    :root {
      --bg-app: #12161f;
      --card-bg: #1c2230;
      --card-hover: #242c3d;
      --text-main: #f1f3f5;
      --text-secondary: #9099a2;
      --border-color: #2a3447;
      --accent-purple: #8b5cf6;
      --accent-blue: #3b82f6;
      --accent-green: #22c55e;
      --accent-red: #ef4444;
      --accent-cyan: #06b6d4;
    }

    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-app);
      color: var(--text-main);
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .container {
      width: 100%;
      max-width: 700px;
      height: 100%;
      max-height: 100vh;
      background: var(--bg-app);
      padding: 16px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    #loadingOverlay {
      display: none;
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(18, 22, 31, 0.85);
      backdrop-filter: blur(5px);
      z-index: 2000;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      gap: 12px;
    }
    .spinner {
      width: 45px;
      height: 45px;
      border: 4px solid var(--border-color);
      border-top: 4px solid var(--accent-purple);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .loading-text { font-size: 13px; font-weight: 600; color: var(--text-main); }

    .back-nav {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--accent-blue);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
      margin-bottom: 8px;
      text-decoration: none;
      flex-shrink: 0;
    }
    .back-nav:hover { text-decoration: underline; }

    .header-action-area {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 8px;
      flex-shrink: 0;
    }
    .header-top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }
    .brand-wrapper {
      display: flex;
      flex-direction: column;
      gap: 1px;
    }
    h2 { 
      color: #ffffff; 
      margin: 0; 
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }
    .sub-title {
      font-size: 11px;
      color: var(--text-secondary);
    }

    .btn-add-rutinitas {
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-blue));
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 4px 12px rgba(139, 92, 246, 0.3);
      white-space: nowrap;
    }
    .btn-add-rutinitas:hover { opacity: 0.9; }

    .search-input {
      width: 100%;
      padding: 7px 10px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 12px;
      outline: none;
      background: var(--card-bg);
      color: var(--text-main);
    }
    .search-input:focus { border-color: var(--accent-purple); }

    .filter-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr auto;
      gap: 6px;
      align-items: flex-end;
      margin-bottom: 8px;
      flex-shrink: 0;
      background: var(--card-bg);
      padding: 8px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
    }
    .filter-grid label {
      font-size: 9.5px;
      font-weight: 700;
      color: var(--text-secondary);
      display: flex;
      flex-direction: column;
      gap: 3px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }
    .filter-grid select, .filter-grid input[type="date"] {
      width: 100%;
      padding: 5px 6px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 11px;
      outline: none;
      background: #161b26;
      color: var(--text-main);
      font-weight: 500;
    }
    .btn-reset-filter {
      background: #2a3447;
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 5px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      height: 27px;
    }
    .btn-reset-filter:hover { background: var(--card-hover); color: var(--accent-cyan); }

    .summary-area {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 7px 10px;
      margin-bottom: 8px;
      flex-shrink: 0;
    }
    .summary-title { font-size: 11px; font-weight: 700; color: var(--text-secondary); }
    .summary-badges { display: flex; gap: 5px; }
    .count-chip {
      font-size: 10.5px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 3px;
    }
    .count-rutin { background: rgba(6, 182, 212, 0.15); color: #22d3ee; border: 1px solid rgba(6, 182, 212, 0.3); }
    .count-jadwal { background: rgba(139, 92, 246, 0.15); color: #a78bfa; border: 1px solid rgba(139, 92, 246, 0.3); }

    .rutinitas-scroll-area {
      flex: 1;
      overflow-y: auto;
      padding-right: 2px;
      -webkit-overflow-scrolling: touch;
    }
    ul { list-style: none; padding: 0; margin: 0; }

    .rutinitas-item-card {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-left: 4px solid var(--accent-cyan);
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      transition: all 0.2s ease;
    }
    .rutinitas-item-card:hover {
      background: var(--card-hover);
      border-color: var(--accent-purple);
      transform: translateY(-2px);
    }
    .rutinitas-item-card.type-tanggal {
      border-left: 4px solid var(--accent-purple);
    }

    .item-left {
      display: flex;
      flex-direction: column;
      gap: 4px;
      overflow: hidden;
      flex: 1;
      padding-right: 10px;
    }
    .item-title {
      font-size: 13.5px;
      font-weight: 700;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .item-meta {
      font-size: 11px;
      color: var(--text-secondary);
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    .badge-pic {
      background: rgba(139, 92, 246, 0.15);
      color: #a78bfa;
      border: 1px solid rgba(139, 92, 246, 0.3);
      padding: 2px 8px;
      border-radius: 5px;
      font-size: 11px;
      font-weight: 600;
    }
    .badge-jadwal {
      background: rgba(6, 182, 212, 0.15);
      color: #22d3ee;
      border: 1px solid rgba(6, 182, 212, 0.3);
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
    }
    .type-tanggal .badge-jadwal {
      background: rgba(139, 92, 246, 0.15);
      color: #a78bfa;
      border: 1px solid rgba(139, 92, 246, 0.3);
    }

    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 12px;
    }
    .modal-content {
      background: var(--card-bg);
      color: var(--text-main);
      width: 100%;
      max-width: 440px;
      padding: 18px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 8px;
    }
    .modal-header h3 { margin: 0; color: #ffffff; font-size: 16px; }
    .btn-close-modal {
      background: transparent;
      border: none;
      font-size: 20px;
      cursor: pointer;
      color: var(--text-secondary);
    }
    .modal-body {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .modal-body label {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-secondary);
    }
    .modal-body input, .modal-body select {
      padding: 9px 12px;
      font-size: 12.5px;
      font-family: inherit;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      outline: none;
      background: #161b26;
      color: var(--text-main);
    }
    .modal-body input:focus, .modal-body select:focus {
      border-color: var(--accent-purple);
    }
    .radio-group {
      display: flex;
      gap: 12px;
      margin-top: 4px;
      font-size: 12px;
      color: var(--text-main);
    }
    .radio-group label {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 4px;
      cursor: pointer;
    }
    .modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      border-top: 1px solid var(--border-color);
      padding-top: 10px;
    }
    .btn-save {
      background: linear-gradient(135deg, var(--accent-purple), var(--accent-blue));
      color: white;
      border: none;
      padding: 9px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 12.5px;
    }
    .btn-cancel {
      background: #2a3447;
      color: #f1f3f5;
      border: 1px solid var(--border-color);
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 12.5px;
    }
  </style>
</head>
<body>

<div class="container">

  <div id="loadingOverlay">
    <div class="spinner"></div>
    <div class="loading-text" id="loadingText">Memproses data...</div>
  </div>

  <a href="index.html#workView" class="back-nav">← Kembali ke Web Kerja</a>

  <div class="header-action-area">
    <div class="header-top-row">
      <div class="brand-wrapper">
        <h2>Rutinitas Harian</h2>
        <span class="sub-title">Jadwal & checklist operasional rutin pegawai</span>
      </div>
      <button class="btn-add-rutinitas" onclick="openAddModal()">
        <span>➕</span> Tambah Rutinitas
      </button>
    </div>

    <input type="text" id="searchInput" class="search-input" placeholder="Cari kegiatan rutin..." oninput="renderRutinitas()">
  </div>

  <div class="filter-grid">
    <label>
      Filter PIC:
      <select id="filterPic" onchange="renderRutinitas()">
        <option value="ALL">Semua PIC</option>
      </select>
    </label>

    <label>
      Filter Hari:
      <select id="filterHari" onchange="renderRutinitas()">
        <option value="ALL">Semua Hari</option>
        <option value="Senin">Senin</option>
        <option value="Selasa">Selasa</option>
        <option value="Rabu">Rabu</option>
        <option value="Kamis">Kamis</option>
        <option value="Jumat">Jumat</option>
        <option value="Sabtu">Sabtu</option>
        <option value="Minggu">Minggu</option>
        <option value="Setiap Hari">Setiap Hari</option>
      </select>
    </label>

    <label>
      Filter Terjadwal:
      <input type="date" id="filterTanggal" onchange="renderRutinitas()">
    </label>

    <button class="btn-reset-filter" onclick="resetFilterTanggal()" title="Reset Tanggal">Reset</button>
  </div>

  <div class="summary-area">
    <span class="summary-title" id="summaryPicLabel">Total Rutinitas:</span>
    <div class="summary-badges">
      <span class="count-chip count-rutin">Hari: <b id="countHari">0</b></span>
      <span class="count-chip count-jadwal">Terjadwal: <b id="countTerjadwal">0</b></span>
    </div>
  </div>

  <div class="rutinitas-scroll-area">
    <ul id="rutinitasList">
      <div style="text-align:center; color:#9099a2; padding:30px;">Memuat data rutinitas...</div>
    </ul>
  </div>

</div>

<div class="modal-overlay" id="rutinitasModal">
  <div class="modal-content">
    <div class="modal-header">
      <h3 id="modalTitle">Tambah Rutinitas Baru</h3>
      <button class="btn-close-modal" onclick="closeModal()">&times;</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="modalActionType" value="add">
      <label>
        Judul Kegiatan Rutin:
        <input type="text" id="inputJudul" placeholder="Contoh: Piket Area Smoking / Backup Server...">
      </label>

      <label>
        PIC Penanggung Jawab:
        <select id="selectPic">
          <option value="">-- Pilih PIC --</option>
        </select>
      </label>

      <label>
        Tipe Pengingat Jadwal:
        <div class="radio-group">
          <label><input type="radio" name="scheduleType" value="hari" checked onchange="toggleScheduleMode()"> Berdasarkan Hari</label>
          <label><input type="radio" name="scheduleType" value="tanggal" onchange="toggleScheduleMode()"> Tanggal & Jam Spesifik</label>
        </div>
      </label>

      <div id="modeHariGroup">
        <label>
          Ingatkan Setiap Hari:
          <select id="selectHari">
            <option value="Senin">Senin</option>
            <option value="Selasa">Selasa</option>
            <option value="Rabu">Rabu</option>
            <option value="Kamis">Kamis</option>
            <option value="Jumat">Jumat</option>
            <option value="Sabtu">Sabtu</option>
            <option value="Minggu">Minggu</option>
            <option value="Setiap Hari">Setiap Hari (Senin - Minggu)</option>
          </select>
        </label>
      </div>

      <div id="modeTanggalGroup" style="display: none;">
        <label>
          Ingatkan di Tanggal & Waktu:
          <input type="datetime-local" id="inputTanggalWaktu">
        </label>
      </div>

    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeModal()">Batal</button>
      <button class="btn-save" onclick="simpanRutinitas()">Simpan Rutinitas</button>
    </div>
  </div>
</div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbxkm9s2srnSzKjXDl8uZ5JqJ51QvbuXPMcRcb8fCjdXbIorA3En_HUSZACyAfvR91AJ/exec";
  
  let allRutinitas = [];
  let userListCache = [];
  let currentUserNama = localStorage.getItem("pbas_nama") || "";

  function showLoading(text = "Memproses data...") {
    document.getElementById("loadingText").textContent = text;
    document.getElementById("loadingOverlay").style.display = "flex";
  }
  function hideLoading() {
    document.getElementById("loadingOverlay").style.display = "none";
  }

  async function loadUserList() {
    try {
      const response = await fetch(`${API_URL}?action=getUsers`);
      const res = await response.json();
      userListCache = Array.isArray(res) ? res : [];
      populatePicDropdown();
    } catch (e) {
      userListCache = [];
    }
  }

  function populatePicDropdown() {
    const select = document.getElementById("selectPic");
    select.innerHTML = '<option value="">-- Pilih PIC --</option>';
    userListCache.forEach(u => {
      const opt = document.createElement("option");
      opt.value = u.nama;
      opt.textContent = `${u.nama} (${u.nip})`;
      select.appendChild(opt);
    });
  }

  function toggleScheduleMode() {
    const isHari = document.querySelector('input[name="scheduleType"]:checked').value === "hari";
    document.getElementById("modeHariGroup").style.display = isHari ? "block" : "none";
    document.getElementById("modeTanggalGroup").style.display = isHari ? "none" : "block";
  }

  function openAddModal() {
    document.getElementById("modalActionType").value = "add";
    document.getElementById("modalTitle").textContent = "Tambah Rutinitas Baru";
    document.getElementById("inputJudul").value = "";
    document.getElementById("selectPic").value = currentUserNama || "";
    document.querySelector('input[value="hari"]').checked = true;
    document.getElementById("inputTanggalWaktu").value = "";
    toggleScheduleMode();
    document.getElementById("rutinitasModal").style.display = "flex";
  }

  function openDetailModal(item) {
    document.getElementById("modalActionType").value = "edit";
    document.getElementById("modalTitle").textContent = `Detail Rutinitas (${item.id || ''})`;
    document.getElementById("inputJudul").value = item.judul || "";
    document.getElementById("selectPic").value = item.pic || "";

    const hasValidTanggal = item.tanggal && item.tanggal.trim() !== "" && !item.tanggal.toLowerCase().includes("tidak bisa dipilih");

    if (hasValidTanggal) {
      document.querySelector('input[name="scheduleType"][value="tanggal"]').checked = true;
      toggleScheduleMode();
      document.getElementById("inputTanggalWaktu").value = item.tanggal.replace(' ', 'T').substring(0, 16);
    } else {
      document.querySelector('input[name="scheduleType"][value="hari"]').checked = true;
      toggleScheduleMode();
      if (item.hari && !item.hari.toLowerCase().includes("tidak bisa dipilih")) {
        document.getElementById("selectHari").value = item.hari;
      }
    }

    document.getElementById("rutinitasModal").style.display = "flex";
  }

  function closeModal() {
    document.getElementById("rutinitasModal").style.display = "none";
  }

  function resetFilterTanggal() {
    document.getElementById("filterTanggal").value = "";
    renderRutinitas();
  }

  async function loadRutinitas() {
    showLoading("Memuat daftar rutinitas...");
    try {
      const response = await fetch(`${API_URL}?action=getRutinitas`);
      const result = await response.json();

      allRutinitas = Array.isArray(result) ? result : [];
      updatePicOptions();
      renderRutinitas();
    } catch (err) {
      console.error(err);
      document.getElementById("rutinitasList").innerHTML = `<li style="text-align:center; color:#f87171; padding:20px;">Gagal memuat data dari server.</li>`;
      allRutinitas = [];
    } finally {
      hideLoading();
    }
  }

  function updatePicOptions() {
    const filterPicSelect = document.getElementById("filterPic");
    const pics = [...new Set(allRutinitas.map(t => t.pic).filter(p => p && p !== "-"))];

    filterPicSelect.innerHTML = `<option value="ALL">Semua PIC</option>`;
    
    let matchedUserPic = "";
    const cleanUserNama = currentUserNama ? currentUserNama.toLowerCase().trim() : "";

    pics.forEach(pic => {
      const opt = document.createElement("option");
      opt.value = pic;
      opt.textContent = pic;
      filterPicSelect.appendChild(opt);

      if (cleanUserNama && pic.toLowerCase().trim().includes(cleanUserNama)) {
        matchedUserPic = pic;
      }
    });

    if (matchedUserPic) {
      filterPicSelect.value = matchedUserPic;
    } else {
      filterPicSelect.value = "ALL";
    }
  }

  function renderRutinitas() {
    const listEl = document.getElementById("rutinitasList");
    const selectedPic = document.getElementById("filterPic").value;
    const selectedHari = document.getElementById("filterHari").value;
    const selectedTanggal = document.getElementById("filterTanggal").value;
    const keyword = document.getElementById("searchInput").value.toLowerCase().trim();

    listEl.innerHTML = "";

    let countHari = 0;
    let countJadwal = 0;

    const filtered = allRutinitas.filter(item => {
      const matchSearch = !keyword || (item.judul && item.judul.toLowerCase().includes(keyword)) || (item.pic && item.pic.toLowerCase().includes(keyword));
      const matchPic = (selectedPic === "ALL") || (item.pic === selectedPic);
      
      const hasValidHari = item.hari && item.hari.trim() !== "" && !item.hari.toLowerCase().includes("tidak bisa dipilih");
      const matchHari = (selectedHari === "ALL") || (hasValidHari && item.hari.toLowerCase() === selectedHari.toLowerCase());

      let matchTanggal = true;
      if (selectedTanggal) {
        if (item.tanggal && !item.tanggal.toLowerCase().includes("tidak bisa dipilih")) {
          matchTanggal = item.tanggal.startsWith(selectedTanggal);
        } else {
          matchTanggal = false;
        }
      }

      return matchSearch && matchPic && matchHari && matchTanggal;
    });

    filtered.forEach(item => {
      const hasValidHari = item.hari && item.hari.trim() !== "" && !item.hari.toLowerCase().includes("tidak bisa dipilih");
      const hasValidTanggal = item.tanggal && item.tanggal.trim() !== "" && !item.tanggal.toLowerCase().includes("tidak bisa dipilih");

      if (hasValidHari) countHari++;
      else if (hasValidTanggal) countJadwal++;
    });

    document.getElementById("countHari").textContent = countHari;
    document.getElementById("countTerjadwal").textContent = countJadwal;

    if (filtered.length === 0) {
      listEl.innerHTML = `<div style="text-align:center; color:#9099a2; padding:30px;">Belum ada daftar kegiatan rutin yang sesuai.</div>`;
      return;
    }

    const daysNameInID = ["Minggu", "Senin", "Selasa", "Rabu", "Kamis", "Jumat", "Sabtu"];
    const todayIndex = new Date().getDay();
    const todayName = daysNameInID[todayIndex];
    
    const tomorrowIndex = (todayIndex + 1) % 7;
    const yesterdayIndex = (todayIndex + 6) % 7;
    const tomorrowName = daysNameInID[tomorrowIndex];
    const yesterdayName = daysNameInID[yesterdayIndex];

    function getDayRank(item) {
      const hasValidHari = item.hari && item.hari.trim() !== "" && !item.hari.toLowerCase().includes("tidak bisa dipilih");
      if (!hasValidHari) return 50;

      const h = item.hari.trim();
      if (h.toLowerCase() === "setiap hari") return 0;
      if (h.toLowerCase() === todayName.toLowerCase()) return 1;
      if (h.toLowerCase() === tomorrowName.toLowerCase()) return 2;
      if (h.toLowerCase() === yesterdayName.toLowerCase()) return 3;
      return 10;
    }

    filtered.sort((a, b) => {
      return getDayRank(a) - getDayRank(b);
    });

    let lastRank = -99;

    filtered.forEach((item, index) => {
      const currentRank = getDayRank(item);

      if (index > 0 && currentRank !== lastRank) {
        const divider = document.createElement("div");
        divider.style.cssText = "font-size: 10.5px; font-weight: 700; color: var(--accent-cyan); margin: 12px 0 6px 4px; text-transform: uppercase; letter-spacing: 0.5px;";
        
        let labelGroup = "Jadwal Lainnya / Kalender";
        if (currentRank === 1) labelGroup = `⚡ Hari Ini (${todayName})`;
        else if (currentRank === 2) labelGroup = `📅 Besok (${tomorrowName})`;
        else if (currentRank === 3) labelGroup = `⏪ Kemarin (${yesterdayName})`;
        else if (currentRank === 0) labelGroup = `🔄 Setiap Hari`;
        else if (currentRank === 50) labelGroup = `📆 Terjadwal (Kalender)`;

        divider.textContent = `── ${labelGroup} ──`;
        listEl.appendChild(divider);
      } else if (index === 0) {
        const divider = document.createElement("div");
        divider.style.cssText = "font-size: 10.5px; font-weight: 700; color: var(--accent-cyan); margin: 4px 0 6px 4px; text-transform: uppercase; letter-spacing: 0.5px;";
        
        let labelGroup = "Jadwal Utama";
        if (currentRank === 1) labelGroup = `⚡ Hari Ini (${todayName})`;
        else if (currentRank === 2) labelGroup = `📅 Besok (${tomorrowName})`;
        else if (currentRank === 3) labelGroup = `⏪ Kemarin (${yesterdayName})`;
        else if (currentRank === 0) labelGroup = `🔄 Setiap Hari`;
        else if (currentRank === 50) labelGroup = `📆 Terjadwal (Kalender)`;

        divider.textContent = `── ${labelGroup} ──`;
        listEl.appendChild(divider);
      }

      lastRank = currentRank;

      const li = document.createElement("li");
      const hasValidTanggal = item.tanggal && item.tanggal.trim() !== "" && !item.tanggal.toLowerCase().includes("tidak bisa dipilih");
      
      li.className = `rutinitas-item-card ${hasValidTanggal ? 'type-tanggal' : ''}`;
      li.onclick = () => openDetailModal(item);

      let jadwalText = "";
      const hasValidHari = item.hari && item.hari.trim() !== "" && !item.hari.toLowerCase().includes("tidak bisa dipilih");

      if (hasValidHari) {
        jadwalText = item.hari;
      } else if (hasValidTanggal) {
        jadwalText = formatTanggalKalender(item.tanggal);
      } else {
        jadwalText = "Jadwal Fleksibel";
      }

      li.innerHTML = `
        <div class="item-left">
          <span class="item-title">${item.judul || "(Tanpa Judul)"}</span>
          <div class="item-meta">
            <span>PIC: <b class="badge-pic">${item.pic || "-"}</b></span>
            <span>•</span>
            <span style="color: #94a3b8; font-size:10px;">ID: ${item.id || ''}</span>
          </div>
        </div>
        <div>
          <span class="badge-jadwal">${jadwalText}</span>
        </div>
      `;
      listEl.appendChild(li);
    });
  }

  function formatTanggalKalender(dtStr) {
    if (!dtStr) return "-";
    const d = new Date(dtStr);
    if (isNaN(d.getTime())) return dtStr;
    const day = String(d.getDate()).padStart(2, '0');
    const months = ["Jan", "Feb", "Mar", "Apr", "Mei", "Jun", "Jul", "Agt", "Sep", "Okt", "Nov", "Des"];
    const month = months[d.getMonth()];
    const hours = String(d.getHours()).padStart(2, '0');
    const mins = String(d.getMinutes()).padStart(2, '0');
    return `${day} ${month}, ${hours}:${mins}`;
  }

  async function simpanRutinitas() {
    const judul = document.getElementById("inputJudul").value.trim();
    const pic = document.getElementById("selectPic").value;
    const scheduleType = document.querySelector('input[name="scheduleType"]:checked').value;
    
    let hari = "";
    let tanggal = "";

    if (scheduleType === "hari") {
      hari = document.getElementById("selectHari").value;
    } else {
      tanggal = document.getElementById("inputTanggalWaktu").value;
    }

    if (!judul || !pic) {
      alert("Judul Kegiatan dan PIC wajib diisi!");
      return;
    }

    showLoading("Menyimpan rutinitas...");
    try {
      await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: new URLSearchParams({
          action: "addRutinitas",
          judul: judul,
          pic: pic,
          hari: hari,
          tanggal: tanggal
        })
      });
      closeModal();
      loadRutinitas();
    } catch (err) {
      console.error(err);
      alert("Gagal menyimpan rutinitas.");
    } finally {
      hideLoading();
    }
  }

  window.onload = () => {
    loadUserList();
    loadRutinitas();
  };
</script>

</body>
</html>
