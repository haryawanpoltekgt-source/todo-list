<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Permintaan Bantuan Asset & System (PBAS)</title>
  <style>
    :root {
      --bg-app: #12161f;
      --card-bg: #1c2230;
      --card-hover: #242c3d;
      --text-main: #f1f3f5;
      --text-secondary: #9099a2;
      --border-color: #2a3447;
      --accent-blue: #3b82f6;
      --accent-cyan: #06b6d4;
      --accent-green: #22c55e;
    }

    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-app);
      color: var(--text-main);
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .container {
      width: 100%;
      max-width: 700px;
      height: 100%;
      max-height: 100vh;
      background: var(--bg-app);
      padding: 16px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    /* --- LOADING OVERLAY --- */
    #loadingOverlay {
      display: none;
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(18, 22, 31, 0.85);
      backdrop-filter: blur(5px);
      z-index: 2000;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      gap: 12px;
    }
    .spinner {
      width: 45px;
      height: 45px;
      border: 4px solid var(--border-color);
      border-top: 4px solid var(--accent-cyan);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .loading-text { font-size: 13px; font-weight: 600; color: var(--text-main); }

    .back-nav {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--accent-blue);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 12px;
      background: none;
      border: none;
      padding: 0;
      flex-shrink: 0;
      text-decoration: none;
    }
    .back-nav:hover { text-decoration: underline; }

    .header-area {
      margin-bottom: 16px;
      flex-shrink: 0;
    }
    h2 { color: #ffffff; margin: 0 0 4px 0; font-size: 18px; font-weight: 700; }
    p.subtitle { margin: 0; font-size: 12px; color: var(--text-secondary); }

    .form-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px;
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }
    .form-group { display: flex; flex-direction: column; gap: 5px; }
    .form-group label { font-size: 11.5px; font-weight: 600; color: var(--text-secondary); }
    .form-group input, .form-group select, .form-group textarea {
      padding: 9px 12px;
      font-size: 13px;
      font-family: inherit;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      outline: none;
      background: #161b26;
      color: var(--text-main);
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--accent-cyan); }

    .btn-submit {
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
      color: white;
      border: none;
      padding: 11px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13.5px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(6, 182, 212, 0.3);
      margin-top: 6px;
    }
    .btn-submit:hover { opacity: 0.9; }
  </style>
</head>
<body>

<div class="container">

  <!-- LOADING OVERLAY -->
  <div id="loadingOverlay">
    <div class="spinner"></div>
    <div class="loading-text">Mengirim permintaan ke server...</div>
  </div>

  <a href="index.html" class="back-nav">← Kembali ke Menu Utama</a>

  <div class="header-area">
    <h2>Permintaan Bantuan Asset & System</h2>
    <p class="subtitle">Isi formulir di bawah ini untuk mengajukan perbaikan atau kendala asset/sistem</p>
  </div>

  <div class="form-card">
    <div class="form-group">
      <label>Nama Pemohon / Pelapor:</label>
      <input type="text" id="pbasNama" placeholder="Masukkan nama lengkap...">
    </div>

    <div class="form-group">
      <label>Kategori Kendala:</label>
      <select id="pbasKategori">
        <option value="Hardware">Hardware / Perangkat Keras</option>
        <option value="Software">Software / Aplikasi / Sistem</option>
        <option value="Jaringan">Jaringan / Internet</option>
        <option value="Lainnya">Lainnya</option>
      </select>
    </div>

    <div class="form-group">
      <label>Judul / Perihal Kendala:</label>
      <input type="text" id="pbasJudul" placeholder="Contoh: Printer Rusak / Aplikasi Error...">
    </div>

    <div class="form-group">
      <label>Detail Deskripsi Masalah:</label>
      <textarea id="pbasDeskripsi" rows="4" placeholder="Jelaskan secara detail kendala yang dialami..."></textarea>
    </div>

    <button class="btn-submit" onclick="kirimPermintaan()">Kirim Permintaan Bantuan</button>
  </div>
</div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbyJTj_mwNPfHhN3hXxVkb_waPK96a-NL6TlBIfiedTuO64kb8_em4O9cXZbu7yDtW8/exec";

  function showLoading() {
    document.getElementById("loadingOverlay").style.display = "flex";
  }
  function hideLoading() {
    document.getElementById("loadingOverlay").style.display = "none";
  }

  async function kirimPermintaan() {
    const nama = document.getElementById("pbasNama").value.trim();
    const kategori = document.getElementById("pbasKategori").value;
    const judul = document.getElementById("pbasJudul").value.trim();
    const deskripsi = document.getElementById("pbasDeskripsi").value.trim();

    if (!nama || !judul || !deskripsi) {
      alert("Mohon lengkapi semua kolom formulir terlebih dahulu!");
      return;
    }

    showLoading();
    try {
      await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: new URLSearchParams({
          action: "pbas",
          nama: nama,
          kategori: kategori,
          judul: judul,
          deskripsi: deskripsi
        })
      });
      hideLoading();
      alert("Permintaan bantuan berhasil dikirim dan tercatat di sistem!");
      window.location.href = "index.html";
    } catch (err) {
      hideLoading();
      alert("Gagal mengirim permintaan. Periksa koneksi internet Anda.");
    }
  }
</script>

</body>
</html>
