<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Permintaan Bantuan Asset & System (PBAS)</title>
  <style>
    :root {
      --bg-app: #12161f;
      --card-bg: #1c2230;
      --card-hover: #242c3d;
      --text-main: #f1f3f5;
      --text-secondary: #9099a2;
      --border-color: #2a3447;
      --accent-blue: #3b82f6;
      --accent-cyan: #06b6d4;
      --accent-green: #22c55e;
    }

    * { box-sizing: border-box; }
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-app);
      color: var(--text-main);
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .container {
      width: 100%;
      max-width: 700px;
      height: 100%;
      max-height: 100vh;
      background: var(--bg-app);
      padding: 16px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    /* --- LOADING OVERLAY --- */
    #loadingOverlay {
      display: none;
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(18, 22, 31, 0.85);
      backdrop-filter: blur(5px);
      z-index: 2000;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      gap: 12px;
    }
    .spinner {
      width: 45px;
      height: 45px;
      border: 4px solid var(--border-color);
      border-top: 4px solid var(--accent-cyan);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .loading-text { font-size: 13px; font-weight: 600; color: var(--text-main); }

    .nav-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      flex-shrink: 0;
    }
    .back-nav {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--accent-blue);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
      text-decoration: none;
    }
    .back-nav:hover { text-decoration: underline; }

    .btn-list-view {
      background: rgba(6, 182, 212, 0.15);
      color: var(--accent-cyan);
      border: 1px solid rgba(6, 182, 212, 0.3);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-list-view:hover { background: rgba(6, 182, 212, 0.25); }

    .header-area {
      margin-bottom: 14px;
      flex-shrink: 0;
    }
    h2 { color: #ffffff; margin: 0 0 4px 0; font-size: 18px; font-weight: 700; }
    p.subtitle { margin: 0; font-size: 12px; color: var(--text-secondary); }

    /* Card / Container View */
    .content-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 16px;
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    .form-group { display: flex; flex-direction: column; gap: 5px; }
    .form-group label { font-size: 11.5px; font-weight: 600; color: var(--text-secondary); }
    .form-group input, .form-group select, .form-group textarea {
      padding: 9px 12px;
      font-size: 13px;
      font-family: inherit;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      outline: none;
      background: #161b26;
      color: var(--text-main);
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--accent-cyan); }

    .btn-submit {
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
      color: white;
      border: none;
      padding: 11px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13.5px;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(6, 182, 212, 0.3);
      margin-top: 6px;
    }
    .btn-submit:hover { opacity: 0.9; }

    /* List Item View - Simple Card */
    .pbas-item-card {
      background: #161b26;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 12px 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 3px 10px rgba(0,0,0,0.15);
    }
    .pbas-item-card:hover {
      background: var(--card-hover);
      border-color: var(--accent-cyan);
      transform: translateY(-2px);
    }
    .pbas-item-left {
      display: flex;
      flex-direction: column;
      gap: 4px;
      overflow: hidden;
      flex: 1;
      padding-right: 10px;
    }
    .pbas-title {
      font-size: 13.5px;
      font-weight: 700;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .pbas-meta {
      font-size: 11px;
      color: var(--text-secondary);
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .badge-cat {
      background: rgba(59, 130, 246, 0.15);
      color: #60a5fa;
      border: 1px solid rgba(59, 130, 246, 0.3);
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
    }

    /* Modal Detail Styling */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 12px;
      box-sizing: border-box;
    }
    .modal-content {
      background: var(--card-bg);
      color: var(--text-main);
      width: 100%;
      max-width: 450px;
      padding: 18px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 8px;
    }
    .modal-header h3 { margin: 0; color: #ffffff; font-size: 16px; }
    .btn-close-modal {
      background: transparent;
      border: none;
      font-size: 20px;
      cursor: pointer;
      color: var(--text-secondary);
      line-height: 1;
    }
    .modal-body {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .modal-body label {
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text-secondary);
    }
    .modal-body input, .modal-body textarea {
      padding: 8px 10px;
      font-size: 12.5px;
      font-family: inherit;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      outline: none;
      width: 100%;
      background: #161b26;
      color: var(--text-main);
    }
    .modal-body input:disabled, .modal-body textarea:disabled {
      background-color: #1a202c;
      color: #cbd5e1;
      cursor: not-allowed;
    }
    .modal-footer {
      display: flex;
      justify-content: flex-end;
      border-top: 1px solid var(--border-color);
      padding-top: 10px;
    }
    .btn-close-btn {
      background: #2a3447;
      color: #f1f3f5;
      border: 1px solid var(--border-color);
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 12.5px;
    }
    .btn-close-btn:hover { background: var(--card-hover); }
  </style>
</head>
<body>

<div class="container">

  <!-- LOADING OVERLAY -->
  <div id="loadingOverlay">
    <div class="spinner"></div>
    <div class="loading-text" id="loadingText">Memproses data...</div>
  </div>

  <div class="nav-header">
    <a href="index.html" class="back-nav">← Kembali ke Menu Utama</a>
    <button class="btn-list-view" id="btnToggleView" onclick="toggleView()">📋 Lihat Daftar Permintaan</button>
  </div>

  <div class="header-area">
    <h2 id="pageTitle">Permintaan Bantuan Asset & System</h2>
    <p class="subtitle" id="pageSubtitle">Isi formulir di bawah ini untuk mengajukan perbaikan atau kendala asset/sistem</p>
  </div>

  <!-- VIEW 1: FORMULIR INPUT -->
  <div class="content-card" id="formView">
    <div class="form-group">
      <label>Nama Pemohon / Pelapor:</label>
      <input type="text" id="pbasNama" placeholder="Masukkan nama lengkap...">
    </div>

    <div class="form-group">
      <label>Kategori Kendala:</label>
      <select id="pbasKategori">
        <option value="Hardware">Hardware / Perangkat Keras</option>
        <option value="Software">Software / Aplikasi / Sistem</option>
        <option value="Jaringan">Jaringan / Internet</option>
        <option value="Lainnya">Lainnya</option>
      </select>
    </div>

    <div class="form-group">
      <label>Judul / Perihal Kendala:</label>
      <input type="text" id="pbasJudul" placeholder="Contoh: Printer Rusak / Aplikasi Error...">
    </div>

    <div class="form-group">
      <label>Detail Deskripsi Masalah:</label>
      <textarea id="pbasDeskripsi" rows="4" placeholder="Jelaskan secara detail kendala yang dialami..."></textarea>
    </div>

    <button class="btn-submit" onclick="kirimPermintaan()">Kirim Permintaan Bantuan</button>
  </div>

  <!-- VIEW 2: DAFTAR RIWAYAT PERMINTAAN -->
  <div class="content-card" id="listView" style="display: none; gap: 8px;">
    <div id="pbasListContainer" style="display: flex; flex-direction: column; gap: 8px; overflow-y: auto;">
      <div style="text-align:center; color:#9099a2; padding:20px;">Memuat data...</div>
    </div>
  </div>

</div>

<!-- MODAL DETAIL PERMINTAAN -->
<div class="modal-overlay" id="pbasDetailModal">
  <div class="modal-content">
    <div class="modal-header">
      <h3 id="modalIdTitle">Detail Permintaan</h3>
      <button class="btn-close-modal" onclick="closeDetailModal()">&times;</button>
    </div>
    <div class="modal-body">
      <label>
        ID Permintaan:
        <input type="text" id="modalId" disabled>
      </label>
      <label>
        Waktu Pengajuan:
        <input type="text" id="modalWaktu" disabled>
      </label>
      <label>
        Pelapor:
        <input type="text" id="modalPelapor" disabled>
      </label>
      <label>
        Kategori Kendala:
        <input type="text" id="modalKategori" disabled>
      </label>
      <label>
        Judul / Perihal Kendala:
        <input type="text" id="modalJudul" disabled>
      </label>
      <label>
        Detail Deskripsi Masalah:
        <textarea id="modalDeskripsi" rows="4" disabled></textarea>
      </label>
    </div>
    <div class="modal-footer">
      <button class="btn-close-btn" onclick="closeDetailModal()">Tutup</button>
    </div>
  </div>
</div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbw3AD9zzKrjxp9stU-nbBrPS3jSv8O9oDLp6O51_Absp6OTBq9yWah4J8q_DnRrhkPt/exec";
  let isListView = false;

  function showLoading(text = "Memproses data...") {
    document.getElementById("loadingText").textContent = text;
    document.getElementById("loadingOverlay").style.display = "flex";
  }
  function hideLoading() {
    document.getElementById("loadingOverlay").style.display = "none";
  }

  function toggleView() {
    isListView = !isListView;
    const formView = document.getElementById("formView");
    const listView = document.getElementById("listView");
    const btnToggle = document.getElementById("btnToggleView");
    const pageTitle = document.getElementById("pageTitle");
    const pageSubtitle = document.getElementById("pageSubtitle");

    if (isListView) {
      formView.style.display = "none";
      listView.style.display = "flex";
      btnToggle.textContent = "✍️ Buat Permintaan Baru";
      pageTitle.textContent = "Daftar Permintaan Bantuan";
      pageSubtitle.textContent = "Ketuk salah satu daftar untuk melihat detail lengkap";
      loadPbasList();
    } else {
      formView.style.display = "flex";
      listView.style.display = "none";
      btnToggle.textContent = "📋 Lihat Daftar Permintaan";
      pageTitle.textContent = "Permintaan Bantuan Asset & System";
      pageSubtitle.textContent = "Isi formulir di bawah ini untuk mengajukan perbaikan atau kendala asset/sistem";
    }
  }

  function formatShortDate(dateString) {
    if (!dateString) return "";
    const d = new Date(dateString);
    if (isNaN(d.getTime())) return dateString;
    const months = ["Jan", "Feb", "Mar", "Apr", "Mei", "Jun", "Jul", "Agt", "Sep", "Okt", "Nov", "Des"];
    const day = String(d.getDate()).padStart(2, '0');
    const month = months[d.getMonth()];
    const hours = String(d.getHours()).padStart(2, '0');
    const minutes = String(d.getMinutes()).padStart(2, '0');
    return `${day} ${month}, ${hours}:${minutes}`;
  }

  async function loadPbasList() {
    showLoading("Memuat daftar permintaan...");
    const container = document.getElementById("pbasListContainer");
    container.innerHTML = "<div style='text-align:center; color:#9099a2; padding:20px;'>Memuat data...</div>";

    try {
      const response = await fetch(`${API_URL}?action=getPbas`);
      const result = await response.json();
      hideLoading();

      const list = Array.isArray(result) ? result : [];
      if (list.length === 0) {
        container.innerHTML = "<div style='text-align:center; color:#9099a2; padding:30px;'>Belum ada data permintaan bantuan.</div>";
        return;
      }

      container.innerHTML = "";
      list.reverse().forEach(item => {
        const card = document.createElement("div");
        card.className = "pbas-item-card";
        card.onclick = () => openDetailModal(item);

        card.innerHTML = `
          <div class="pbas-item-left">
            <span class="pbas-title">${item.judul || "(Tanpa Judul)"}</span>
            <div class="pbas-meta">
              <span>Pelapor: <b>${item.nama || "-"}</b></span>
              <span>•</span>
              <span>${formatShortDate(item.waktu)}</span>
            </div>
          </div>
          <div>
            <span class="badge-cat">${item.kategori || "Lainnya"}</span>
          </div>
        `;
        container.appendChild(card);
      });
    } catch (err) {
      hideLoading();
      container.innerHTML = "<div style='text-align:center; color:#f87171; padding:20px;'>Gagal memuat data dari server.</div>";
    }
  }

  function openDetailModal(item) {
    document.getElementById("modalIdTitle").textContent = `Detail Permintaan (${item.id})`;
    document.getElementById("modalId").value = item.id || "-";
    document.getElementById("modalWaktu").value = item.waktu || "-";
    document.getElementById("modalPelapor").value = item.nama || "-";
    document.getElementById("modalKategori").value = item.kategori || "-";
    document.getElementById("modalJudul").value = item.judul || "-";
    document.getElementById("modalDeskripsi").value = item.deskripsi || "-";

    document.getElementById("pbasDetailModal").style.display = "flex";
  }

  function closeDetailModal() {
    document.getElementById("pbasDetailModal").style.display = "none";
  }

  async function kirimPermintaan() {
    const nama = document.getElementById("pbasNama").value.trim();
    const kategori = document.getElementById("pbasKategori").value;
    const judul = document.getElementById("pbasJudul").value.trim();
    const deskripsi = document.getElementById("pbasDeskripsi").value.trim();

    if (!nama || !judul || !deskripsi) {
      alert("Mohon lengkapi semua kolom formulir terlebih dahulu!");
      return;
    }

    showLoading("Mengirim permintaan...");
    try {
      await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: new URLSearchParams({
          action: "pbas",
          nama: nama,
          kategori: kategori,
          judul: judul,
          deskripsi: deskripsi
        })
      });
      hideLoading();
      alert("Permintaan bantuan berhasil dikirim dan tercatat di sistem!");
      
      // Reset form
      document.getElementById("pbasNama").value = "";
      document.getElementById("pbasJudul").value = "";
      document.getElementById("pbasDeskripsi").value = "";

      // Pindah ke view daftar
      toggleView();
    } catch (err) {
      hideLoading();
      alert("Gagal mengirim permintaan. Periksa koneksi internet Anda.");
    }
  }
</script>

</body>
</html>
