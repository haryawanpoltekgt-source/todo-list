<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Login - Portal Asset & System</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#12161f">
  
  <style>
    :root {
      --bg-app: #12161f;
      --card-bg: #1c2230;
      --text-main: #f1f3f5;
      --text-secondary: #9099a2;
      --border-color: #2a3447;
      --accent-blue: #3b82f6;
      --accent-purple: #8b5cf6;
      --accent-green: #22c55e;
      --accent-red: #ef4444;
      --accent-warn: #f59e0b;
    }

    * { 
      box-sizing: border-box; 
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }

    input {
      -webkit-user-select: text;
      -moz-user-select: text;
      -ms-user-select: text;
      user-select: text;
    }

    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-app);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 420px;
      padding: 16px;
    }

    .login-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 24px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .login-header h3 {
      margin: 0 0 4px 0;
      color: #ffffff;
      font-size: 18px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
    }

    .form-group input {
      padding: 10px 12px;
      font-size: 13px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      outline: none;
      background: #161b26;
      color: var(--text-main);
    }

    .form-group input:focus {
      border-color: var(--accent-blue);
    }

    .btn-submit {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: white;
      border: none;
      padding: 11px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 13.5px;
      cursor: pointer;
      margin-top: 6px;
      box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3);
    }

    .btn-submit-reg {
      background: linear-gradient(135deg, #10b981, #059669);
    }

    .btn-back {
      background: #2a3447;
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 10px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 12.5px;
      cursor: pointer;
      text-decoration: none;
      text-align: center;
    }

    .switch-link {
      margin-top: 4px;
      font-size: 12px;
      color: var(--text-secondary);
    }

    .switch-link a {
      color: var(--accent-blue);
      font-weight: 600;
      text-decoration: none;
    }

    #loadingOverlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(18, 22, 31, 0.85);
      backdrop-filter: blur(5px);
      z-index: 2000;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      gap: 12px;
    }
    .spinner {
      width: 45px;
      height: 45px;
      border: 4px solid var(--border-color);
      border-top: 4px solid var(--accent-blue);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div id="loadingOverlay">
  <div class="spinner"></div>
  <div style="font-size: 13px; font-weight: 600;" id="loadingText">Memproses data...</div>
</div>

<div class="container">
  <!-- FORM LOGIN -->
  <div class="login-card" id="loginFormCard">
    <div class="login-header">
      <h3>Login Portal Asset & System</h3>
      <span style="font-size: 12px; color: var(--text-secondary);">Silakan masuk untuk mengakses sistem</span>
    </div>

    <div class="form-group">
      <label>Nomor Induk Pegawai (NIP):</label>
      <input type="text" id="loginNip" placeholder="Masukkan NIP...">
    </div>

    <div class="form-group">
      <label>Password:</label>
      <input type="password" id="loginPass" placeholder="Masukkan password...">
    </div>

    <div class="switch-link">
      <span>Belum punya akun?</span> 
      <a href="javascript:void(0);" onclick="toggleForm('register')">Buat Akun di sini</a>
    </div>

    <div style="display: flex; gap: 8px; margin-top: 6px;">
      <a href="index.html" class="btn-back" style="flex: 1;">Kembali</a>
      <button class="btn-submit" style="flex: 1.5;" onclick="submitLogin()">Masuk</button>
    </div>
  </div>

  <!-- FORM REGISTER -->
  <div class="login-card" id="registerFormCard" style="display: none;">
    <div class="login-header">
      <h3>Pendaftaran Akun Baru</h3>
      <span style="font-size: 12px; color: var(--text-secondary);">Isi data di bawah untuk mengajukan akun</span>
    </div>

    <div class="form-group">
      <label>NIP (Nomor Induk Pegawai):</label>
      <input type="text" id="regNip" placeholder="Masukkan NIP unik...">
    </div>

    <div class="form-group">
      <label>Nama Lengkap:</label>
      <input type="text" id="regNama" placeholder="Masukkan nama lengkap...">
    </div>

    <div class="form-group">
      <label>Password:</label>
      <input type="password" id="regPass" placeholder="Buat password...">
    </div>

    <span style="font-size: 11px; color: #94a3b8;">*Akun baru memerlukan persetujuan (Approved) oleh SuperUser.</span>

    <div class="switch-link">
      <span>Sudah punya akun?</span> 
      <a href="javascript:void(0);" onclick="toggleForm('login')">Login di sini</a>
    </div>

    <div style="display: flex; gap: 8px; margin-top: 6px;">
      <a href="index.html" class="btn-back" style="flex: 1;">Batal</a>
      <button class="btn-submit btn-submit-reg" style="flex: 1.5;" onclick="submitRegister()">Daftar Akun</button>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script>
  const API_URL = CONFIG.API_URL;

  function showLoading(text) {
    document.getElementById("loadingText").textContent = text;
    document.getElementById("loadingOverlay").style.display = "flex";
  }
  function hideLoading() {
    document.getElementById("loadingOverlay").style.display = "none";
  }

  function toggleForm(target) {
    if (target === 'register') {
      document.getElementById('loginFormCard').style.display = 'none';
      document.getElementById('registerFormCard').style.display = 'flex';
    } else {
      document.getElementById('registerFormCard').style.display = 'none';
      document.getElementById('loginFormCard').style.display = 'flex';
    }
  }

  async function submitLogin() {
    const nip = document.getElementById("loginNip").value.trim();
    const password = document.getElementById("loginPass").value.trim();

    if (!nip || !password) {
      alert("NIP dan Password wajib diisi.");
      return;
    }

    showLoading("Memverifikasi akun...");
    try {
      const response = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: new URLSearchParams({ action: "login", nip: nip, password: password })
      });
      const res = await response.json();

      if (res.status === "success") {
        localStorage.setItem("pbas_nama", res.nama);
        localStorage.setItem("pbas_nip", nip);
        localStorage.setItem("pbas_role", res.role || "Member");
        localStorage.setItem("pbas_tim", res.tim || "");

        window.location.href = "index.html";
      } else if (res.status === "wrong_password") {
        alert("Password salah.");
      } else if (res.status === "pending") {
        alert("Akun Anda masih berstatus PENDING (Menunggu approval SuperUser).");
      } else {
        alert("NIP tidak ditemukan. Silakan daftar terlebih dahulu.");
      }
    } catch (err) {
      alert("Terjadi kesalahan jaringan.");
    } finally {
      hideLoading();
    }
  }

  async function submitRegister() {
    const nip = document.getElementById("regNip").value.trim();
    const nama = document.getElementById("regNama").value.trim();
    const password = document.getElementById("regPass").value.trim();

    if (!nip || !nama || !password) {
      alert("Semua kolom pendaftaran wajib diisi.");
      return;
    }

    showLoading("Mendaftarkan akun...");
    try {
      const response = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: new URLSearchParams({ action: "register", nip: nip, nama: nama, password: password })
      });
      const res = await response.json();

      if (res.status === "success") {
        alert("Pendaftaran berhasil! Silakan menunggu persetujuan (Approved) dari SuperUser.");
        toggleForm('login');
      } else if (res.status === "registered") {
        alert("NIP sudah terdaftar.");
      } else {
        alert("Pendaftaran gagal.");
      }
    } catch (err) {
      alert("Terjadi kesalahan jaringan.");
    } finally {
      hideLoading();
    }
  }
</script>
</body>
</html>
