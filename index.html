<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DAFTAR TUGAS - Asset & System</title>
  <style>
    :root {
      --primary: #0f62fe;
      --primary-hover: #0353e9;
      --bg-app: #f4f6f9;
      --card-bg: #ffffff;
      --text-main: #161616;
      --text-secondary: #525252;
      --border-color: #e0e0e0;
      --shadow-sm: 0 2px 6px rgba(0, 0, 0, 0.04);
      --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.08);
    }

    * {
      box-sizing: border-box;
    }
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-app);
      color: var(--text-main);
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .container {
      width: 100%;
      max-width: 700px;
      height: 100%;
      max-height: 100vh;
      background: var(--card-bg);
      padding: 18px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 0 24px rgba(0, 0, 0, 0.06);
    }
    
    .header-action-area {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      flex-shrink: 0;
      gap: 8px;
    }
    h2 { 
      color: var(--primary); 
      margin: 0; 
      font-size: 19px;
      font-weight: 700;
      letter-spacing: -0.3px;
      white-space: nowrap;
    }
    
    /* Input Search Bar Profesional */
    .search-input {
      flex: 1;
      padding: 8px 12px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 13px;
      outline: none;
      background: #fafafa;
      transition: all 0.2s ease;
    }
    .search-input:focus {
      background: #fff;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(15, 98, 254, 0.1);
    }

    .button-group {
      display: flex;
      gap: 6px;
    }
    .btn-action-base {
      border: none;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      font-size: 12px;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: background 0.2s;
    }
    .btn-open-add {
      background-color: var(--primary);
      color: white;
    }
    .btn-open-add:hover { background-color: var(--primary-hover); }

    .btn-refresh {
      background-color: #f1f3f5;
      color: var(--text-secondary);
      border: 1px solid var(--border-color);
    }
    .btn-refresh:hover { background-color: #e9ecef; }

    /* Filter Box Profesional */
    .filter-box {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
      flex-shrink: 0;
      background: #f8f9fa;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
    }
    .filter-box label {
      font-size: 11px;
      font-weight: 700;
      color: var(--text-secondary);
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .filter-box select {
      width: 100%;
      padding: 8px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 13px;
      outline: none;
      background: #fff;
      color: var(--text-main);
      font-weight: 500;
      transition: border-color 0.2s;
    }
    .filter-box select:focus {
      border-color: var(--primary);
    }

    /* Area Summary Counting Data - Desain Kartu Korporat */
    .summary-area {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
      border: 1px solid #dee2e6;
      border-radius: 10px;
      padding: 10px 14px;
      margin-bottom: 14px;
      flex-shrink: 0;
      box-shadow: var(--shadow-sm);
    }
    .summary-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-main);
    }
    .summary-badges {
      display: flex;
      gap: 8px;
    }
    .count-chip {
      font-size: 11px;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 5px;
      box-shadow: 0 1px 2px rgba(0,0,0,0.03);
    }
    .count-open { background-color: #e7f5ff; color: #1864ab; border: 1px solid #74c0fc; }
    .count-progress { background-color: #fff9db; color: #f59f00; border: 1px solid #ffe066; }
    .count-closed { background-color: #ebfbee; color: #2b8a3e; border: 1px solid #8ce99a; }

    /* Area List Tugas Tetap Putih Bersih dengan Efek Shadow Elegan */
    .task-scroll-area {
      flex: 1;
      overflow-y: auto;
      padding-right: 2px;
      -webkit-overflow-scrolling: touch;
    }
    ul { list-style: none; padding: 0; margin: 0; }
    
    li.task-item {
      background: #ffffff;
      padding: 12px 16px;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: all 0.2s ease;
    }
    li.task-item:hover {
      background: #ffffff;
      border-color: var(--primary);
      box-shadow: var(--shadow-md);
      transform: translateY(-1px);
    }
    .task-preview-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
      overflow: hidden;
      flex: 1;
      padding-right: 12px;
    }
    .task-plan-text {
      font-weight: 600;
      color: var(--text-main);
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .task-meta-preview {
      font-size: 11.5px;
      color: var(--text-secondary);
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .badge-status {
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 11.5px;
      font-weight: 600;
      white-space: nowrap;
    }
    .status-Open { background-color: #e7f5ff; color: #1864ab; }
    .status-Progress { background-color: #fff9db; color: #f59f00; }
    .status-Closed { background-color: #ebfbee; color: #2b8a3e; }

    /* Modal Styling */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(2px);
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 12px;
      box-sizing: border-box;
    }
    .modal-content {
      background: white;
      width: 100%;
      max-width: 550px;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      display: flex;
      flex-direction: column;
      gap: 12px;
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 8px;
    }
    .modal-header h3 { margin: 0; color: var(--primary); font-size: 17px; }
    .btn-close-modal {
      background: transparent;
      border: none;
      font-size: 22px;
      cursor: pointer;
      color: var(--text-secondary);
      line-height: 1;
    }
    .modal-body {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .modal-body label {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
    }
    .modal-body input, .modal-body select, .modal-body textarea {
      padding: 8px 10px;
      font-size: 13px;
      font-family: inherit;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      outline: none;
      width: 100%;
      background: #fafafa;
    }
    .modal-body input:focus, .modal-body select:focus, .modal-body textarea:focus {
      background: #fff;
      border-color: var(--primary);
    }
    .modal-body input:disabled, .modal-body select:disabled, .modal-body textarea:disabled {
      background-color: #f1f3f5;
      color: #868e96;
      cursor: not-allowed;
    }
    .modal-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--border-color);
      padding-top: 12px;
    }
    .btn-delete {
      background: transparent;
      color: #e03131;
      border: none;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
    }
    .btn-delete:hover { text-decoration: underline; }
    .btn-save {
      background-color: #2b8a3e;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      transition: background 0.2s;
    }
    .btn-save:hover { background-color: #2b8a3e; opacity: 0.9; }

    @media (max-width: 480px) {
      .container { padding: 12px; border-radius: 0; }
      h2 { font-size: 17px; }
      .filter-box { padding: 8px; gap: 6px; }
      .summary-area { flex-direction: column; align-items: flex-start; gap: 6px; padding: 8px 12px; }
      .summary-badges { width: 100%; justify-content: space-between; }
    }
  </style>
</head>
<body>

<div class="container">
  <!-- Header dengan Search Bar Profesional -->
  <div class="header-action-area">
    <h2>Daftar Tugas</h2>
    <input type="text" id="searchInput" class="search-input" placeholder="Cari tugas..." oninput="renderTasks()">
    <div class="button-group">
      <button class="btn-action-base btn-refresh" onclick="loadTasks()" title="Muat Ulang Data">🔄</button>
      <button class="btn-action-base btn-open-add" onclick="openAddModal()">+ Tambah</button>
    </div>
  </div>

  <!-- Filter Box Korporat -->
  <div class="filter-box">
    <label>
      Filter PIC:
      <select id="filterPic" onchange="renderTasks()">
        <option value="ALL">Semua PIC</option>
      </select>
    </label>
    <label>
      Filter Status:
      <select id="filterStatus" onchange="renderTasks()">
        <option value="ACTIVE" selected>Tugas Aktif</option>
        <option value="ALL">Semua Status</option>
        <option value="Open">Open</option>
        <option value="Progress">Progress</option>
        <option value="Closed">Closed</option>
      </select>
    </label>
  </div>

  <!-- Area Ringkasan Counting Data (Design Kartu Elegan) -->
  <div class="summary-area">
    <span class="summary-title" id="summaryPicLabel">Total Tugas (Semua PIC):</span>
    <div class="summary-badges">
      <span class="count-chip count-open">Open: <b id="countOpen">0</b></span>
      <span class="count-chip count-progress">Progress: <b id="countProgress">0</b></span>
      <span class="count-chip count-closed">Closed: <b id="countClosed">0</b></span>
    </div>
  </div>

  <!-- Daftar List Tugas (Tetap Putih Bersih & Profesional) -->
  <div class="task-scroll-area">
    <ul id="taskList">
      <li style='text-align:center; color:#868e96; padding:20px;'>Memuat data...</li>
    </ul>
  </div>
</div>

<datalist id="picListOptions"></datalist>

<!-- Pop-up Modal: Tambah Tugas Baru -->
<div class="modal-overlay" id="addModal">
  <div class="modal-content">
    <div class="modal-header">
      <h3>Tambah Tugas Baru</h3>
      <button class="btn-close-modal" onclick="closeAddModal()">&times;</button>
    </div>
    <div class="modal-body">
      <label>
        Tugas Saya (Plan):
        <input type="text" id="taskInput" placeholder="Nama tugas..." onkeypress="handleAddKeyPress(event)">
      </label>
      <label>
        PIC:
        <input type="text" id="picInput" placeholder="Nama PIC" list="picListOptions">
      </label>
      <label>
        Update Rencana Awalan (Do):
        <input type="text" id="updateDoInput" placeholder="Rencana awal...">
      </label>
      <label>
        Status (Check):
        <select id="statusInput" onchange="handleStatusChange('add')">
          <option value="Open">Open</option>
          <option value="Progress">Progress</option>
          <option value="Closed">Closed</option>
        </select>
      </label>
      <label>
        % Status:
        <select id="percentInput" onchange="handlePercentChange('add')">
          <option value="0%">0%</option>
          <option value="10%">10%</option>
          <option value="20%">20%</option>
          <option value="30%">30%</option>
          <option value="40%">40%</option>
          <option value="50%">50%</option>
          <option value="60%">60%</option>
          <option value="70%">70%</option>
          <option value="80%">80%</option>
          <option value="90%">90%</option>
          <option value="100%">100%</option>
        </select>
      </label>
      <label>
        Update Tindakan Terakhir (Action):
        <textarea id="updateActionInput" rows="3" placeholder="Tindakan terakhir..."></textarea>
      </label>
    </div>
    <div class="modal-footer">
      <button onclick="closeAddModal()" style="font-size: 13px; padding: 8px 12px; background: #f1f3f5; border: 1px solid #ced4da; border-radius: 6px; cursor: pointer; font-weight: 500;">Batal</button>
      <button class="btn-save" onclick="addTask()">Simpan Tugas Baru</button>
    </div>
  </div>
</div>

<!-- Pop-up Modal: Detail & Edit Tugas -->
<div class="modal-overlay" id="taskModal">
  <div class="modal-content">
    <div class="modal-header">
      <h3 id="modalTitleID">Detail Tugas</h3>
      <button class="btn-close-modal" onclick="closeModal()">&times;</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="modalTaskId">
      <label>
        Tgl Dibuat:
        <input type="text" id="modalCreatedAt" readonly>
      </label>
      <label id="closedAtWrapper" style="display: none;">
        Tgl Ditutup (Closed):
        <input type="text" id="modalClosedAt" readonly style="background-color: #ebfbee; color: #2b8a3e;">
      </label>
      <label>
        Tugas Saya (Plan):
        <input type="text" id="modalTaskText">
      </label>
      <label>
        PIC:
        <input type="text" id="modalPicText" list="picListOptions">
      </label>
      <label>
        Update Rencana Awalan (Do):
        <input type="text" id="modalUpdateDoText">
      </label>
      <label>
        Status (Check):
        <select id="modalStatusSelect" onchange="handleStatusChange('edit')">
          <option value="Open">Open</option>
          <option value="Progress">Progress</option>
          <option value="Closed">Closed</option>
        </select>
      </label>
      <label>
        % Status:
        <select id="modalPercentSelect" onchange="handlePercentChange('edit')">
          <option value="0%">0%</option>
          <option value="10%">10%</option>
          <option value="20%">20%</option>
          <option value="30%">30%</option>
          <option value="40%">40%</option>
          <option value="50%">50%</option>
          <option value="60%">60%</option>
          <option value="70%">70%</option>
          <option value="80%">80%</option>
          <option value="90%">90%</option>
          <option value="100%">100%</option>
        </select>
      </label>
      <label>
        Update Tindakan Terakhir (Action):
        <textarea id="modalUpdateActionText" rows="3"></textarea>
      </label>
    </div>
    <div class="modal-footer">
      <button class="btn-delete" id="modalDeleteBtn" onclick="deleteTaskFromModal()">Hapus Tugas</button>
      <div style="display: flex; gap: 8px;">
        <button onclick="closeModal()" style="font-size: 13px; padding: 8px 12px; background: #f1f3f5; border: 1px solid #ced4da; border-radius: 6px; cursor: pointer; font-weight: 500;">Tutup</button>
        <button class="btn-save" id="modalSaveBtn" onclick="saveTaskDetails()">Simpan Perubahan</button>
      </div>
    </div>
  </div>
</div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbwEtBCnhJmx0TfC5y58GZpYaRUFlrA8ltLKAuzIx7g_UXHrCvk4yqnWkox7moY3_vLv/exec";

  let allTasks = [];

  function formatDateCustom(dateString) {
    if (!dateString) return "-";
    const d = new Date(dateString);
    if (isNaN(d.getTime())) return dateString;

    const months = ["Jan", "Feb", "Mar", "Apr", "Mei", "Jun", "Jul", "Agt", "Sep", "Okt", "Nov", "Des"];
    const day = String(d.getDate()).padStart(2, '0');
    const month = months[d.getMonth()];
    const year = d.getFullYear();
    const hours = String(d.getHours()).padStart(2, '0');
    const minutes = String(d.getMinutes()).padStart(2, '0');

    return `${day} ${month} ${year} ${hours}:${minutes}`;
  }

  async function loadTasks() {
    try {
      document.getElementById("taskList").innerHTML = "<li style='padding:20px; text-align:center; color:#868e96;'>Memuat data terbaru...</li>";
      
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 15000);

      const response = await fetch(API_URL, { signal: controller.signal });
      clearTimeout(timeoutId);

      if (!response.ok) throw new Error("Network response was not ok");
      
      const result = await response.json();
      allTasks = Array.isArray(result) ? result : [];
      
      updatePicOptions();
      renderTasks();
    } catch (err) {
      console.error(err);
      document.getElementById("taskList").innerHTML = "<li style='padding:20px; text-align:center; color:#e03131;'>Gagal memuat tugas. Silakan klik tombol Refresh.</li>";
    }
  }

  function updatePicOptions() {
    const filterPicSelect = document.getElementById("filterPic");
    const currentFilterValue = filterPicSelect.value;
    const datalist = document.getElementById("picListOptions");
    
    const pics = [...new Set(allTasks.map(t => t.pic).filter(p => p && p !== "-"))];

    filterPicSelect.innerHTML = `<option value="ALL">Semua PIC</option>`;
    pics.forEach(pic => {
      const opt = document.createElement("option");
      opt.value = pic;
      opt.textContent = pic;
      filterPicSelect.appendChild(opt);
    });
    filterPicSelect.value = currentFilterValue;

    datalist.innerHTML = "";
    pics.forEach(pic => {
      const opt = document.createElement("option");
      opt.value = pic;
      datalist.appendChild(opt);
    });
  }

  function renderTasks() {
    const list = document.getElementById("taskList");
    const selectedPic = document.getElementById("filterPic").value;
    const selectedStatus = document.getElementById("filterStatus").value;
    const keyword = document.getElementById("searchInput").value.toLowerCase().trim();

    list.innerHTML = "";

    const scopeForCounting = allTasks.filter(t => {
      const matchPic = (selectedPic === "ALL") || (t.pic === selectedPic);
      const matchSearch = !keyword || 
        (t.task && t.task.toLowerCase().includes(keyword)) ||
        (t.pic && t.pic.toLowerCase().includes(keyword)) ||
        (t.updateDo && t.updateDo.toLowerCase().includes(keyword)) ||
        (t.updateAction && t.updateAction.toLowerCase().includes(keyword));
      return matchPic && matchSearch;
    });

    let openCount = 0;
    let progressCount = 0;
    let closedCount = 0;

    scopeForCounting.forEach(t => {
      if (t.status === "Open") openCount++;
      else if (t.status === "Progress") progressCount++;
      else if (t.status === "Closed") closedCount++;
    });

    document.getElementById("summaryPicLabel").textContent = (selectedPic === "ALL") 
      ? "Total Tugas (Semua PIC):" 
      : `Total Tugas (${selectedPic}):`;

    document.getElementById("countOpen").textContent = openCount;
    document.getElementById("countProgress").textContent = progressCount;
    document.getElementById("countClosed").textContent = closedCount;

    const filtered = scopeForCounting.filter(t => {
      if (selectedStatus === "ACTIVE") {
        return (t.status === "Open" || t.status === "Progress");
      } else if (selectedStatus === "ALL") {
        return true;
      } else {
        return (t.status === selectedStatus);
      }
    });

    if (filtered.length === 0) {
      list.innerHTML = "<li style='text-align:center; color:#868e96; display:block; padding:20px;'>Tidak ada tugas yang sesuai.</li>";
      return;
    }

    const reversedFiltered = filtered.slice().reverse();

    reversedFiltered.forEach(t => {
      const li = document.createElement("li");
      li.className = "task-item";
      li.onclick = () => openModal(t);

      li.innerHTML = `
        <div class="task-preview-info">
          <span class="task-plan-text">${t.task || "(Tanpa Nama Tugas)"}</span>
          <div class="task-meta-preview">
            <span><b>PIC:</b> ${t.pic || "-"}</span>
            <span>•</span>
            <span><b>% Status:</b> ${t.percentStatus || "0%"}</span>
          </div>
        </div>
        <div>
          <span class="badge-status status-${t.status}">${t.status}</span>
        </div>
      `;
      list.appendChild(li);
    });
  }

  function handlePercentChange(mode) {
    let percentVal, statusSelect;
    if (mode === 'add') {
      percentVal = document.getElementById("percentInput").value;
      statusSelect = document.getElementById("statusInput");
    } else {
      percentVal = document.getElementById("modalPercentSelect").value;
      statusSelect = document.getElementById("modalStatusSelect");
    }

    const num = parseInt(percentVal);

    if (num >= 10 && num <= 90) {
      statusSelect.value = "Progress";
    } else if (num === 100) {
      statusSelect.value = "Closed";
    } else if (num === 0) {
      statusSelect.value = "Open";
    }
  }

  function handleStatusChange(mode) {
    let statusVal, percentSelect;
    if (mode === 'add') {
      statusVal = document.getElementById("statusInput").value;
      percentSelect = document.getElementById("percentInput");
    } else {
      statusVal = document.getElementById("modalStatusSelect").value;
      percentSelect = document.getElementById("modalPercentSelect");
    }

    if (statusVal === "Closed") {
      percentSelect.value = "100%";
    } else if (statusVal === "Open") {
      percentSelect.value = "0%";
    } else if (statusVal === "Progress") {
      if (percentSelect.value === "0%" || percentSelect.value === "100%") {
        percentSelect.value = "50%";
      }
    }
  }

  function openAddModal() {
    document.getElementById("addModal").style.display = "flex";
  }
  function closeAddModal() {
    document.getElementById("addModal").style.display = "none";
  }

  function openModal(task) {
    document.getElementById("modalTaskId").value = task.id;
    document.getElementById("modalTitleID").textContent = `Detail Tugas (${task.id})`;
    document.getElementById("modalCreatedAt").value = formatDateCustom(task.createdAt);
    
    const isClosed = (task.status === "Closed");
    
    const closedAtWrapper = document.getElementById("closedAtWrapper");
    if (isClosed && task.closedAt) {
      closedAtWrapper.style.display = "flex";
      document.getElementById("modalClosedAt").value = formatDateCustom(task.closedAt);
    } else {
      closedAtWrapper.style.display = "none";
    }

    document.getElementById("modalTaskText").value = task.task || "";
    document.getElementById("modalPicText").value = task.pic || "";
    document.getElementById("modalUpdateDoText").value = task.updateDo || "";
    document.getElementById("modalStatusSelect").value = task.status || "Open";
    document.getElementById("modalPercentSelect").value = task.percentStatus || "0%";
    document.getElementById("modalUpdateActionText").value = task.updateAction || "";

    const inputs = [
      document.getElementById("modalTaskText"),
      document.getElementById("modalPicText"),
      document.getElementById("modalUpdateDoText"),
      document.getElementById("modalStatusSelect"),
      document.getElementById("modalPercentSelect"),
      document.getElementById("modalUpdateActionText")
    ];

    inputs.forEach(el => el.disabled = isClosed);

    document.getElementById("modalSaveBtn").style.display = isClosed ? "none" : "inline-block";
    document.getElementById("modalDeleteBtn").style.display = isClosed ? "none" : "inline-block";

    document.getElementById("taskModal").style.display = "flex";
  }

  function closeModal() {
    document.getElementById("taskModal").style.display = "none";
  }

  async function saveTaskDetails() {
    const id = document.getElementById("modalTaskId").value;
    const task = document.getElementById("modalTaskText").value.trim();
    const pic = document.getElementById("modalPicText").value.trim();
    const updateDo = document.getElementById("modalUpdateDoText").value.trim();
    const status = document.getElementById("modalStatusSelect").value;
    const percentStatus = document.getElementById("modalPercentSelect").value;
    const updateAction = document.getElementById("modalUpdateActionText").value.trim();

    if (!task) {
      alert("Nama tugas (Plan) tidak boleh kosong!");
      return;
    }

    try {
      await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: new URLSearchParams({
          action: "update",
          id: id,
          task: task,
          pic: pic,
          updateDo: updateDo,
          status: status,
          percentStatus: percentStatus,
          updateAction: updateAction
        })
      });
      closeModal();
      loadTasks();
    } catch (err) {
      alert("Gagal menyimpan perubahan. Silakan coba lagi.");
    }
  }

  async function addTask() {
    const taskInput = document.getElementById("taskInput");
    const picInput = document.getElementById("picInput");
    const updateDoInput = document.getElementById("updateDoInput");
    const statusInput = document.getElementById("statusInput");
    const percentInput = document.getElementById("percentInput");
    const updateActionInput = document.getElementById("updateActionInput");

    const taskText = taskInput.value.trim();
    if (!taskText) {
      print("Silakan isi nama tugas terlebih dahulu!");
      alert("Silakan isi nama tugas terlebih dahulu!");
      return;
    }

    try {
      await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: new URLSearchParams({
          action: "add",
          task: taskText,
          pic: picInput.value.trim() || "-",
          updateDo: updateDoInput.value.trim(),
          status: statusInput.value,
          percentStatus: percentInput.value,
          updateAction: updateActionInput.value.trim()
        })
      });

      taskInput.value = "";
      picInput.value = "";
      updateDoInput.value = "";
      updateActionInput.value = "";
      statusInput.value = "Open";
      percentInput.value = "0%";

      closeAddModal();
      loadTasks();
    } catch (err) {
      alert("Gagal menambahkan tugas. Silakan coba lagi.");
    }
  }

  async function deleteTaskFromModal() {
    const id = document.getElementById("modalTaskId").value;
    if (!confirm("Yakin ingin menghapus tugas ini?")) return;

    try {
      await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: new URLSearchParams({ action: "delete", id: id })
      });
      closeModal();
      loadTasks();
    } catch (err) {
      alert("Gagal menghapus tugas.");
    }
  }

  function handleAddKeyPress(e) {
    if (e.key === "Enter") addTask();
  }

  loadTasks();
</script>

</body>
</html>
