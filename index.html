<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TUGASKU - ASSET&SYSTEM</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f3f2f1;
      display: flex;
      justify-content: center;
      padding: 30px 15px;
    }
    .container {
      width: 100%;
      max-width: 750px;
      background: white;
      padding: 24px;
      border-radius: 10px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
    }
    h2 { color: #2564cf; margin-top: 0; margin-bottom: 20px; }
    
    /* Input Form Area */
    .input-form {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
      background: #fafafa;
      padding: 15px;
      border-radius: 6px;
      border: 1px solid #eaeaea;
    }
    .input-row {
      display: flex;
      gap: 10px;
    }
    input[type="text"], select, textarea {
      padding: 9px 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
      outline: none;
      font-size: 14px;
      font-family: inherit;
    }
    .input-row input[type="text"], .input-row textarea { flex: 1; }
    .input-row select { width: 130px; }
    
    button.btn-add {
      padding: 10px 18px;
      background-color: #2564cf;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
    }
    button.btn-add:hover { background-color: #1151b5; }

    /* Filter Combobox Area */
    .filter-box {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      padding-bottom: 15px;
      border-bottom: 1px solid #eee;
    }
    .filter-box label {
      font-size: 12px;
      font-weight: bold;
      color: #605e5c;
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
    }

    /* Task List Items */
    ul { list-style: none; padding: 0; margin: 0; }
    li {
      background: #fff;
      padding: 14px;
      border: 1px solid #e1dfdd;
      border-radius: 6px;
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .task-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .task-title {
      font-weight: 600;
      color: #323130;
      font-size: 15px;
      border: 1px transparent solid;
      padding: 2px 4px;
      border-radius: 3px;
      width: 100%;
    }
    .task-title:hover {
      border-color: #ccc;
      background: #f9f9f9;
    }
    .task-details {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      font-size: 13px;
    }
    .task-details label {
      display: flex;
      flex-direction: column;
      gap: 3px;
      color: #605e5c;
      font-weight: 600;
    }
    .task-details input, .task-details select {
      padding: 6px 8px;
      font-size: 13px;
    }
    .badge-id-date {
      font-size: 11px;
      color: #8a8886;
      background: #f3f2f1;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .btn-delete {
      background: transparent;
      color: #a80000;
      border: none;
      cursor: pointer;
      font-size: 12px;
    }
    .btn-delete:hover { text-decoration: underline; }

    /* Status Badge Colors */
    select.status-select {
      font-weight: 600;
      border-radius: 4px;
    }
    select.status-Open { background-color: #eff6fc; color: #0078d4; border-color: #c7e0f4; }
    select.status-Progress { background-color: #fff4ce; color: #8a6d00; border-color: #fed9cc; }
    select.status-Closed { background-color: #dff6dd; color: #107c41; border-color: #92c353; }
  </style>
</head>
<body>

<div class="container">
  <h2>Tugasku (To Do)</h2>

  <!-- Input Form -->
  <div class="input-form">
    <div class="input-row">
      <input type="text" id="taskInput" placeholder="Tugas Saya (Plan)..." onkeypress="handleKeyPress(event)">
      <input type="text" id="picInput" placeholder="PIC">
    </div>
    <div class="input-row">
      <input type="text" id="updateDoInput" placeholder="Update (DO)...">
      <select id="statusInput" class="status-select status-Open" onchange="this.className='status-select status-'+this.value">
        <option value="Open">Open</option>
        <option value="Progress">Progress</option>
        <option value="Closed">Closed</option>
      </select>
      <select id="percentInput">
        <option value="0%">0%</option>
        <option value="10%">10%</option>
        <option value="20%">20%</option>
        <option value="30%">30%</option>
        <option value="40%">40%</option>
        <option value="50%">50%</option>
        <option value="60%">60%</option>
        <option value="70%">70%</option>
        <option value="80%">80%</option>
        <option value="90%">90%</option>
        <option value="100%">100%</option>
      </select>
    </div>
    <div class="input-row">
      <input type="text" id="updateActionInput" placeholder="Update (Action)...">
      <button class="btn-add" onclick="addTask()">Tambah Tugas</button>
    </div>
  </div>

  <!-- Combobox Filter -->
  <div class="filter-box">
    <label>
      Filter PIC:
      <select id="filterPic" onchange="renderTasks()">
        <option value="ALL">Semua PIC</option>
      </select>
    </label>
    <label>
      Filter Status:
      <select id="filterStatus" onchange="renderTasks()">
        <option value="ALL">Semua Status</option>
        <option value="Open">Open</option>
        <option value="Progress">Progress</option>
        <option value="Closed">Closed</option>
      </select>
    </label>
  </div>

  <!-- Daftar Tugas -->
  <ul id="taskList">
    <li>Memuat data...</li>
  </ul>
</div>

<script>
  // GANTI DENGAN URL WEB APP GOOGLE APPS SCRIPT ANDA
  const API_URL = "URL_WEB_APP_ANDA_DISINI";

  let allTasks = [];

  async function loadTasks() {
    try {
      const response = await fetch(API_URL);
      allTasks = await response.json();
      updatePicFilterOptions();
      renderTasks();
    } catch (err) {
      document.getElementById("taskList").innerHTML = "<li>Gagal memuat tugas.</li>";
    }
  }

  function updatePicFilterOptions() {
    const filterPicSelect = document.getElementById("filterPic");
    const currentValue = filterPicSelect.value;
    
    const pics = [...new Set(allTasks.map(t => t.pic).filter(p => p))];

    filterPicSelect.innerHTML = `<option value="ALL">Semua PIC</option>`;
    pics.forEach(pic => {
      const opt = document.createElement("option");
      opt.value = pic;
      opt.textContent = pic;
      filterPicSelect.appendChild(opt);
    });

    filterPicSelect.value = currentValue;
  }

  function renderTasks() {
    const list = document.getElementById("taskList");
    const selectedPic = document.getElementById("filterPic").value;
    const selectedStatus = document.getElementById("filterStatus").value;

    list.innerHTML = "";

    const filtered = allTasks.filter(t => {
      const matchPic = (selectedPic === "ALL") || (t.pic === selectedPic);
      const matchStatus = (selectedStatus === "ALL") || (t.status === selectedStatus);
      return matchPic && matchStatus;
    });

    if (filtered.length === 0) {
      list.innerHTML = "<li style='text-align:center; color:#8a8886;'>Tidak ada tugas yang sesuai.</li>";
      return;
    }

    filtered.forEach(t => {
      const li = document.createElement("li");

      // Generate pilihan persentase 0% s/d 100% kelipatan 10%
      let percentOptions = "";
      for (let p = 0; p <= 100; p += 10) {
        const valStr = p + "%";
        const selected = (t.percentStatus === valStr) ? "selected" : "";
        percentOptions += `<option value="${valStr}" ${selected}>${valStr}</option>`;
      }

      li.innerHTML = `
        <div class="task-header">
          <span class="badge-id-date">${t.id} | Dibuat: ${t.createdAt}</span>
          <button class="btn-delete" onclick="deleteTask('${t.id}')">Hapus</button>
        </div>
        <div>
          <!-- Kolom C: Tugas Saya (Plan) -->
          <input type="text" class="task-title" value="${t.task}" onchange="updateField('${t.id}', 'task', this.value)" placeholder="Tugas Saya (Plan)">
        </div>
        <div class="task-details">
          <!-- Kolom D: PIC -->
          <label>PIC: 
            <input type="text" value="${t.pic}" onchange="updateField('${t.id}', 'pic', this.value)">
          </label>
          
          <!-- Kolom F: Status (Check) -->
          <label>Status: 
            <select class="status-select status-${t.status}" onchange="updateStatusField('${t.id}', this)">
              <option value="Open" ${t.status === 'Open' ? 'selected' : ''}>Open</option>
              <option value="Progress" ${t.status === 'Progress' ? 'selected' : ''}>Progress</option>
              <option value="Closed" ${t.status === 'Closed' ? 'selected' : ''}>Closed</option>
            </select>
          </label>

          <!-- Kolom E: Update (Do) -->
          <label>Update (DO): 
            <input type="text" value="${t.updateDo}" onchange="updateField('${t.id}', 'updateDo', this.value)">
          </label>

          <!-- Kolom G: % Status -->
          <label>% Status: 
            <select onchange="updateField('${t.id}', 'percentStatus', this.value)">
              ${percentOptions}
            </select>
          </label>
        </div>
        <div>
          <!-- Kolom H: Update (Action) -->
          <label style="font-size:13px; font-weight:600; color:#605e5c; display:flex; flex-direction:column; gap:3px;">
            Update (Action):
            <input type="text" value="${t.updateAction}" onchange="updateField('${t.id}', 'updateAction', this.value)" style="width:100%; padding:6px 8px;">
          </label>
        </div>
      `;
      list.appendChild(li);
    });
  }

  async function addTask() {
    const taskInput = document.getElementById("taskInput");
    const picInput = document.getElementById("picInput");
    const updateDoInput = document.getElementById("updateDoInput");
    const statusInput = document.getElementById("statusInput");
    const percentInput = document.getElementById("percentInput");
    const updateActionInput = document.getElementById("updateActionInput");

    const taskText = taskInput.value.trim();
    if (!taskText) return;

    await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: new URLSearchParams({
        action: "add",
        task: taskText,
        pic: picInput.value.trim() || "-",
        updateDo: updateDoInput.value.trim(),
        status: statusInput.value,
        percentStatus: percentInput.value,
        updateAction: updateActionInput.value.trim()
      })
    });

    // Reset Form Input
    taskInput.value = "";
    picInput.value = "";
    updateDoInput.value = "";
    updateActionInput.value = "";
    statusInput.value = "Open";
    percentInput.value = "0%";

    loadTasks();
  }

  async function updateField(id, fieldName, value) {
    let payload = { action: "update", id: id };
    payload[fieldName] = value;

    await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: new URLSearchParams(payload)
    });
  }

  async function updateStatusField(id, selectElement) {
    const newStatus = selectElement.value;
    selectElement.className = "status-select status-" + newStatus;
    await updateField(id, 'status', newStatus);
    loadTasks();
  }

  async function deleteTask(id) {
    if (!confirm("Yakin ingin menghapus tugas ini?")) return;

    await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: new URLSearchParams({ action: "delete", id: id })
    });
    loadTasks();
  }

  function handleKeyPress(e) {
    if (e.key === "Enter") addTask();
  }

  loadTasks();
</script>

</body>
</html>
