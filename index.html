<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DAFTAR TUGAS - Asset & System</title>
  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f3f2f1;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .container {
      width: 100%;
      max-width: 700px;
      height: 100%;
      max-height: 100vh;
      background: white;
      padding: 16px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    
    /* Header & Tombol Aksi */
    .header-action-area {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      flex-shrink: 0;
      gap: 8px;
    }
    h2 { 
      color: #2564cf; 
      margin: 0; 
      font-size: 19px;
    }
    .button-group {
      display: flex;
      gap: 6px;
    }
    .btn-action-base {
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
      white-space: nowrap;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .btn-open-add {
      background-color: #2564cf;
      color: white;
    }
    .btn-open-add:hover { background-color: #1151b5; }

    .btn-refresh {
      background-color: #f3f2f1;
      color: #323130;
      border: 1px solid #c8c6c4;
    }
    .btn-refresh:hover { background-color: #e1dfdd; }

    /* Filter Combobox Area */
    .filter-box {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
      padding-bottom: 10px;
      border-bottom: 1px solid #eee;
      flex-shrink: 0;
    }
    .filter-box label {
      font-size: 11px;
      font-weight: bold;
      color: #605e5c;
      display: flex;
      flex-direction: column;
      gap: 3px;
      flex: 1;
    }
    .filter-box select {
      width: 100%;
      padding: 7px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 13px;
      outline: none;
      background: #fff;
    }

    /* Area List Tugas dengan Scroll Khusus */
    .task-scroll-area {
      flex: 1;
      overflow-y: auto;
      padding-right: 2px;
      -webkit-overflow-scrolling: touch;
    }
    ul { list-style: none; padding: 0; margin: 0; }
    
    li.task-item {
      background: #fff;
      padding: 10px 14px;
      border: 1px solid #e1dfdd;
      border-radius: 6px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }
    li.task-item:hover {
      background: #f8f9fa;
      border-color: #2564cf;
    }
    .task-preview-info {
      display: flex;
      flex-direction: column;
      gap: 3px;
      overflow: hidden;
      flex: 1;
      padding-right: 10px;
    }
    .task-plan-text {
      font-weight: 600;
      color: #323130;
      font-size: 14px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .task-meta-preview {
      font-size: 11px;
      color: #605e5c;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .badge-status {
      padding: 3px 8px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
    }
    .status-Open { background-color: #eff6fc; color: #0078d4; }
    .status-Progress { background-color: #fff4ce; color: #8a6d00; }
    .status-Closed { background-color: #dff6dd; color: #107c41; }

    /* Modal / Pop-up Umum */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 12px;
      box-sizing: border-box;
    }
    .modal-content {
      background: white;
      width: 100%;
      max-width: 550px;
      padding: 18px;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #eee;
      padding-bottom: 6px;
    }
    .modal-header h3 { margin: 0; color: #2564cf; font-size: 17px; }
    .btn-close-modal {
      background: transparent;
      border: none;
      font-size: 20px;
      cursor: pointer;
      color: #605e5c;
      line-height: 1;
    }
    .modal-body {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .modal-body label {
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-size: 12px;
      font-weight: 600;
      color: #605e5c;
    }
    .modal-body input, .modal-body select, .modal-body textarea {
      padding: 7px 9px;
      font-size: 13px;
      font-family: inherit;
      border: 1px solid #ccc;
      border-radius: 4px;
      outline: none;
      width: 100%;
    }
    .modal-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid #eee;
      padding-top: 10px;
    }
    .btn-delete {
      background: transparent;
      color: #a80000;
      border: none;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
    }
    .btn-delete:hover { text-decoration: underline; }
    .btn-save {
      background-color: #107c41;
      color: white;
      border: none;
      padding: 7px 14px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
      font-size: 13px;
    }
    .btn-save:hover { background-color: #0b5a2f; }

    @media (max-width: 480px) {
      .container {
        padding: 10px;
        border-radius: 0;
      }
      h2 {
        font-size: 17px;
      }
      .filter-box {
        flex-direction: column;
        gap: 6px;
      }
      .button-group {
        gap: 4px;
      }
      .btn-action-base {
        padding: 7px 10px;
        font-size: 12px;
      }
    }
  </style>
</head>
<body>

<div class="container">
  <div class="header-action-area">
    <h2>Daftar Tugas</h2>
    <div class="button-group">
      <button class="btn-action-base btn-refresh" onclick="loadTasks()" title="Muat Ulang Data">🔄 Refresh</button>
      <button class="btn-action-base btn-open-add" onclick="openAddModal()">+ Tambah</button>
    </div>
  </div>

  <div class="filter-box">
    <label>
      Filter PIC:
      <select id="filterPic" onchange="renderTasks()">
        <option value="ALL">Semua PIC</option>
      </select>
    </label>
    <label>
      Filter Status:
      <select id="filterStatus" onchange="renderTasks()">
        <option value="ALL">Semua Status</option>
        <option value="Open">Open</option>
        <option value="Progress">Progress</option>
        <option value="Closed">Closed</option>
      </select>
    </label>
  </div>

  <div class="task-scroll-area">
    <ul id="taskList">
      <li>Memuat data...</li>
    </ul>
  </div>
</div>

<datalist id="picListOptions"></datalist>

<!-- Pop-up Modal: Tambah Tugas Baru -->
<div class="modal-overlay" id="addModal">
  <div class="modal-content">
    <div class="modal-header">
      <h3>Tambah Tugas Baru</h3>
      <button class="btn-close-modal" onclick="closeAddModal()">&times;</button>
    </div>
    <div class="modal-body">
      <label>
        Tugas Saya (Plan):
        <input type="text" id="taskInput" placeholder="Nama tugas..." onkeypress="handleAddKeyPress(event)">
      </label>
      <label>
        PIC:
        <input type="text" id="picInput" placeholder="Nama PIC" list="picListOptions">
      </label>
      <label>
        Update Rencana Awalan (Do):
        <input type="text" id="updateDoInput" placeholder="Rencana awal...">
      </label>
      <label>
        Status (Check):
        <select id="statusInput">
          <option value="Open">Open</option>
          <option value="Progress">Progress</option>
          <option value="Closed">Closed</option>
        </select>
      </label>
      <label>
        % Status:
        <select id="percentInput" onchange="handlePercentChange('add')">
          <option value="0%">0%</option>
          <option value="10%">10%</option>
          <option value="20%">20%</option>
          <option value="30%">30%</option>
          <option value="40%">40%</option>
          <option value="50%">50%</option>
          <option value="60%">60%</option>
          <option value="70%">70%</option>
          <option value="80%">80%</option>
          <option value="90%">90%</option>
          <option value="100%">100%</option>
        </select>
      </label>
      <label>
        Update Tindakan Terakhir (Action):
        <textarea id="updateActionInput" rows="3" placeholder="Tindakan terakhir..."></textarea>
      </label>
    </div>
    <div class="modal-footer">
      <button onclick="closeAddModal()" style="font-size: 13px; padding: 7px 10px; background: #f3f2f1; border: 1px solid #ccc; border-radius: 4px; cursor: pointer;">Batal</button>
      <button class="btn-save" onclick="addTask()">Simpan Tugas Baru</button>
    </div>
  </div>
</div>

<!-- Pop-up Modal: Detail & Edit Tugas -->
<div class="modal-overlay" id="taskModal">
  <div class="modal-content">
    <div class="modal-header">
      <h3 id="modalTitleID">Detail Tugas</h3>
      <button class="btn-close-modal" onclick="closeModal()">&times;</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="modalTaskId">
      <label>
        Tgl Dibuat (Locked):
        <input type="text" id="modalCreatedAt" readonly style="background-color: #f3f2f1; color: #605e5c;">
      </label>
      <label>
        Tugas Saya (Plan):
        <input type="text" id="modalTaskText">
      </label>
      <label>
        PIC:
        <input type="text" id="modalPicText" list="picListOptions">
      </label>
      <label>
        Update Rencana Awalan (Do):
        <input type="text" id="modalUpdateDoText">
      </label>
      <label>
        Status (Check):
        <select id="modalStatusSelect">
          <option value="Open">Open</option>
          <option value="Progress">Progress</option>
          <option value="Closed">Closed</option>
        </select>
      </label>
      <label>
        % Status:
        <select id="modalPercentSelect" onchange="handlePercentChange('edit')">
          <option value="0%">0%</option>
          <option value="10%">10%</option>
          <option value="20%">20%</option>
          <option value="30%">30%</option>
          <option value="40%">40%</option>
          <option value="50%">50%</option>
          <option value="60%">60%</option>
          <option value="70%">70%</option>
          <option value="80%">80%</option>
          <option value="90%">90%</option>
          <option value="100%">100%</option>
        </select>
      </label>
      <label>
        Update Tindakan Terakhir (Action):
        <textarea id="modalUpdateActionText" rows="3"></textarea>
      </label>
    </div>
    <div class="modal-footer">
      <button class="btn-delete" onclick="deleteTaskFromModal()">Hapus Tugas</button>
      <div style="display: flex; gap: 8px;">
        <button onclick="closeModal()" style="font-size: 13px; padding: 7px 10px; background: #f3f2f1; border: 1px solid #ccc; border-radius: 4px; cursor: pointer;">Batal</button>
        <button class="btn-save" onclick="saveTaskDetails()">Simpan Perubahan</button>
      </div>
    </div>
  </div>
</div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbwLRzs3VwEXW3QwPSBeHd70l7uys8Y-SlZ_Hfj36ikhriFniRlSKtnQU9aJDdPcpb0W/exec";

  let allTasks = [];

  async function loadTasks() {
    try {
      document.getElementById("taskList").innerHTML = "<li style='padding:15px; text-align:center; color:#8a8886;'>Memuat data terbaru...</li>";
      const response = await fetch(API_URL);
      allTasks = await response.json();
      updatePicOptions();
      renderTasks();
    } catch (err) {
      document.getElementById("taskList").innerHTML = "<li style='padding:15px; text-align:center; color:#a80000;'>Gagal memuat tugas.</li>";
    }
  }

  function updatePicOptions() {
    const filterPicSelect = document.getElementById("filterPic");
    const currentFilterValue = filterPicSelect.value;
    const datalist = document.getElementById("picListOptions");
    
    const pics = [...new Set(allTasks.map(t => t.pic).filter(p => p && p !== "-"))];

    filterPicSelect.innerHTML = `<option value="ALL">Semua PIC</option>`;
    pics.forEach(pic => {
      const opt = document.createElement("option");
      opt.value = pic;
      opt.textContent = pic;
      filterPicSelect.appendChild(opt);
    });
    filterPicSelect.value = currentFilterValue;

    datalist.innerHTML = "";
    pics.forEach(pic => {
      const opt = document.createElement("option");
      opt.value = pic;
      datalist.appendChild(opt);
    });
  }

  function renderTasks() {
    const list = document.getElementById("taskList");
    const selectedPic = document.getElementById("filterPic").value;
    const selectedStatus = document.getElementById("filterStatus").value;

    list.innerHTML = "";

    const filtered = allTasks.filter(t => {
      const matchPic = (selectedPic === "ALL") || (t.pic === selectedPic);
      const matchStatus = (selectedStatus === "ALL") || (t.status === selectedStatus);
      return matchPic && matchStatus;
    });

    if (filtered.length === 0) {
      list.innerHTML = "<li style='text-align:center; color:#8a8886; display:block; padding:15px;'>Tidak ada tugas yang sesuai.</li>";
      return;
    }

    const reversedFiltered = filtered.slice().reverse();

    reversedFiltered.forEach(t => {
      const li = document.createElement("li");
      li.className = "task-item";
      li.onclick = () => openModal(t);

      li.innerHTML = `
        <div class="task-preview-info">
          <span class="task-plan-text">${t.task || "(Tanpa Nama Tugas)"}</span>
          <div class="task-meta-preview">
            <span><b>PIC:</b> ${t.pic || "-"}</span>
            <span>•</span>
            <span><b>% Status:</b> ${t.percentStatus || "0%"}</span>
          </div>
        </div>
        <div>
          <span class="badge-status status-${t.status}">${t.status}</span>
        </div>
      `;
      list.appendChild(li);
    });
  }

  // Logika Otomatis Status berdasarkan % Status
  function handlePercentChange(mode) {
    let percentVal, statusSelect;
    if (mode === 'add') {
      percentVal = document.getElementById("percentInput").value;
      statusSelect = document.getElementById("statusInput");
    } else {
      percentVal = document.getElementById("modalPercentSelect").value;
      statusSelect = document.getElementById("modalStatusSelect");
    }

    // Ubah angka persen string "20%" menjadi integer 20
    const num = parseInt(percentVal);

    if (num >= 10 && num <= 90) {
      statusSelect.value = "Progress";
    } else if (num === 100) {
      statusSelect.value = "Closed";
    } else if (num === 0) {
      statusSelect.value = "Open";
    }
  }

  function openAddModal() {
    document.getElementById("addModal").style.display = "flex";
  }
  function closeAddModal() {
    document.getElementById("addModal").style.display = "none";
  }

  function openModal(task) {
    document.getElementById("modalTaskId").value = task.id;
    document.getElementById("modalTitleID").textContent = `Detail Tugas (${task.id})`;
    document.getElementById("modalCreatedAt").value = task.createdAt || "-";
    document.getElementById("modalTaskText").value = task.task || "";
    document.getElementById("modalPicText").value = task.pic || "";
    document.getElementById("modalUpdateDoText").value = task.updateDo || "";
    document.getElementById("modalStatusSelect").value = task.status || "Open";
    document.getElementById("modalPercentSelect").value = task.percentStatus || "0%";
    document.getElementById("modalUpdateActionText").value = task.updateAction || "";

    document.getElementById("taskModal").style.display = "flex";
  }
  function closeModal() {
    document.getElementById("taskModal").style.display = "none";
  }

  async function saveTaskDetails() {
    const id = document.getElementById("modalTaskId").value;
    const task = document.getElementById("modalTaskText").value.trim();
    const pic = document.getElementById("modalPicText").value.trim();
    const updateDo = document.getElementById("modalUpdateDoText").value.trim();
    const status = document.getElementById("modalStatusSelect").value;
    const percentStatus = document.getElementById("modalPercentSelect").value;
    const updateAction = document.getElementById("modalUpdateActionText").value.trim();

    if (!task) {
      alert("Nama tugas (Plan) tidak boleh kosong!");
      return;
    }

    await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: new URLSearchParams({
        action: "update",
        id: id,
        task: task,
        pic: pic,
        updateDo: updateDo,
        status: status,
        percentStatus: percentStatus,
        updateAction: updateAction
      })
    });

    closeModal();
    loadTasks();
  }

  async function addTask() {
    const taskInput = document.getElementById("taskInput");
    const picInput = document.getElementById("picInput");
    const updateDoInput = document.getElementById("updateDoInput");
    const statusInput = document.getElementById("statusInput");
    const percentInput = document.getElementById("percentInput");
    const updateActionInput = document.getElementById("updateActionInput");

    const taskText = taskInput.value.trim();
    if (!taskText) {
      alert("Silakan isi nama tugas terlebih dahulu!");
      return;
    }

    await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: new URLSearchParams({
        action: "add",
        task: taskText,
        pic: picInput.value.trim() || "-",
        updateDo: updateDoInput.value.trim(),
        status: statusInput.value,
        percentStatus: percentInput.value,
        updateAction: updateActionInput.value.trim()
      })
    });

    taskInput.value = "";
    picInput.value = "";
    updateDoInput.value = "";
    updateActionInput.value = "";
    statusInput.value = "Open";
    percentInput.value = "0%";

    closeAddModal();
    loadTasks();
  }

  async function deleteTaskFromModal() {
    const id = document.getElementById("modalTaskId").value;
    if (!confirm("Yakin ingin menghapus tugas ini?")) return;

    await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: new URLSearchParams({ action: "delete", id: id })
    });

    closeModal();
    loadTasks();
  }

  function handleAddKeyPress(e) {
    if (e.key === "Enter") addTask();
  }

  loadTasks();
</script>

</body>
</html>
