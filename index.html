<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DAFTAR TUGAS - Asset & System </title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f3f2f1;
      display: flex;
      justify-content: center;
      padding: 30px 15px;
      margin: 0;
    }
    .container {
      width: 100%;
      max-width: 700px;
      background: white;
      padding: 24px;
      border-radius: 10px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
    }
    h2 { color: #2564cf; margin-top: 0; margin-bottom: 20px; }
    
    /* Input Form Area */
    .input-form {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
      background: #fafafa;
      padding: 15px;
      border-radius: 6px;
      border: 1px solid #eaeaea;
    }
    .input-row {
      display: flex;
      gap: 10px;
    }
    input[type="text"], select {
      padding: 9px 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
      outline: none;
      font-size: 14px;
      font-family: inherit;
    }
    .input-row input[type="text"] { flex: 1; }
    .input-row select { width: 130px; }
    
    button.btn-add {
      padding: 10px 18px;
      background-color: #2564cf;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
    }
    button.btn-add:hover { background-color: #1151b5; }

    /* Filter Combobox Area */
    .filter-box {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      padding-bottom: 15px;
      border-bottom: 1px solid #eee;
    }
    .filter-box label {
      font-size: 12px;
      font-weight: bold;
      color: #605e5c;
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
    }

    /* Task List Table/List Style */
    ul { list-style: none; padding: 0; margin: 0; }
    li.task-item {
      background: #fff;
      padding: 12px 16px;
      border: 1px solid #e1dfdd;
      border-radius: 6px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s;
    }
    li.task-item:hover {
      background: #f8f9fa;
      border-color: #2564cf;
    }
    .task-preview-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
      overflow: hidden;
    }
    .task-plan-text {
      font-weight: 600;
      color: #323130;
      font-size: 15px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .task-meta-preview {
      font-size: 12px;
      color: #605e5c;
      display: flex;
      gap: 10px;
    }
    .badge-status {
      padding: 2px 8px;
      border-radius: 10px;
      font-size: 11px;
      font-weight: 600;
    }
    .status-Open { background-color: #eff6fc; color: #0078d4; }
    .status-Progress { background-color: #fff4ce; color: #8a6d00; }
    .status-Closed { background-color: #dff6dd; color: #107c41; }

    /* Modal / Pop-up Detail */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 15px;
      box-sizing: border-box;
    }
    .modal-content {
      background: white;
      width: 100%;
      max-width: 550px;
      padding: 24px;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
      display: flex;
      flex-direction: column;
      gap: 15px;
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #eee;
      padding-bottom: 10px;
    }
    .modal-header h3 { margin: 0; color: #2564cf; }
    .btn-close {
      background: transparent;
      border: none;
      font-size: 18px;
      cursor: pointer;
      color: #605e5c;
    }
    .modal-body {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .modal-body label {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 13px;
      font-weight: 600;
      color: #605e5c;
    }
    .modal-body input, .modal-body select, .modal-body textarea {
      padding: 8px 10px;
      font-size: 14px;
      font-family: inherit;
      border: 1px solid #ccc;
      border-radius: 4px;
      outline: none;
    }
    .modal-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid #eee;
      padding-top: 15px;
    }
    .btn-delete {
      background: transparent;
      color: #a80000;
      border: none;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
    }
    .btn-delete:hover { text-decoration: underline; }
    .btn-save {
      background-color: #107c41;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
    }
    .btn-save:hover { background-color: #0b5a2f; }
  </style>
</head>
<body>

<div class="container">
  <h2>Daftar Tugas - Asset & System</h2>

  <!-- Input Form -->
  <div class="input-form">
    <div class="input-row">
      <input type="text" id="taskInput" placeholder="Tugas Saya (Plan)..." onkeypress="handleKeyPress(event)">
      <input type="text" id="picInput" placeholder="PIC">
    </div>
    <div class="input-row">
      <input type="text" id="updateDoInput" placeholder="Update Rencana Awalan (Do)...">
      <select id="statusInput" class="status-Open" onchange="this.className='status-'+this.value">
        <option value="Open">Open</option>
        <option value="Progress">Progress</option>
        <option value="Closed">Closed</option>
      </select>
      <select id="percentInput">
        <option value="0%">0%</option>
        <option value="10%">10%</option>
        <option value="20%">20%</option>
        <option value="30%">30%</option>
        <option value="40%">40%</option>
        <option value="50%">50%</option>
        <option value="60%">60%</option>
        <option value="70%">70%</option>
        <option value="80%">80%</option>
        <option value="90%">90%</option>
        <option value="100%">100%</option>
      </select>
    </div>
    <div class="input-row">
      <input type="text" id="updateActionInput" placeholder="Update Tindakan Terakhir (Action)...">
      <button class="btn-add" onclick="addTask()">Tambah Tugas</button>
    </div>
  </div>

  <!-- Combobox Filter -->
  <div class="filter-box">
    <label>
      Filter PIC:
      <select id="filterPic" onchange="renderTasks()">
        <option value="ALL">Semua PIC</option>
      </select>
    </label>
    <label>
      Filter Status:
      <select id="filterStatus" onchange="renderTasks()">
        <option value="ALL">Semua Status</option>
        <option value="Open">Open</option>
        <option value="Progress">Progress</option>
        <option value="Closed">Closed</option>
      </select>
    </label>
  </div>

  <!-- Daftar Ringkas Tugas -->
  <ul id="taskList">
    <li>Memuat data...</li>
  </ul>
</div>

<!-- Modal / Pop-up Detail Tugas -->
<div class="modal-overlay" id="taskModal">
  <div class="modal-content">
    <div class="modal-header">
      <h3 id="modalTitleID">Detail Tugas</h3>
      <button class="btn-close" onclick="closeModal()">&times;</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="modalTaskId">
      <label>
        Tgl Dibuat (Locked):
        <input type="text" id="modalCreatedAt" readonly style="background-color: #f3f2f1; color: #605e5c;">
      </label>
      <label>
        Tugas Saya (Plan):
        <input type="text" id="modalTaskText">
      </label>
      <label>
        PIC:
        <input type="text" id="modalPicText">
      </label>
      <label>
        Update Rencana Awalan (Do):
        <input type="text" id="modalUpdateDoText">
      </label>
      <label>
        Status (Check):
        <select id="modalStatusSelect">
          <option value="Open">Open</option>
          <option value="Progress">Progress</option>
          <option value="Closed">Closed</option>
        </select>
      </label>
      <label>
        % Status:
        <select id="modalPercentSelect">
          <option value="0%">0%</option>
          <option value="10%">10%</option>
          <option value="20%">20%</option>
          <option value="30%">30%</option>
          <option value="40%">40%</option>
          <option value="50%">50%</option>
          <option value="60%">60%</option>
          <option value="70%">70%</option>
          <option value="80%">80%</option>
          <option value="90%">90%</option>
          <option value="100%">100%</option>
        </select>
      </label>
      <label>
        Update Tindakan Terakhir (Action):
        <textarea id="modalUpdateActionText" rows="3"></textarea>
      </label>
    </div>
    <div class="modal-footer">
      <button class="btn-delete" onclick="deleteTaskFromModal()">Hapus Tugas</button>
      <div style="display: flex; gap: 10px;">
        <button class="btn-close" style="font-size: 14px; padding: 8px 12px; background: #f3f2f1; border-radius: 4px;" onclick="closeModal()">Batal</button>
        <button class="btn-save" onclick="saveTaskDetails()">Simpan Perubahan</button>
      </div>
    </div>
  </div>
</div>

<script>
  // GANTI DENGAN URL WEB APP GOOGLE APPS SCRIPT ANDA
  const API_URL = "https://script.google.com/macros/s/AKfycbwLRzs3VwEXW3QwPSBeHd70l7uys8Y-SlZ_Hfj36ikhriFniRlSKtnQU9aJDdPcpb0W/exec";

  let allTasks = [];

  async function loadTasks() {
    try {
      const response = await fetch(API_URL);
      allTasks = await response.json();
      updatePicFilterOptions();
      renderTasks();
    } catch (err) {
      document.getElementById("taskList").innerHTML = "<li>Gagal memuat tugas.</li>";
    }
  }

  function updatePicFilterOptions() {
    const filterPicSelect = document.getElementById("filterPic");
    const currentValue = filterPicSelect.value;
    
    const pics = [...new Set(allTasks.map(t => t.pic).filter(p => p))];

    filterPicSelect.innerHTML = `<option value="ALL">Semua PIC</option>`;
    pics.forEach(pic => {
      const opt = document.createElement("option");
      opt.value = pic;
      opt.textContent = pic;
      filterPicSelect.appendChild(opt);
    });

    filterPicSelect.value = currentValue;
  }

  function renderTasks() {
    const list = document.getElementById("taskList");
    const selectedPic = document.getElementById("filterPic").value;
    const selectedStatus = document.getElementById("filterStatus").value;

    list.innerHTML = "";

    const filtered = allTasks.filter(t => {
      const matchPic = (selectedPic === "ALL") || (t.pic === selectedPic);
      const matchStatus = (selectedStatus === "ALL") || (t.status === selectedStatus);
      return matchPic && matchStatus;
    });

    if (filtered.length === 0) {
      list.innerHTML = "<li style='text-align:center; color:#8a8886; display:block; padding:15px;'>Tidak ada tugas yang sesuai.</li>";
      return;
    }

    // Tugas terbaru otomatis muncul di paling atas
    const reversedFiltered = filtered.slice().reverse();

    reversedFiltered.forEach(t => {
      const li = document.createElement("li");
      li.className = "task-item";
      li.onclick = () => openModal(t);

      li.innerHTML = `
        <div class="task-preview-info">
          <span class="task-plan-text">${t.task || "(Tanpa Nama Tugas)"}</span>
          <div class="task-meta-preview">
            <span><b>PIC:</b> ${t.pic || "-"}</span>
            <span>•</span>
            <span><b>% Status:</b> ${t.percentStatus || "0%"}</span>
          </div>
        </div>
        <div>
          <span class="badge-status status-${t.status}">${t.status}</span>
        </div>
      `;
      list.appendChild(li);
    });
  }

  // Membuka Pop-up Detail
  function openModal(task) {
    document.getElementById("modalTaskId").value = task.id;
    document.getElementById("modalTitleID").textContent = `Detail Tugas (${task.id})`;
    document.getElementById("modalCreatedAt").value = task.createdAt || "-";
    document.getElementById("modalTaskText").value = task.task || "";
    document.getElementById("modalPicText").value = task.pic || "";
    document.getElementById("modalUpdateDoText").value = task.updateDo || "";
    document.getElementById("modalStatusSelect").value = task.status || "Open";
    document.getElementById("modalPercentSelect").value = task.percentStatus || "0%";
    document.getElementById("modalUpdateActionText").value = task.updateAction || "";

    document.getElementById("taskModal").style.display = "flex";
  }

  // Menutup Pop-up Detail
  function closeModal() {
    document.getElementById("taskModal").style.display = "none";
  }

  // Simpan Perubahan dari Modal
  async function saveTaskDetails() {
    const id = document.getElementById("modalTaskId").value;
    const task = document.getElementById("modalTaskText").value.trim();
    const pic = document.getElementById("modalPicText").value.trim();
    const updateDo = document.getElementById("modalUpdateDoText").value.trim();
    const status = document.getElementById("modalStatusSelect").value;
    const percentStatus = document.getElementById("modalPercentSelect").value;
    const updateAction = document.getElementById("modalUpdateActionText").value.trim();

    if (!task) {
      alert("Nama tugas (Plan) tidak boleh kosong!");
      return;
    }

    await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: new URLSearchParams({
        action: "update",
        id: id,
        task: task,
        pic: pic,
        updateDo: updateDo,
        status: status,
        percentStatus: percentStatus,
        updateAction: updateAction
      })
    });

    closeModal();
    loadTasks();
  }

  // Tambah Tugas Baru
  async function addTask() {
    const taskInput = document.getElementById("taskInput");
    const picInput = document.getElementById("picInput");
    const updateDoInput = document.getElementById("updateDoInput");
    const statusInput = document.getElementById("statusInput");
    const percentInput = document.getElementById("percentInput");
    const updateActionInput = document.getElementById("updateActionInput");

    const taskText = taskInput.value.trim();
    if (!taskText) {
      alert("Silakan isi nama tugas terlebih dahulu!");
      return;
    }

    await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: new URLSearchParams({
        action: "add",
        task: taskText,
        pic: picInput.value.trim() || "-",
        updateDo: updateDoInput.value.trim(),
        status: statusInput.value,
        percentStatus: percentInput.value,
        updateAction: updateActionInput.value.trim()
      })
    });

    // Reset Form Input
    taskInput.value = "";
    picInput.value = "";
    updateDoInput.value = "";
    updateActionInput.value = "";
    statusInput.value = "Open";
    statusInput.className = "status-Open";
    percentInput.value = "0%";

    loadTasks();
  }

  // Hapus Tugas dari dalam Modal
  async function deleteTaskFromModal() {
    const id = document.getElementById("modalTaskId").value;
    if (!confirm("Yakin ingin menghapus tugas ini?")) return;

    await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: new URLSearchParams({ action: "delete", id: id })
    });

    closeModal();
    loadTasks();
  }

  function handleKeyPress(e) {
    if (e.key === "Enter") addTask();
  }

  loadTasks();
</script>

</body>
</html>
