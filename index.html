<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Microsoft To Do Clone</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f3f2f1;
      display: flex;
      justify-content: center;
      padding: 30px 15px;
    }
    .container {
      width: 100%;
      max-width: 650px;
      background: white;
      padding: 24px;
      border-radius: 10px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.1);
    }
    h2 { color: #2564cf; margin-top: 0; margin-bottom: 20px; }
    
    /* Input Form Area */
    .input-form {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 20px;
      background: #fafafa;
      padding: 15px;
      border-radius: 6px;
      border: 1px solid #eaeaea;
    }
    .input-row {
      display: flex;
      gap: 10px;
    }
    input[type="text"], select {
      padding: 9px 12px;
      border: 1px solid #ccc;
      border-radius: 4px;
      outline: none;
      font-size: 14px;
    }
    .input-row input[type="text"] { flex: 2; }
    .input-row select, .input-row .pic-input { flex: 1; }
    
    button.btn-add {
      padding: 10px 18px;
      background-color: #2564cf;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
    }
    button.btn-add:hover { background-color: #1151b5; }

    /* Filter Combobox Area */
    .filter-box {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
      padding-bottom: 15px;
      border-bottom: 1px solid #eee;
    }
    .filter-box label {
      font-size: 12px;
      font-weight: bold;
      color: #605e5c;
      display: flex;
      flex-direction: column;
      gap: 4px;
      flex: 1;
    }

    /* Task List Items */
    ul { list-style: none; padding: 0; margin: 0; }
    li {
      background: #fff;
      padding: 12px 14px;
      border: 1px solid #e1dfdd;
      border-radius: 6px;
      margin-bottom: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .task-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .task-title {
      font-weight: 600;
      color: #323130;
      font-size: 15px;
      border: 1px transparent solid;
      padding: 2px 4px;
      border-radius: 3px;
    }
    .task-title:hover {
      border-color: #ccc;
      background: #f9f9f9;
    }
    .task-details {
      display: flex;
      gap: 10px;
      align-items: center;
      font-size: 13px;
    }
    .badge-id {
      font-size: 11px;
      color: #8a8886;
      background: #f3f2f1;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .btn-delete {
      background: transparent;
      color: #a80000;
      border: none;
      cursor: pointer;
      font-size: 12px;
    }
    .btn-delete:hover { text-decoration: underline; }

    /* Status Badge Colors */
    select.status-select {
      font-weight: 600;
      border-radius: 12px;
      padding: 3px 8px;
    }
    select.status-Open { background-color: #eff6fc; color: #0078d4; border-color: #c7e0f4; }
    select.status-Progress { background-color: #fff4ce; color: #797775; border-color: #fed9cc; }
    select.status-Closed { background-color: #dff6dd; color: #107c41; border-color: #92c353; }
  </style>
</head>
<body>

<div class="container">
  <h2>Tugasku (To Do)</h2>

  <!-- Input Form -->
  <div class="input-form">
    <div class="input-row">
      <input type="text" id="taskInput" placeholder="Nama tugas..." onkeypress="handleKeyPress(event)">
      <input type="text" id="picInput" class="pic-input" placeholder="PIC (Penanggung Jawab)">
    </div>
    <div class="input-row">
      <select id="statusInput">
        <option value="Open">Open</option>
        <option value="Progress">Progress</option>
        <option value="Closed">Closed</option>
      </select>
      <button class="btn-add" onclick="addTask()">Tambah Tugas</button>
    </div>
  </div>

  <!-- Combobox Filter -->
  <div class="filter-box">
    <label>
      Filter PIC:
      <select id="filterPic" onchange="renderTasks()">
        <option value="ALL">Semua PIC</option>
      </select>
    </label>
    <label>
      Filter Status:
      <select id="filterStatus" onchange="renderTasks()">
        <option value="ALL">Semua Status</option>
        <option value="Open">Open</option>
        <option value="Progress">Progress</option>
        <option value="Closed">Closed</option>
      </select>
    </label>
  </div>

  <!-- Daftar Tugas -->
  <ul id="taskList">
    <li>Memuat data...</li>
  </ul>
</div>

<script>
  // GANTI DENGAN URL WEB APP GOOGLE APPS SCRIPT ANDA
  const API_URL = "https://script.google.com/macros/s/AKfycbwpkOahF1KiHgSDTxefXokUOqSEsFbuK7TokjWtKyj7CUXIlqU-l3fOZsQdc82lgkXO/exec";

  let allTasks = [];

  // Memuat data dari Apps Script
  async function loadTasks() {
    try {
      const response = await fetch(API_URL);
      allTasks = await response.json();
      updatePicFilterOptions();
      renderTasks();
    } catch (err) {
      document.getElementById("taskList").innerHTML = "<li>Gagal memuat tugas.</li>";
    }
  }

  // Mengisi opsi filter PIC secara dinamis berdasarkan data
  function updatePicFilterOptions() {
    const filterPicSelect = document.getElementById("filterPic");
    const currentValue = filterPicSelect.value;
    
    // Ambil daftar PIC unik
    const pics = [...new Set(allTasks.map(t => t.pic).filter(p => p))];

    filterPicSelect.innerHTML = `<option value="ALL">Semua PIC</option>`;
    pics.forEach(pic => {
      const opt = document.createElement("option");
      opt.value = pic;
      opt.textContent = pic;
      filterPicSelect.appendChild(opt);
    });

    filterPicSelect.value = currentValue;
  }

  // Menampilkan data sesuai filter
  function renderTasks() {
    const list = document.getElementById("taskList");
    const selectedPic = document.getElementById("filterPic").value;
    const selectedStatus = document.getElementById("filterStatus").value;

    list.innerHTML = "";

    // Filter data
    const filtered = allTasks.filter(t => {
      const matchPic = (selectedPic === "ALL") || (t.pic === selectedPic);
      const matchStatus = (selectedStatus === "ALL") || (t.status === selectedStatus);
      return matchPic && matchStatus;
    });

    if (filtered.length === 0) {
      list.innerHTML = "<li style='text-align:center; color:#8a8886;'>Tidak ada tugas yang sesuai.</li>";
      return;
    }

    filtered.forEach(t => {
      const li = document.createElement("li");

      li.innerHTML = `
        <div class="task-header">
          <span class="badge-id">${t.id}</span>
          <button class="btn-delete" onclick="deleteTask('${t.id}')">Hapus</button>
        </div>
        <div class="task-header">
          <!-- Editable Task Title -->
          <span class="task-title" contenteditable="true" onblur="updateTaskText('${t.id}', this)">${t.task}</span>
        </div>
        <div class="task-details">
          <!-- Editable PIC -->
          <label>PIC: <input type="text" value="${t.pic}" style="width:100px; padding:2px 5px;" onchange="updatePic('${t.id}', this.value)"></label>
          
          <!-- Editable Status -->
          <label>Status: 
            <select class="status-select status-${t.status}" onchange="updateStatus('${t.id}', this.value)">
              <option value="Open" ${t.status === 'Open' ? 'selected' : ''}>Open</option>
              <option value="Progress" ${t.status === 'Progress' ? 'selected' : ''}>Progress</option>
              <option value="Closed" ${t.status === 'Closed' ? 'selected' : ''}>Closed</option>
            </select>
          </label>
        </div>
      `;
      list.appendChild(li);
    });
  }

  // Tambah Tugas
  async function addTask() {
    const taskInput = document.getElementById("taskInput");
    const picInput = document.getElementById("picInput");
    const statusInput = document.getElementById("statusInput");

    const taskText = taskInput.value.trim();
    const picText = picInput.value.trim() || "Unassigned";
    const statusText = statusInput.value;

    if (!taskText) return;

    taskInput.value = "";
    picInput.value = "";

    await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: new URLSearchParams({
        action: "add",
        task: taskText,
        pic: picText,
        status: statusText
      })
    });

    loadTasks();
  }

  // Update Teks Tugas (saat selesai diedit/blur)
  async function updateTaskText(id, element) {
    const newText = element.innerText.trim();
    if (!newText) return;

    await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: new URLSearchParams({ action: "update", id: id, task: newText })
    });
  }

  // Update PIC
  async function updatePic(id, newPic) {
    await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: new URLSearchParams({ action: "update", id: id, pic: newPic })
    });
    loadTasks();
  }

  // Update Status
  async function updateStatus(id, newStatus) {
    await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: new URLSearchParams({ action: "update", id: id, status: newStatus })
    });
    loadTasks();
  }

  // Hapus Tugas
  async function deleteTask(id) {
    if (!confirm("Yakin ingin menghapus tugas ini?")) return;

    await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/x-www-form-urlencoded" },
      body: new URLSearchParams({ action: "delete", id: id })
    });
    loadTasks();
  }

  function handleKeyPress(e) {
    if (e.key === "Enter") addTask();
  }

  loadTasks();
</script>

</body>
</html>
