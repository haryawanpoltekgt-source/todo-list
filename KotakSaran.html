<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kotak Saran & Inovasi - Portal Asset & System</title>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#12161f">
  
  <style>
    :root {
      --bg-app: #12161f;
      --card-bg: #1c2230;
      --card-hover: #242c3d;
      --text-main: #f1f3f5;
      --text-secondary: #9099a2;
      --border-color: #2a3447;
      --accent-blue: #3b82f6;
      --accent-purple: #8b5cf6;
      --accent-cyan: #06b6d4;
      --accent-green: #22c55e;
      --accent-red: #ef4444;
      --accent-warn: #f59e0b;
    }

    * { 
      box-sizing: border-box; 
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    input, textarea, select {
      -webkit-user-select: text;
      -moz-user-select: text;
      -ms-user-select: text;
      user-select: text;
    }

    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-app);
      color: var(--text-main);
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .container {
      width: 100%;
      max-width: 700px;
      height: 100%;
      max-height: 100vh;
      background: var(--bg-app);
      padding: 16px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    #loadingOverlay {
      display: none;
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(18, 22, 31, 0.85);
      backdrop-filter: blur(5px);
      z-index: 2000;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      gap: 12px;
    }
    .spinner {
      width: 45px;
      height: 45px;
      border: 4px solid var(--border-color);
      border-top: 4px solid var(--accent-cyan);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .loading-text {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
    }

    .custom-alert-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(4px);
      z-index: 3000;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .custom-alert-box {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      width: 100%;
      max-width: 360px;
      border-radius: 14px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .alert-icon-wrapper {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      margin: 0 auto;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 22px;
    }
    .alert-icon-warning { background: rgba(245, 158, 11, 0.15); color: var(--accent-warn); border: 1px solid rgba(245, 158, 11, 0.3); }
    .alert-icon-success { background: rgba(34, 197, 94, 0.15); color: var(--accent-green); border: 1px solid rgba(34, 197, 94, 0.3); }
    .alert-icon-danger { background: rgba(239, 68, 68, 0.15); color: var(--accent-red); border: 1px solid rgba(239, 68, 68, 0.3); }
    .alert-icon-info { background: rgba(59, 130, 246, 0.15); color: var(--accent-blue); border: 1px solid rgba(59, 130, 246, 0.3); }
    
    .custom-alert-box h4 { margin: 0; font-size: 16px; color: #ffffff; font-weight: 700; }
    .custom-alert-box p { margin: 0; font-size: 13px; color: var(--text-secondary); line-height: 1.5; }
    
    .alert-actions { display: flex; gap: 8px; justify-content: center; }
    .btn-alert-ok {
      flex: 1;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
      color: white;
      border: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
    }
    .btn-alert-cancel {
      flex: 1; background: #2a3447; color: var(--text-main); border: 1px solid var(--border-color);
      padding: 10px; border-radius: 8px; font-weight: 600; font-size: 13px; cursor: pointer;
    }
    .btn-alert-danger-confirm {
      flex: 1; background: linear-gradient(135deg, #ef4444, #dc2626); color: white; border: none;
      padding: 10px; border-radius: 8px; font-weight: 600; font-size: 13px; cursor: pointer;
    }

    .back-nav {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--accent-cyan);
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
      margin-bottom: 8px;
      text-decoration: none;
      flex-shrink: 0;
    }
    .back-nav:hover { text-decoration: underline; }

    .header-action-area {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 10px;
      flex-shrink: 0;
    }
    .header-top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }
    .brand-wrapper h2 {
      color: #ffffff;
      margin: 0;
      font-size: 18px;
      font-weight: 700;
    }
    .sub-title { font-size: 11px; color: var(--text-secondary); }

    .btn-open-add {
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
      color: white;
      border: none;
      padding: 7px 12px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 12px;
      cursor: pointer;
      box-shadow: 0 3px 10px rgba(6, 182, 212, 0.3);
      display: flex;
      align-items: center;
      gap: 4px;
      white-space: nowrap;
    }
    .btn-open-add:hover { opacity: 0.9; }

    .search-input {
      width: 100%;
      padding: 7px 10px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 12px;
      outline: none;
      background: var(--card-bg);
      color: var(--text-main);
    }
    .search-input:focus { border-color: var(--accent-cyan); }

    .summary-area {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 7px 10px;
      margin-bottom: 10px;
      flex-shrink: 0;
    }
    .summary-title { font-size: 11px; font-weight: 700; color: var(--text-secondary); }
    .count-chip {
      font-size: 10.5px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 20px;
      background: rgba(6, 182, 212, 0.15);
      color: #22d3ee;
      border: 1px solid rgba(6, 182, 212, 0.3);
    }

    .scroll-area {
      flex: 1;
      overflow-y: auto;
      padding-right: 2px;
      -webkit-overflow-scrolling: touch;
    }
    ul { list-style: none; padding: 0; margin: 0; }

    li.kotak-item {
      background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-left: 4px solid var(--accent-cyan);
      border-radius: 10px;
      padding: 12px 14px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      transition: all 0.2s ease;
    }
    li.kotak-item:hover {
      background: var(--card-hover);
      border-color: var(--accent-cyan);
      transform: translateY(-2px);
    }

    .item-left {
      display: flex;
      flex-direction: column;
      gap: 4px;
      overflow: hidden;
      flex: 1;
      padding-right: 10px;
    }
    .item-title {
      font-size: 13.5px;
      font-weight: 700;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .item-meta {
      font-size: 11px;
      color: var(--text-secondary);
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    .badge-pelapor {
      background: rgba(59, 130, 246, 0.15);
      color: #60a5fa;
      border: 1px solid rgba(59, 130, 246, 0.3);
      padding: 2px 8px;
      border-radius: 5px;
      font-size: 11px;
      font-weight: 600;
    }
    .badge-bagian {
      background: rgba(139, 92, 246, 0.15);
      color: #a78bfa;
      border: 1px solid rgba(139, 92, 246, 0.3);
      padding: 2px 8px;
      border-radius: 5px;
      font-size: 11px;
      font-weight: 600;
    }

    /* Modal Styles */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(4px);
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 12px;
    }
    .modal-content {
      background: var(--card-bg);
      color: var(--text-main);
      width: 100%;
      max-width: 450px;
      padding: 18px;
      border-radius: 12px;
      border: 1px solid var(--border-color);
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 8px;
    }
    .modal-header h3 { margin: 0; color: #ffffff; font-size: 16px; }
    .btn-close-modal { background: transparent; border: none; font-size: 20px; cursor: pointer; color: var(--text-secondary); }
    .modal-body { display: flex; flex-direction: column; gap: 8px; }
    .modal-body label { display: flex; flex-direction: column; gap: 3px; font-size: 11.5px; font-weight: 600; color: var(--text-secondary); }
    .modal-body input, .modal-body textarea, .modal-body select {
      padding: 8px 10px;
      font-size: 12.5px;
      font-family: inherit;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      outline: none;
      background: #161b26;
      color: var(--text-main);
      width: 100%;
    }
    .modal-body input:focus, .modal-body textarea:focus { border-color: var(--accent-cyan); }
    .modal-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid var(--border-color);
      padding-top: 10px;
    }
    .btn-delete { background: transparent; color: #f87171; border: none; cursor: pointer; font-size: 12px; font-weight: 600; }
    .btn-delete:hover { text-decoration: underline; }
    .btn-save {
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      font-size: 12.5px;
      width: 100%;
    }
  </style>
</head>
<body>

<div class="container">

  <div id="loadingOverlay">
    <div class="spinner"></div>
    <div class="loading-text" id="loadingText">Memproses data...</div>
  </div>

  <div class="custom-alert-overlay" id="customAlertOverlay">
    <div class="custom-alert-box">
      <div class="alert-icon-wrapper" id="alertIcon">⚠️</div>
      <h4 id="alertTitle">Informasi Sistem</h4>
      <p id="alertMessage">Pesan pemberitahuan...</p>
      <div class="alert-actions" id="alertActions">
        <button class="btn-alert-ok" onclick="closeCustomAlert()">Mengerti</button>
      </div>
    </div>
  </div>

  <a href="index.html" class="back-nav">← Kembali ke Menu Utama</a>

  <div class="header-action-area">
    <div class="header-top-row">
      <div class="brand-wrapper">
        <h2>Kotak Saran & Inovasi</h2>
        <span class="sub-title" id="subTitleRole">Pengajuan ide dan perbaikan kerja</span>
      </div>
      <button class="btn-open-add" onclick="openAddModal()">+ Buat Saran</button>
    </div>
    <input type="text" id="searchInput" class="search-input" placeholder="Cari temuan atau solusi..." oninput="renderKotakSaran()">
  </div>

  <div class="summary-area">
    <span class="summary-title" id="summaryLabel">Total Saran Terekam:</span>
    <span class="count-chip"><b id="countTotal">0</b> Data</span>
  </div>

  <div class="scroll-area">
    <ul id="kotakList">
      <div style="text-align:center; color:#9099a2; padding:30px;">Memuat data...</div>
    </ul>
  </div>

</div>

<!-- Modal Tambah / Edit Kotak Saran -->
<div class="modal-overlay" id="kotakModal">
  <div class="modal-content">
    <div class="modal-header">
      <h3 id="modalTitleID">Form Kotak Saran & Inovasi</h3>
      <button class="btn-close-modal" onclick="closeModal()">&times;</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="modalId">
      
      <label>
        Nama Pelapor:
        <input type="text" id="inputNamaPelapor" readonly disabled style="background-color: #1a202c; color: #38bdf8; font-weight: bold;">
      </label>

      <label>
        Bagian / Section:
        <input type="text" id="inputBagian" list="bagianListOptions" placeholder="Ketik atau pilih bagian...">
        <datalist id="bagianListOptions"></datalist>
      </label>

      <label>
        Tanggal Ditemukan:
        <input type="date" id="inputTglDitemukan">
      </label>

      <label>
        Lokasi Temuan:
        <input type="text" id="inputLokasi" placeholder="Lokasi spesifik temuan...">
      </label>

      <label>
        Deskripsi Temuan / Waste:
        <textarea id="inputDesc" rows="3" placeholder="Jelaskan temuan masalah atau pemborosan..."></textarea>
      </label>

      <label>
        Solusi Perbaikan / Inovasi / Improvement:
        <textarea id="inputSolusi" rows="3" placeholder="Usulan solusi atau perbaikan..."></textarea>
      </label>
    </div>
    <div class="modal-footer">
      <button class="btn-delete" id="modalDeleteBtn" onclick="requestDelete()" style="display:none;">Hapus</button>
      <div style="display: flex; gap: 6px; width: 100%; justify-content: flex-end;" id="modalActionWrapper">
        <button onclick="closeModal()" style="font-size: 12px; padding: 8px 12px; background: #2a3447; color: #f1f3f5; border: 1px solid var(--border-color); border-radius: 6px; cursor: pointer;">Batal</button>
        <button class="btn-save" style="width: auto;" onclick="saveKotakSaran()" id="modalSaveBtn">Simpan</button>
      </div>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script>
  const API_URL = CONFIG.API_URL;

  let allKotakData = [];
  let currentUserNama = "";
  let currentUserNip = "";
  let currentUserRole = "Member";

  window.addEventListener('DOMContentLoaded', () => {
    currentUserNama = localStorage.getItem("pbas_nama") || "";
    currentUserNip = localStorage.getItem("pbas_nip") || "";
    currentUserRole = localStorage.getItem("pbas_role") || "Member";

    if (!currentUserNama) {
      showCustomAlert("Belum Login", "Silakan login terlebih dahulu untuk mengakses Kotak Saran & Inovasi.", "warning", () => {
        window.location.href = "login.html";
      });
      return;
    }

    const subTitle = document.getElementById("subTitleRole");
    if (currentUserRole.toLowerCase() === "superuser") {
      subTitle.textContent = `Mode Superuser: Menampilkan seluruh data saran & inovasi`;
    } else {
      subTitle.textContent = `Mode Member: Menampilkan saran & inovasi milik Anda sendiri`;
    }

    loadKotakSaranData();
  });

  function showLoading(text = "Memproses data...") {
    document.getElementById("loadingText").textContent = text;
    document.getElementById("loadingOverlay").style.display = "flex";
  }
  function hideLoading() { document.getElementById("loadingOverlay").style.display = "none"; }

  function showCustomAlert(title, message, type = "warning", callback = null) {
    document.getElementById("alertTitle").textContent = title;
    document.getElementById("alertMessage").textContent = message;
    
    const iconEl = document.getElementById("alertIcon");
    iconEl.className = "alert-icon-wrapper";
    if (type === "warning") {
      iconEl.textContent = "⚠️"; iconEl.classList.add("alert-icon-warning");
    } else if (type === "success") {
      iconEl.textContent = "✅"; iconEl.classList.add("alert-icon-success");
    } else if (type === "danger") {
      iconEl.textContent = "🗑️"; iconEl.classList.add("alert-icon-danger");
    } else {
      iconEl.textContent = "ℹ️"; iconEl.classList.add("alert-icon-info");
    }

    window._alertCallback = callback;
    document.getElementById("customAlertOverlay").style.display = "flex";
  }

  function showCustomConfirm(title, message, onConfirmCallback) {
    document.getElementById("alertTitle").textContent = title;
    document.getElementById("alertMessage").textContent = message;
    
    const iconEl = document.getElementById("alertIcon");
    iconEl.className = "alert-icon-wrapper alert-icon-danger";
    iconEl.textContent = "⚠️";

    document.getElementById("customAlertOverlay").style.display = "flex";
    document.getElementById("alertActions").innerHTML = `
      <button class="btn-alert-cancel" onclick="closeCustomAlert()">Batal</button>
      <button class="btn-alert-danger-confirm" id="btnConfirmDanger">Hapus</button>
    `;
    document.getElementById("btnConfirmDanger").onclick = () => {
      closeCustomAlert();
      onConfirmCallback();
    };
  }

  function closeCustomAlert() {
    document.getElementById("customAlertOverlay").style.display = "none";
    if (window._alertCallback && typeof window._alertCallback === "function") {
      window._alertCallback();
      window._alertCallback = null;
    }
  }

  // --- Fungsi Pemformatan Tanggal Rapi ---
  function formatDateCustom(dateString) {
    if (!dateString || dateString === "-") return "-";
    const d = new Date(dateString);
    if (isNaN(d.getTime())) return dateString;

    const months = ["Jan", "Feb", "Mar", "Apr", "Mei", "Jun", "Jul", "Agt", "Sep", "Okt", "Nov", "Des"];
    const day = String(d.getDate()).padStart(2, '0');
    const month = months[d.getMonth()];
    const year = d.getFullYear();

    return `${day} ${month} ${year}`;
  }

  // --- Fungsi Konversi Tanggal ke Format YYYY-MM-DD untuk Input Date ---
  function parseToYYYYMMDD(dateString) {
    if (!dateString) return "";
    const d = new Date(dateString);
    if (isNaN(d.getTime())) {
      if (typeof dateString === "string" && dateString.length >= 10) {
        return dateString.substring(0, 10);
      }
      return "";
    }
    const year = d.getFullYear();
    const month = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${year}-${month}-${day}`;
  }

  async function loadKotakSaranData(forceRefresh = false) {
    if (!forceRefresh) showLoading("Memuat data kotak saran...");
    try {
      const response = await fetch(`${API_URL}?action=getKotakSaran`);
      const result = await response.json();
      allKotakData = Array.isArray(result) ? result : [];
      populateBagianDatalist();
      renderKotakSaran();
    } catch (err) {
      console.error(err);
      document.getElementById("kotakList").innerHTML = `<li style="text-align:center; color:#f87171; padding:20px;">Gagal memuat data dari server.</li>`;
    } finally {
      hideLoading();
    }
  }

  function populateBagianDatalist() {
    const datalist = document.getElementById("bagianListOptions");
    datalist.innerHTML = "";
    const uniqueBagian = [...new Set(allKotakData.map(item => item.bagian).filter(b => b && b !== "-"))];
    uniqueBagian.forEach(b => {
      const opt = document.createElement("option");
      opt.value = b;
      datalist.appendChild(opt);
    });
  }

  function renderKotakSaran() {
    const listEl = document.getElementById("kotakList");
    const keyword = document.getElementById("searchInput").value.toLowerCase().trim();
    listEl.innerHTML = "";

    const isSuperUser = currentUserRole.toLowerCase() === "superuser";

    // Filter Hak Akses & Pencarian
    const filtered = allKotakData.filter(item => {
      const isOwner = (item.namaPelapor && currentUserNama && item.namaPelapor.toLowerCase().trim() === currentUserNama.toLowerCase().trim());
      
      // Jika member biasa, hanya tampilkan miliknya sendiri
      if (!isSuperUser && !isOwner) return false;

      const matchSearch = !keyword ||
        (item.id && item.id.toLowerCase().includes(keyword)) ||
        (item.namaPelapor && item.namaPelapor.toLowerCase().includes(keyword)) ||
        (item.bagian && item.bagian.toLowerCase().includes(keyword)) ||
        (item.lokasiTemuan && item.lokasiTemuan.toLowerCase().includes(keyword)) ||
        (item.descTemuanWaste && item.descTemuanWaste.toLowerCase().includes(keyword)) ||
        (item.solusi && item.solusi.toLowerCase().includes(keyword));

      return matchSearch;
    });

    document.getElementById("countTotal").textContent = filtered.length;

    if (filtered.length === 0) {
      listEl.innerHTML = `<div style="text-align:center; color:#9099a2; padding:30px;">Belum ada data kotak saran atau inovasi yang terekam.</div>`;
      return;
    }

    const reversed = filtered.slice().reverse();

    reversed.forEach(item => {
      const li = document.createElement("li");
      li.className = "kotak-item";
      li.onclick = () => openDetailModal(item);

      const itemLeft = document.createElement("div");
      itemLeft.className = "item-left";

      const titleSpan = document.createElement("span");
      titleSpan.className = "item-title";
      titleSpan.textContent = item.solusi || item.descTemuanWaste || "(Tanpa Deskripsi)";

      const metaDiv = document.createElement("div");
      metaDiv.className = "item-meta";

      const bagianBadge = document.createElement("span");
      bagianBadge.className = "badge-bagian";
      bagianBadge.textContent = item.bagian || "-";

      const pelaporBadge = document.createElement("span");
      pelaporBadge.className = "badge-pelapor";
      pelaporBadge.textContent = item.namaPelapor || "-";

      const dateSpan = document.createElement("span");
      dateSpan.style.color = "#94a3b8";
      dateSpan.textContent = `• Ditemukan: ${formatDateCustom(item.tglDiTemukan)}`;

      metaDiv.appendChild(bagianBadge);
      metaDiv.appendChild(pelaporBadge);
      metaDiv.appendChild(dateSpan);

      itemLeft.appendChild(titleSpan);
      itemLeft.appendChild(metaDiv);

      const rightDiv = document.createElement("div");
      const idSpan = document.createElement("span");
      idSpan.style.cssText = "font-size:11px; color:#cbd5e1; font-weight:600;";
      idSpan.textContent = item.id;
      rightDiv.appendChild(idSpan);

      li.appendChild(itemLeft);
      li.appendChild(rightDiv);
      listEl.appendChild(li);
    });
  }

  function openAddModal() {
    document.getElementById("modalId").value = "";
    document.getElementById("modalTitleID").textContent = "Buat Kotak Saran & Inovasi Baru";
    document.getElementById("inputNamaPelapor").value = currentUserNama;
    document.getElementById("inputBagian").value = "";
    document.getElementById("inputTglDitemukan").value = new Date().toISOString().split('T')[0];
    document.getElementById("inputLokasi").value = "";
    document.getElementById("inputDesc").value = "";
    document.getElementById("inputSolusi").value = "";

    document.getElementById("modalDeleteBtn").style.display = "none";
    document.getElementById("modalSaveBtn").style.display = "inline-block";
    
    // Enable fields
    setModalFieldsDisabled(false);

    document.getElementById("kotakModal").style.display = "flex";
  }

  function openDetailModal(item) {
    document.getElementById("modalId").value = item.id;
    document.getElementById("modalTitleID").textContent = `Detail Saran (${item.id})`;
    document.getElementById("inputNamaPelapor").value = item.namaPelapor || "";
    document.getElementById("inputBagian").value = item.bagian || "";
    document.getElementById("inputTglDitemukan").value = parseToYYYYMMDD(item.tglDiTemukan);
    document.getElementById("inputLokasi").value = item.lokasiTemuan || "";
    document.getElementById("inputDesc").value = item.descTemuanWaste || "";
    document.getElementById("inputSolusi").value = item.solusi || "";

    const isSuperUser = currentUserRole.toLowerCase() === "superuser";
    const isOwner = (item.namaPelapor && currentUserNama && item.namaPelapor.toLowerCase().trim() === currentUserNama.toLowerCase().trim());
    const canEdit = isSuperUser || isOwner;

    if (canEdit) {
      setModalFieldsDisabled(false);
      document.getElementById("modalSaveBtn").style.display = "inline-block";
      document.getElementById("modalDeleteBtn").style.display = "inline-block";
    } else {
      setModalFieldsDisabled(true);
      document.getElementById("modalSaveBtn").style.display = "none";
      document.getElementById("modalDeleteBtn").style.display = "none";
    }

    document.getElementById("kotakModal").style.display = "flex";
  }

  function setModalFieldsDisabled(status) {
    document.getElementById("inputBagian").disabled = status;
    document.getElementById("inputTglDitemukan").disabled = status;
    document.getElementById("inputLokasi").disabled = status;
    document.getElementById("inputDesc").disabled = status;
    document.getElementById("inputSolusi").disabled = status;
  }

  function closeModal() {
    document.getElementById("kotakModal").style.display = "none";
  }

  async function saveKotakSaran() {
    const id = document.getElementById("modalId").value;
    const bagian = document.getElementById("inputBagian").value.trim();
    const tglDiTemukan = document.getElementById("inputTglDitemukan").value;
    const lokasiTemuan = document.getElementById("inputLokasi").value.trim();
    const descTemuanWaste = document.getElementById("inputDesc").value.trim();
    const solusi = document.getElementById("inputSolusi").value.trim();

    if (!bagian || !lokasiTemuan || !descTemuanWaste || !solusi) {
      showCustomAlert("Peringatan", "Mohon lengkapi seluruh kolom formulir!", "warning");
      return;
    }

    showLoading(id ? "Menyimpan perubahan..." : "Mengirim saran & inovasi...");
    try {
      const actionType = id ? "updateKotakSaran" : "addKotakSaran";
      const payload = {
        action: actionType,
        id: id,
        nip: currentUserNip,
        userNama: currentUserNama,
        namaPelapor: currentUserNama,
        bagian: bagian,
        tglDiTemukan: tglDiTemukan,
        lokasiTemuan: lokasiTemuan,
        descTemuanWaste: descTemuanWaste,
        solusi: solusi
      };

      const response = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: new URLSearchParams(payload)
      });
      const res = await response.json();
      closeModal();

      if (res.status === "success") {
        showCustomAlert("Berhasil", id ? "Saran berhasil diperbarui." : "Saran & Inovasi berhasil dikirim dan dicatat.", "success");
        loadKotakSaranData(true);
      } else {
        showCustomAlert("Gagal", res.message || "Gagal menyimpan data.", "warning");
      }
    } catch (err) {
      console.error(err);
      showCustomAlert("Kesalahan", "Terjadi kesalahan jaringan.", "danger");
    } finally {
      hideLoading();
    }
  }

  function requestDelete() {
    showCustomConfirm("Konfirmasi Hapus", "Apakah Anda yakin ingin menghapus data saran ini?", deleteExecute);
  }

  async function deleteExecute() {
    const id = document.getElementById("modalId").value;
    showLoading("Menghapus data...");
    try {
      const response = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: new URLSearchParams({
          action: "deleteKotakSaran",
          id: id,
          nip: currentUserNip,
          userNama: currentUserNama
        })
      });
      const res = await response.json();
      closeModal();

      if (res.status === "success") {
        showCustomAlert("Berhasil", "Data berhasil dihapus.", "success");
        loadKotakSaranData(true);
      } else {
        showCustomAlert("Gagal", res.message || "Gagal menghapus data.", "warning");
      }
    } catch (err) {
      console.error(err);
      showCustomAlert("Kesalahan", "Gagal menghubungi server.", "danger");
    } finally {
      hideLoading();
    }
  }
</script>

</body>
