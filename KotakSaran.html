<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kotak Saran & Inovasi</title>
  
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#12161f">
  
  <style>
    :root {
      --bg-app: #12161f;
      --card-bg: #1c2230;
      --card-hover: #242c3d;
      --text-main: #f1f3f5;
      --text-secondary: #9099a2;
      --border-color: #2a3447;
      --accent-blue: #3b82f6;
      --accent-purple: #8b5cf6;
      --accent-cyan: #06b6d4;
      --accent-green: #22c55e;
      --accent-red: #ef4444;
      --accent-warn: #f59e0b;
    }

    * { box-sizing: border-box; -webkit-user-select: none; user-select: none; }
    input, textarea, select { -webkit-user-select: text; user-select: text; }

    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-app);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 700px;
      height: 100%;
      max-height: 100vh;
      background: var(--bg-app);
      padding: 16px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    #loadingOverlay {
      display: none;
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(18, 22, 31, 0.85);
      backdrop-filter: blur(5px);
      z-index: 2000;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      gap: 12px;
    }
    .spinner {
      width: 45px; height: 45px;
      border: 4px solid var(--border-color);
      border-top: 4px solid var(--accent-cyan);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    .loading-text { font-size: 13px; font-weight: 600; color: var(--text-main); }

    .custom-alert-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.8);
      backdrop-filter: blur(4px);
      z-index: 3000;
      justify-content: center;
      align-items: center;
      padding: 16px;
    }
    .custom-alert-box {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      width: 100%; max-width: 360px;
      border-radius: 14px; padding: 20px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      display: flex; flex-direction: column; gap: 14px;
    }
    .alert-icon-wrapper {
      width: 48px; height: 48px; border-radius: 50%; margin: 0 auto;
      display: flex; justify-content: center; align-items: center; font-size: 22px;
    }
    .alert-icon-warning { background: rgba(245, 158, 11, 0.15); color: var(--accent-warn); border: 1px solid rgba(245, 158, 11, 0.3); }
    .alert-icon-success { background: rgba(34, 197, 94, 0.15); color: var(--accent-green); border: 1px solid rgba(34, 197, 94, 0.3); }
    .alert-icon-danger { background: rgba(239, 68, 68, 0.15); color: var(--accent-red); border: 1px solid rgba(239, 68, 68, 0.3); }
    .alert-icon-info { background: rgba(6, 182, 212, 0.15); color: var(--accent-cyan); border: 1px solid rgba(6, 182, 212, 0.3); }

    .custom-alert-box h4 { margin: 0; font-size: 16px; color: #ffffff; font-weight: 700; }
    .custom-alert-box p { margin: 0; font-size: 13px; color: var(--text-secondary); line-height: 1.5; text-align: left; }
    .alert-actions { display: flex; gap: 8px; justify-content: center; }
    .btn-alert-ok {
      flex: 1; background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
      color: white; border: none; padding: 10px; border-radius: 8px; font-weight: 600; font-size: 13px; cursor: pointer;
    }
    .btn-alert-cancel {
      flex: 1; background: #2a3447; color: var(--text-main); border: 1px solid var(--border-color);
      padding: 10px; border-radius: 8px; font-weight: 600; font-size: 13px; cursor: pointer;
    }
    .btn-alert-danger-confirm {
      flex: 1; background: linear-gradient(135deg, #ef4444, #dc2626);
      color: white; border: none; padding: 10px; border-radius: 8px; font-weight: 600; font-size: 13px; cursor: pointer;
    }

    .back-nav {
      display: inline-flex; align-items: center; gap: 6px;
      color: var(--accent-cyan); font-size: 12px; font-weight: 600; cursor: pointer;
      margin-bottom: 6px; background: none; border: none; padding: 0; flex-shrink: 0;
    }
    .back-nav:hover { text-decoration: underline; }

    .header-action-area {
      display: flex; flex-direction: column; gap: 8px; margin-bottom: 10px; flex-shrink: 0;
    }
    .header-top-row {
      display: flex; justify-content: space-between; align-items: center; gap: 6px;
    }
    .header-bottom-row {
      display: flex; gap: 6px; width: 100%;
    }

    .brand-wrapper h2 { color: #ffffff; margin: 0 0 2px 0; font-size: 18px; font-weight: 700; }
    .brand-wrapper p { color: var(--text-secondary); font-size: 11.5px; margin: 0; }

    .search-input {
      width: 100%; padding: 8px 12px; border: 1px solid var(--border-color); border-radius: 8px;
      font-size: 12.5px; outline: none; background: var(--card-bg); color: var(--text-main);
    }
    .search-input:focus { border-color: var(--accent-cyan); }

    .btn-create {
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
      color: white; border: none; padding: 7px 12px; border-radius: 8px;
      font-weight: 600; font-size: 12px; cursor: pointer; white-space: nowrap;
      box-shadow: 0 3px 10px rgba(6, 182, 212, 0.25);
    }

    /* Filter Status Bar */
    .filter-bar {
      display: flex; gap: 6px; margin-bottom: 10px; flex-shrink: 0; align-items: center;
    }
    .filter-select {
      flex: 1; padding: 7px 10px; border: 1px solid var(--border-color); border-radius: 8px;
      font-size: 11.5px; outline: none; background: var(--card-bg); color: var(--text-main); font-weight: 500;
    }
    .btn-refresh {
      background: rgba(6, 182, 212, 0.15); color: var(--accent-cyan); border: 1px solid rgba(6, 182, 212, 0.3);
      padding: 7px 12px; border-radius: 8px; font-size: 11.5px; font-weight: 600; cursor: pointer; white-space: nowrap;
    }
    .btn-refresh:hover { background: rgba(6, 182, 212, 0.25); }

    .sub-meta-info {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 11px; color: var(--text-secondary); margin-bottom: 8px; flex-shrink: 0; padding: 0 2px;
    }

    .kotak-scroll-area {
      flex: 1; overflow-y: auto; padding-right: 2px; -webkit-overflow-scrolling: touch;
    }
    ul { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 10px; }

    li.kotak-item {
      background: var(--card-bg); border: 1px solid var(--border-color);
      border-radius: 10px; padding: 12px 14px; cursor: pointer;
      display: flex; flex-direction: column; gap: 8px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2); transition: all 0.2s ease;
    }
    li.kotak-item:hover { transform: translateY(-2px); border-color: var(--accent-cyan); background: var(--card-hover); }

    .kotak-item-top {
      display: flex; justify-content: space-between; align-items: flex-start; gap: 8px;
    }
    .kotak-title {
      font-weight: 600; color: #ffffff; font-size: 13px; line-height: 1.4;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .kotak-id {
      font-size: 11px; font-weight: 700; color: var(--accent-cyan); white-space: nowrap;
    }

    .kotak-badges-row {
      display: flex; gap: 6px; flex-wrap: wrap; align-items: center;
    }
    .badge-tag {
      font-size: 10.5px; font-weight: 600; padding: 2px 7px; border-radius: 5px;
      display: inline-flex; align-items: center; gap: 3px;
    }
    .badge-waste { background: rgba(245, 158, 11, 0.15); color: #f6ad55; border: 1px solid rgba(245, 158, 11, 0.3); }
    .badge-bagian { background: rgba(139, 92, 246, 0.15); color: #b794f4; border: 1px solid rgba(139, 92, 246, 0.3); }
    .badge-pic { background: rgba(59, 130, 246, 0.15); color: #63b3ed; border: 1px solid rgba(59, 130, 246, 0.3); }

    /* Desain Status Approval Lebih Modern & Kontras */
    .badge-status {
      font-size: 10.5px; font-weight: 700; padding: 3px 9px; border-radius: 6px;
      display: inline-flex; align-items: center; gap: 4px; box-shadow: 0 2px 5px rgba(0,0,0,0.15);
    }
    .status-menunggu { background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.4); }
    .status-proses { background: rgba(6, 182, 212, 0.2); color: #22d3ee; border: 1px solid rgba(6, 182, 212, 0.4); }
    .status-selesai { background: rgba(34, 197, 94, 0.2); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.4); }
    .status-ditolak { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.4); }

    .kotak-item-footer {
      display: flex; justify-content: space-between; align-items: center;
      font-size: 11px; color: var(--text-secondary); border-top: 1px solid rgba(255,255,255,0.05); paddingTop: 6px;
    }

    /* Modal Detail & Tambah */
    .modal-overlay {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(4px);
      justify-content: center; align-items: center; z-index: 1000; padding: 12px; box-sizing: border-box;
    }
    .modal-content {
      background: var(--card-bg); color: var(--text-main); width: 100%; max-width: 480px;
      padding: 18px; border-radius: 12px; border: 1px solid var(--border-color);
      box-shadow: 0 15px 35px rgba(0,0,0,0.5); display: flex; flex-direction: column; gap: 10px;
      max-height: 90vh; overflow-y: auto;
    }
    .modal-header {
      display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-color); padding-bottom: 8px;
    }
    .modal-header h3 { margin: 0; color: #ffffff; font-size: 15px; }
    .btn-close-modal { background: transparent; border: none; font-size: 20px; cursor: pointer; color: var(--text-secondary); line-height: 1; }
    .modal-body { display: flex; flex-direction: column; gap: 8px; }
    .modal-body label { display: flex; flex-direction: column; gap: 3px; font-size: 11.5px; font-weight: 600; color: var(--text-secondary); }
    .modal-body input, .modal-body select, .modal-body textarea {
      padding: 8px 10px; font-size: 12px; font-family: inherit; border: 1px solid var(--border-color);
      border-radius: 6px; outline: none; width: 100%; background: #161b26; color: var(--text-main);
    }
    .modal-body input:focus, .modal-body select:focus, .modal-body textarea:focus { border-color: var(--accent-cyan); }
    .modal-footer {
      display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border-color); padding-top: 10px;
    }
    .btn-delete { background: transparent; color: #f87171; border: none; cursor: pointer; font-size: 12px; font-weight: 600; }
    .btn-delete:hover { text-decoration: underline; }
    .btn-save {
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue)); color: white; border: none;
      padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 12.5px; width: 100%;
    }
    .btn-save:hover { opacity: 0.9; }

    .approval-list {
      background: #161b26; border: 1px solid var(--border-color); border-radius: 8px; padding: 8px; display: flex; flex-direction: column; gap: 6px; max-height: 140px; overflow-y: auto;
    }
    .approval-row {
      display: flex; justify-content: space-between; align-items: center; font-size: 11px; padding: 4px 6px; background: rgba(255,255,255,0.02); border-radius: 4px;
    }
  </style>
</head>
<body>

<div class="container">

  <div id="loadingOverlay">
    <div class="spinner"></div>
    <div class="loading-text" id="loadingText">Memproses data...</div>
  </div>

  <div class="custom-alert-overlay" id="customAlertOverlay">
    <div class="custom-alert-box">
      <div class="alert-icon-wrapper" id="alertIcon">⚠️</div>
      <h4 id="alertTitle">Informasi Sistem</h4>
      <p id="alertMessage">Pesan...</p>
      <div class="alert-actions" id="alertActions">
        <button class="btn-alert-ok" onclick="closeCustomAlert()">Mengerti</button>
      </div>
    </div>
  </div>

  <button class="back-nav" onclick="window.location.href='index.html'">← Kembali ke Menu Utama</button>

  <div class="header-action-area">
    <div class="header-top-row">
      <div class="brand-wrapper">
        <h2>Kotak Saran & Inovasi</h2>
        <p>Sistem Pengelolaan Improvement Terpadu</p>
      </div>
      <button class="btn-create" onclick="openAddModal()">+ Buat Saran</button>
    </div>
    <div class="header-bottom-row">
      <input type="text" id="searchInput" class="search-input" placeholder="Cari temuan, solusi, atau jenis waste..." oninput="renderKotakList()">
    </div>
  </div>

  <!-- Filter Status Approval -->
  <div class="filter-bar">
    <select id="filterStatus" class="filter-select" onchange="renderKotakList()">
      <option value="ALL">Semua Status Pengajuan</option>
      <option value="Menunggu">Menunggu Approval</option>
      <option value="Disetujui">Disetujui / Diproses</option>
      <option value="Selesai">Selesai (Closed)</option>
      <option value="Ditolak">Ditolak</option>
    </select>
    <button class="btn-refresh" onclick="loadKotakSaranData(true)">🔄 Refresh</button>
  </div>

  <div class="sub-meta-info">
    <span id="totalDataLabel">Total Saran Terekam: 0 Data</span>
    <span id="userLoginLabel" style="color: var(--accent-cyan); font-weight: 600;"></span>
  </div>

  <div class="kotak-scroll-area">
    <ul id="kotakListContainer">
      <li style="text-align:center; color:#9099a2; padding:20px;">Memuat data...</li>
    </ul>
  </div>

</div>

<!-- Modal Tambah Saran -->
<div class="modal-overlay" id="addModal">
  <div class="modal-content">
    <div class="modal-header">
      <h3>Buat Saran & Inovasi Baru</h3>
      <button class="btn-close-modal" onclick="closeAddModal()">&times;</button>
    </div>
    <div class="modal-body">
      <label>
        Nama Pelapor:
        <input type="text" id="addNamaPelapor" readonly style="background-color: #1a202c; color: var(--accent-cyan); font-weight: bold;">
      </label>
      <label>
        Bagian / Section:
        <input type="text" id="addBagian" placeholder="Contoh: Produksi, Maintenance, dll...">
      </label>
      <div style="display: flex; gap: 8px;">
        <label style="flex: 1;">
          Tanggal Ditemukan:
          <input type="date" id="addTglDiTemukan">
        </label>
        <label style="flex: 1;">
          Jenis Waste:
          <select id="addJenisWaste">
            <option value="Defect">Defect</option>
            <option value="Overproduction">Overproduction</option>
            <option value="Waiting">Waiting</option>
            <option value="Non-Utilized Talent">Non-Utilized Talent</option>
            <option value="Transportation">Transportation</option>
            <option value="Inventory">Inventory</option>
            <option value="Motion">Motion</option>
            <option value="Extra-Processing">Extra-Processing</option>
          </select>
        </label>
      </div>
      <label>
        Lokasi Temuan:
        <input type="text" id="addLokasiTemuan" placeholder="Lokasi spesifik temuan...">
      </label>
      <label>
        Deskripsi Temuan / Waste:
        <textarea id="addDescTemuanWaste" rows="3" placeholder="Jelaskan masalah atau pemborosan yang ditemukan..."></textarea>
      </label>
      <label>
        Solusi / Perbaikan / Inovasi:
        <textarea id="addSolusi" rows="3" placeholder="Tuliskan gagasan solusi atau perbaikan..."></textarea>
      </label>
    </div>
    <div class="modal-footer">
      <button onclick="closeAddModal()" style="font-size: 12px; padding: 8px 12px; background: #2a3447; color: #f1f3f5; border: 1px solid var(--border-color); border-radius: 6px; cursor: pointer;">Batal</button>
      <button class="btn-save" onclick="submitAddKotak()">Kirim Pengajuan</button>
    </div>
  </div>
</div>

<!-- Modal Detail Saran -->
<div class="modal-overlay" id="detailModal">
  <div class="modal-content">
    <div class="modal-header">
      <h3 id="detailModalTitleID">Detail Saran</h3>
      <button class="btn-close-modal" onclick="closeDetailModal()">&times;</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="detailIdKotak">
      <div id="adminApprovalSection" style="display: none; background: rgba(59, 130, 246, 0.1); border: 1px solid rgba(59, 130, 246, 0.3); padding: 10px; border-radius: 8px; margin-bottom: 4px;">
        <h4 style="margin: 0 0 6px 0; font-size: 12.5px; color: #60a5fa;">Panel Admin / PIC</h4>
        <div style="display: flex; flex-direction: column; gap: 6px;">
          <label style="font-size: 11px;">Status Pengajuan:</label>
          <select id="adminStatusPengajuan">
            <option value="Menunggu Approval SectionHead">Menunggu Approval SectionHead</option>
            <option value="Disetujui SectionHead - Menunggu Penugasan PIC">Disetujui SectionHead - Menunggu Penugasan PIC</option>
            <option value="Sedang Diproses PIC">Sedang Diproses PIC</option>
            <option value="Selesai">Selesai (Closed)</option>
            <option value="Ditolak">Ditolak</option>
          </select>
          <label style="font-size: 11px;">Tujukan ke PIC:</label>
          <select id="adminTujukanPic">
            <option value="">-- Pilih PIC --</option>
          </select>
          <button class="btn-save" style="margin-top: 4px; padding: 6px;" onclick="saveAdminKotakUpdate()">Simpan Status & PIC</button>
        </div>
      </div>

      <div style="display: flex; gap: 8px;">
        <label style="flex: 1;">
          Nama Pelapor:
          <input type="text" id="detailNamaPelapor" readonly>
        </label>
        <label style="flex: 1;">
          Bagian / Section:
          <input type="text" id="detailBagian">
        </label>
      </div>

      <div style="display: flex; gap: 8px;">
        <label style="flex: 1;">
          Tanggal Ditemukan:
          <input type="date" id="detailTglDiTemukan">
        </label>
        <label style="flex: 1;">
          Jenis Waste:
          <select id="detailJenisWaste">
            <option value="Defect">Defect</option>
            <option value="Overproduction">Overproduction</option>
            <option value="Waiting">Waiting</option>
            <option value="Non-Utilized Talent">Non-Utilized Talent</option>
            <option value="Transportation">Transportation</option>
            <option value="Inventory">Inventory</option>
            <option value="Motion">Motion</option>
            <option value="Extra-Processing">Extra-Processing</option>
          </select>
        </label>
      </div>

      <label>
        Lokasi Temuan:
        <input type="text" id="detailLokasiTemuan">
      </label>
      <label>
        Deskripsi Temuan / Waste:
        <textarea id="detailDescTemuanWaste" rows="3"></textarea>
      </label>
      <label>
        Solusi / Perbaikan / Inovasi (Termasuk Progress PIC):
        <textarea id="detailSolusi" rows="4"></textarea>
      </label>

      <label style="margin-top: 4px;">
        Status Persetujuan SectionHead (<span id="shCountLabel">0 Orang</span>):
        <div class="approval-list" id="detailApprovalListContainer">
          <!-- List Approval -->
        </div>
      </label>
    </div>
    <div class="modal-footer">
      <button class="btn-delete" id="detailDeleteBtn" onclick="requestDeleteKotak()">Hapus Saran</button>
      <div style="display: flex; gap: 6px;">
        <button onclick="closeDetailModal()" style="font-size: 12px; padding: 8px 12px; background: #2a3447; color: #f1f3f5; border: 1px solid var(--border-color); border-radius: 6px; cursor: pointer;">Tutup</button>
        <button class="btn-save" id="detailSaveBtn" onclick="saveKotakEdit()">Simpan Perubahan</button>
      </div>
    </div>
  </div>
</div>

<script src="config.js"></script>

<script>
  const API_URL = CONFIG.API_URL;
  let allKotakData = [];
  let currentUserNama = "";
  let currentUserNip = "";
  let currentUserRole = "Member";
  let activeUsersList = [];

  window.addEventListener('DOMContentLoaded', () => {
    currentUserNama = localStorage.getItem("pbas_nama") || "";
    currentUserNip = localStorage.getItem("pbas_nip") || "";
    currentUserRole = localStorage.getItem("pbas_role") || "Member";

    if (currentUserNama) {
      document.getElementById("userLoginLabel").textContent = `👤 ${currentUserNama} (${currentUserRole})`;
    } else {
      document.getElementById("userLoginLabel").textContent = `⚠️ Belum Login`;
    }

    document.getElementById("addTglDiTemukan").value = new Date().toISOString().split('T')[0];
    
    loadKotakSaranData();
    loadActiveUsersForPic();
  });

  function showLoading(text = "Memproses data...") {
    document.getElementById("loadingText").textContent = text;
    document.getElementById("loadingOverlay").style.display = "flex";
  }
  function hideLoading() { document.getElementById("loadingOverlay").style.display = "none"; }

  function showCustomAlert(title, message, type = "warning", callback = null) {
    document.getElementById("alertTitle").textContent = title;
    document.getElementById("alertMessage").innerHTML = message;
    
    const iconEl = document.getElementById("alertIcon");
    iconEl.className = "alert-icon-wrapper";
    if (type === "success") { iconEl.textContent = "✅"; iconEl.classList.add("alert-icon-success"); }
    else if (type === "danger") { iconEl.textContent = "🗑️"; iconEl.classList.add("alert-icon-danger"); }
    else if (type === "info") { iconEl.textContent = "ℹ️"; iconEl.classList.add("alert-icon-info"); }
    else { iconEl.textContent = "⚠️"; iconEl.classList.add("alert-icon-warning"); }

    window._alertCallback = callback;
    document.getElementById("alertActions").innerHTML = `<button class="btn-alert-ok" onclick="closeCustomAlert()">Mengerti</button>`;
    document.getElementById("customAlertOverlay").style.display = "flex";
  }

  function showCustomConfirm(title, message, onConfirmCallback) {
    document.getElementById("alertTitle").textContent = title;
    document.getElementById("alertMessage").textContent = message;
    
    const iconEl = document.getElementById("alertIcon");
    iconEl.className = "alert-icon-wrapper alert-icon-danger";
    iconEl.textContent = "⚠️";

    document.getElementById("alertActions").innerHTML = `
      <button class="btn-alert-cancel" onclick="closeCustomAlert()">Batal</button>
      <button class="btn-alert-danger-confirm" id="btnConfirmDanger">Hapus</button>
    `;
    document.getElementById("btnConfirmDanger").onclick = () => {
      closeCustomAlert();
      onConfirmCallback();
    };
    document.getElementById("customAlertOverlay").style.display = "flex";
  }

  function closeCustomAlert() {
    document.getElementById("customAlertOverlay").style.display = "none";
    if (window._alertCallback) { window._alertCallback(); window._alertCallback = null; }
  }

  async function loadKotakSaranData(force = false) {
    const cached = localStorage.getItem("local_kotak_cache");
    if (cached && !force) {
      try {
        allKotakData = JSON.parse(cached);
        renderKotakList();
      } catch(e) {}
    } else {
      showLoading("Memuat data kotak saran...");
    }

    try {
      const res = await fetch(`${API_URL}?action=getKotakSaran`);
      const result = await res.json();
      allKotakData = Array.isArray(result) ? result : [];
      localStorage.setItem("local_kotak_cache", JSON.stringify(allKotakData));
      renderKotakList();
    } catch (err) {
      console.error(err);
      if (!allKotakData.length) {
        document.getElementById("kotakListContainer").innerHTML = `<li style="text-align:center; color:#f87171; padding:20px;">Gagal memuat data dari server.</li>`;
      }
    } finally {
      hideLoading();
    }
  }

  async function loadActiveUsersForPic() {
    try {
      const res = await fetch(`${API_URL}?action=getUsers`);
      const data = await res.json();
      activeUsersList = Array.isArray(data) ? data : [];
      
      const selectPic = document.getElementById("adminTujukanPic");
      selectPic.innerHTML = `<option value="">-- Pilih PIC --</option>`;
      activeUsersList.forEach(u => {
        let opt = document.createElement("option");
        opt.value = `${u.nama} [${u.nip}]`;
        opt.textContent = `${u.nama} (${u.nip})`;
        selectPic.appendChild(opt);
      });
    } catch(e) { console.error(e); }
  }

  function renderKotakList() {
    const container = document.getElementById("kotakListContainer");
    const keyword = document.getElementById("searchInput").value.toLowerCase().trim();
    const filterStatus = document.getElementById("filterStatus").value;

    container.innerHTML = "";

    const filtered = allKotakData.filter(item => {
      const matchKeyword = !keyword || 
        (item.id && item.id.toLowerCase().includes(keyword)) ||
        (item.namaPelapor && item.namaPelapor.toLowerCase().includes(keyword)) ||
        (item.bagian && item.bagian.toLowerCase().includes(keyword)) ||
        (item.lokasiTemuan && item.lokasiTemuan.toLowerCase().includes(keyword)) ||
        (item.jenisWaste && item.jenisWaste.toLowerCase().includes(keyword)) ||
        (item.descTemuanWaste && item.descTemuanWaste.toLowerCase().includes(keyword)) ||
        (item.solusi && item.solusi.toLowerCase().includes(keyword));

      let matchStatus = true;
      const st = (item.statusPengajuan || "").toLowerCase();
      if (filterStatus === "Menunggu") {
        matchStatus = st.includes("menunggu");
      } else if (filterStatus === "Disetujui") {
        matchStatus = st.includes("disetujui") || st.includes("diproses");
      } else if (filterStatus === "Selesai") {
        matchStatus = st.includes("selesai");
      } else if (filterStatus === "Ditolak") {
        matchStatus = st.includes("ditolak");
      }

      return matchKeyword && matchStatus;
    });

    document.getElementById("totalDataLabel").textContent = `Total Saran Terekam: ${filtered.length} Data`;

    if (filtered.length === 0) {
      container.innerHTML = `<li style="text-align:center; color:#9099a2; padding:30px;">Tidak ada data saran yang ditemukan.</li>`;
      return;
    }

    // Urutkan data terbaru di atas (Descending berdasarkan ID/Waktu)
    const sortedFiltered = filtered.slice().reverse();

    sortedFiltered.forEach(item => {
      const li = document.createElement("li");
      li.className = "kotak-item";
      li.onclick = () => openDetailModal(item);

      const topRow = document.createElement("div");
      topRow.className = "kotak-item-top";

      const titleEl = document.createElement("div");
      titleEl.className = "kotak-title";
      titleEl.textContent = item.solusi || item.descTemuanWaste || "(Tanpa Keterangan)";

      const idEl = document.createElement("div");
      idEl.className = "kotak-id";
      idEl.textContent = item.id;

      topRow.appendChild(titleEl);
      topRow.appendChild(idEl);

      const badgesRow = document.createElement("div");
      badgesRow.className = "kotak-badges-row";

      // Badge Waste
      if (item.jenisWaste && item.jenisWaste !== "-") {
        const bWaste = document.createElement("span");
        bWaste.className = "badge-tag badge-waste";
        bWaste.textContent = `⚠️ ${item.jenisWaste}`;
        badgesRow.appendChild(bWaste);
      }

      // Badge Bagian
      if (item.bagian && item.bagian !== "-") {
        const bBagian = document.createElement("span");
        bBagian.className = "badge-tag badge-bagian";
        bBagian.textContent = item.bagian;
        badgesRow.appendChild(bBagian);
      }

      // Badge PIC (jika ada)
      if (item.tujukanPic) {
        const bPic = document.createElement("span");
        bPic.className = "badge-tag badge-pic";
        let cleanPic = item.tujukanPic.includes("[") ? item.tujukanPic.split("[")[0].trim() : item.tujukanPic;
        bPic.textContent = `PIC: ${cleanPic}`;
        badgesRow.appendChild(bPic);
      }

      // Badge Status Pengajuan dengan warna modern kontras
      const bStatus = document.createElement("span");
      bStatus.className = "badge-status";
      let statusText = item.statusPengajuan || "Menunggu Approval SectionHead";
      
      const stLower = statusText.toLowerCase();
      if (stLower.includes("selesai")) {
        bStatus.classList.add("status-selesai");
        bStatus.textContent = `✅ ${statusText}`;
      } else if (stLower.includes("disetujui") || stLower.includes("proses")) {
        bStatus.classList.add("status-proses");
        bStatus.textContent = `🚀 ${statusText}`;
      } else if (stLower.includes("ditolak")) {
        bStatus.classList.add("status-ditolak");
        bStatus.textContent = `❌ ${statusText}`;
      } else {
        bStatus.classList.add("status-menunggu");
        bStatus.textContent = `⏳ ${statusText}`;
      }
      badgesRow.appendChild(bStatus);

      const footerRow = document.createElement("div");
      footerRow.className = "kotak-item-footer";
      footerRow.innerHTML = `<span>Pelapor: <b>${item.namaPelapor || '-'}</b></span><span>Ditemukan: ${item.tglDiTemukan || '-'}</span>`;

      li.appendChild(topRow);
      li.appendChild(badgesRow);
      li.appendChild(footerRow);
      container.appendChild(li);
    });
  }

  function openAddModal() {
    if (!currentUserNama) {
      showCustomAlert("Belum Login", "Silakan login terlebih dahulu untuk membuat saran dan inovasi.", "warning", () => {
        window.location.href = "login.html";
      });
      return;
    }
    document.getElementById("addNamaPelapor").value = currentUserNama;
    document.getElementById("addBagian").value = "";
    document.getElementById("addLokasiTemuan").value = "";
    document.getElementById("addDescTemuanWaste").value = "";
    document.getElementById("addSolusi").value = "";
    document.getElementById("addModal").style.display = "flex";
  }

  function closeAddModal() { document.getElementById("addModal").style.display = "none"; }

  async function submitAddKotak() {
    const bagian = document.getElementById("addBagian").value.trim();
    const tglDiTemukan = document.getElementById("addTglDiTemukan").value;
    const jenisWaste = document.getElementById("addJenisWaste").value;
    const lokasiTemuan = document.getElementById("addLokasiTemuan").value.trim();
    const descTemuanWaste = document.getElementById("addDescTemuanWaste").value.trim();
    const solusi = document.getElementById("addSolusi").value.trim();

    if (!bagian || !lokasiTemuan || !descTemuanWaste || !solusi) {
      showCustomAlert("Peringatan", "Mohon lengkapi semua kolom form pengajuan saran!", "warning");
      return;
    }

    showLoading("Mengirim saran baru...");
    try {
      await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: new URLSearchParams({
          action: "addKotakSaran",
          namaPelapor: currentUserNama,
          bagian: bagian,
          tglDiTemukan: tglDiTemukan,
          lokasiTemuan: lokasiTemuan,
          jenisWaste: jenisWaste,
          descTemuanWaste: descTemuanWaste,
          solusi: solusi
        })
      });
      closeAddModal();
      showCustomAlert("Berhasil", "Saran & Inovasi berhasil dikirim dan menunggu persetujuan SectionHead.", "success");
      loadKotakSaranData(true);
    } catch(err) {
      console.error(err);
      showCustomAlert("Kesalahan", "Gagal mengirim pengajuan. Silakan coba lagi.", "warning");
    } finally {
      hideLoading();
    }
  }

  function openDetailModal(item) {
    document.getElementById("detailIdKotak").value = item.id;
    document.getElementById("detailModalTitleID").textContent = `Detail Saran (${item.id})`;
    document.getElementById("detailNamaPelapor").value = item.namaPelapor || "";
    document.getElementById("detailBagian").value = item.bagian || "";
    document.getElementById("detailTglDiTemukan").value = item.tglDiTemukan || "";
    document.getElementById("detailJenisWaste").value = item.jenisWaste || "Defect";
    document.getElementById("detailLokasiTemuan").value = item.lokasiTemuan || "";
    document.getElementById("detailDescTemuanWaste").value = item.descTemuanWaste || "";
    document.getElementById("detailSolusi").value = item.solusi || "";

    // List Approval SectionHead
    const approvalContainer = document.getElementById("detailApprovalListContainer");
    approvalContainer.innerHTML = "";
    const details = item.approvalDetails || [];
    document.getElementById("shCountLabel").textContent = `${details.length} Orang`;

    if (details.length === 0) {
      approvalContainer.innerHTML = `<div style="text-align:center; color:#9099a2; font-size:11px; padding:6px;">Belum ada data SectionHead terdaftar.</div>`;
    } else {
      details.forEach(sh => {
        const row = document.createElement("div");
        row.className = "approval-row";
        let statusBadgeSH = sh.status === "Approve" ? `<span style="color:#4ade80; font-weight:700;">✅ Approve</span>` : `<span style="color:#fbbf24; font-weight:700;">⏳ Pending</span>`;
        row.innerHTML = `<span><b>${sh.nip}</b> - ${sh.nama}</span> ${statusBadgeSH}`;
        approvalContainer.appendChild(row);
      });
    }

    const isSuperUser = (currentUserRole.toLowerCase() === "superuser");
    const adminPanel = document.getElementById("adminApprovalSection");

    if (isSuperUser) {
      adminPanel.style.display = "block";
      document.getElementById("adminStatusPengajuan").value = item.statusPengajuan || "Menunggu Approval SectionHead";
      document.getElementById("adminTujukanPic").value = item.tujukanPic || "";
    } else {
      adminPanel.style.display = "none";
    }

    const isOwner = (currentUserNama && item.namaPelapor && currentUserNama.toLowerCase().trim() === item.namaPelapor.toLowerCase().trim());
    const canEdit = isSuperUser || isOwner;

    document.getElementById("detailBagian").disabled = !canEdit;
    document.getElementById("detailTglDiTemukan").disabled = !canEdit;
    document.getElementById("detailJenisWaste").disabled = !canEdit;
    document.getElementById("detailLokasiTemuan").disabled = !canEdit;
    document.getElementById("detailDescTemuanWaste").disabled = !canEdit;
    document.getElementById("detailSolusi").disabled = !canEdit;
    
    document.getElementById("detailSaveBtn").style.display = canEdit ? "inline-block" : "none";
    document.getElementById("detailDeleteBtn").style.display = canEdit ? "inline-block" : "none";

    document.getElementById("detailModal").style.display = "flex";
  }

  function closeDetailModal() { document.getElementById("detailModal").style.display = "none"; }

  async function saveKotakEdit() {
    const id = document.getElementById("detailIdKotak").value;
    const bagian = document.getElementById("detailBagian").value.trim();
    const tglDiTemukan = document.getElementById("detailTglDiTemukan").value;
    const jenisWaste = document.getElementById("detailJenisWaste").value;
    const lokasiTemuan = document.getElementById("detailLokasiTemuan").value.trim();
    const descTemuanWaste = document.getElementById("detailDescTemuanWaste").value.trim();
    const solusi = document.getElementById("detailSolusi").value.trim();

    showLoading("Menyimpan perubahan...");
    try {
      await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: new URLSearchParams({
          action: "updateKotakSaran",
          nip: currentUserNip,
          userNama: currentUserNama,
          id: id,
          bagian: bagian,
          tglDiTemukan: tglDiTemukan,
          lokasiTemuan: lokasiTemuan,
          jenisWaste: jenisWaste,
          descTemuanWaste: descTemuanWaste,
          solusi: solusi
        })
      });
      closeDetailModal();
      showCustomAlert("Berhasil", "Perubahan saran berhasil disimpan.", "success");
      loadKotakSaranData(true);
    } catch(err) {
      console.error(err);
      showCustomAlert("Kesalahan", "Gagal menyimpan perubahan.", "warning");
    } finally {
      hideLoading();
    }
  }

  async function saveAdminKotakUpdate() {
    const id = document.getElementById("detailIdKotak").value;
    const statusPengajuan = document.getElementById("adminStatusPengajuan").value;
    const tujukanPic = document.getElementById("adminTujukanPic").value;

    showLoading("Memperbarui status admin...");
    try {
      await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: new URLSearchParams({
          action: "updateKotakSaranAdmin",
          id: id,
          statusPengajuan: statusPengajuan,
          tujukanPic: tujukanPic
        })
      });
      closeDetailModal();
      showCustomAlert("Berhasil", "Status dan penugasan PIC berhasil diperbarui.", "success");
      loadKotakSaranData(true);
    } catch(err) {
      console.error(err);
      showCustomAlert("Kesalahan", "Gagal memperbarui status admin.", "warning");
    } finally {
      hideLoading();
    }
  }

  function requestDeleteKotak() {
    showCustomConfirm("Konfirmasi Hapus", "Apakah Anda yakin ingin menghapus data saran ini?", deleteKotakExecute);
  }

  async function deleteKotakExecute() {
    const id = document.getElementById("detailIdKotak").value;
    showLoading("Menghapus data...");
    try {
      await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: new URLSearchParams({
          action: "deleteKotakSaran",
          nip: currentUserNip,
          userNama: currentUserNama,
          id: id
        })
      });
      closeDetailModal();
      showCustomAlert("Berhasil", "Saran berhasil dihapus.", "success");
      loadKotakSaranData(true);
    } catch(err) {
      console.error(err);
      showCustomAlert("Kesalahan", "Gagal menghapus data.", "warning");
    } finally {
      hideLoading();
    }
  }
</script>
